choice_overrides:
  pretest_v1:
    llm_knowledge:
      1:
        B: >-
          利用者から操作方法について質問されたら、最新版の取扱説明書から操作手順や注意点を検索し、その情報をAIに渡して案内文を作成させる。回答の品質を点検する際は、AIに渡した資料に必要な操作条件や注意点が記載されているかを評価項目とし、その結果を案内文の品質評価に利用する。
        D: >-
          改訂後の取扱説明書をAIの追加訓練に利用し、製品の操作手順や注意点を学習させる。利用者から質問を受けた際には、訓練済みのAIに学習で使った説明書の関連箇所を取り出させ、その内容を回答の根拠として案内文を作成させる。
        E: >-
          製品の新しい操作手順をAIに学習させるため、改訂後の取扱説明書をRAGの検索用索引に登録する。説明書が更新された場合も索引の内容を入れ替えて対応し、利用者から質問を受けた際は、登録した内容を学習済みのAIに操作手順や注意点を案内させる。
    multi_agent:
      1:
        D: >-
          図書館の案内を行う1つのAIエージェントに、「蔵書担当として本の有無を調べる指示」と「利用条件担当として貸出規則を確認する指示」を順番に与える。指示ごとに得られた回答を別々の担当エージェントの調査結果として整理し、学生への案内に利用する。
        E: >-
          図書館の案内AIに、本の有無を調べる機能と、貸出条件を確認する機能をそれぞれ用意する。2つの機能に「蔵書担当AI」「貸出条件担当AI」という名前を付け、1つのAIがそれぞれの機能を使って得た情報を、2つの担当AIが分担して調べた結果としてまとめ、学生への案内を作成する。
    memory_process:
      1:
        B: >-
          利用者が「辛い料理は避けたい」と伝えた会話を、利用者ごとの履歴として全文保存する。別の日の相談でも以前の希望に沿った献立を提案するため、過去の会話履歴は保存先に残しておき、AIには今回の相談内容だけを渡して回答を作成させる。
        D: >-
          利用者が「辛い料理は避けたい」と伝えた際、その希望に沿った献立の質問と回答の例を学習用データに加え、AIを追加訓練する。別の日に同じ利用者が相談したときは、追加訓練したAIからその利用者の以前の希望を取り出し、献立の条件に反映させる。
        E: >-
          利用者が「辛い料理は避けたい」と伝えた後、同じ会話の中で続けて献立を相談したときにも、その希望を反映できるよう、直前までの会話履歴をAIに渡す機能を設ける。この会話内で履歴を参照する機能を利用者ごとの長期記憶として採用し、別の日に新しく相談したときも以前の希望に沿った献立を提案させる。
  retest_v1:
    llm_knowledge:
      1:
        D: >-
          改訂後の対応手順書を、本文とページ番号を含む学習用データにまとめてAIを追加訓練する。社員から問い合わせを受けた際には、追加訓練したAIの内部から、学習時に使った手順書の該当箇所とページ番号を検索して取り出し、その情報を根拠に案内文を作成させる。
        E: >-
          改訂後の対応手順書を、社内Wi-Fiの接続方法やパスワードの再設定方法などの項目に分け、文書検索用の索引へ登録する。この登録作業をAIモデルに新しい対応方法を学習させる工程として実施し、登録後は追加訓練を終えたAIに社員からの問い合わせへの案内を作成させる。
    multi_agent:
      1:
        B: >-
          観光候補担当が施設を選んだ後は、その選定結果を日程担当に引き継ぎ、日程担当は訪問順や滞在時間の調整を行う。移動時間や営業時間を確認した結果、17時までに出発駅へ戻る計画を組めない場合は、施設の再選定を観光候補担当に依頼する工程は設けず、日程担当が選定済みの施設を使って計画を作成する。
        C: >-
          各AIに「観光候補」「日程」「移動確認」という役割名を与えると調査範囲や判断方法が定まるため、3つの担当に役割名を設定し、その名前を旅行計画の担当手順として利用する。
        D: >-
          旅行計画を作成するAIを1つ用意し、回答を「観光候補」「日程」「移動」の3つの欄に分けて作成させる。各欄の内容をそれぞれ「観光候補担当AI」「日程担当AI」「移動確認担当AI」の作業結果として記録し、3つの担当の成果をまとめた旅行計画として利用者に提示する。
        E: >-
          旅行計画を作るAIエージェントを1つ用意し、観光候補の調査、日程作成、移動確認を順番に行わせる。各段階に「観光候補担当AI」「日程担当AI」「移動確認担当AI」という名前を付け、3つの担当AIが処理を引き継ぐ構成として運用する。
    memory_process:
      1:
        D: >-
          利用者が「ピーマンを避けたい」と伝えた内容を利用者IDと組にして学習用データへ追加し、献立提案AIを追加訓練する。別の日の相談では、利用者IDを指定して、追加訓練に使った希望をそのAIから利用者別の保存記録として読み出し、献立の条件に反映させる。
        E: >-
          利用者が「ピーマンを避けたい」と伝えた発言を、相談ごとに管理する会話履歴へ記録し、その相談中の献立提案に利用する。別の日に新しい相談が始まった際は、新しい相談の会話履歴をAIに渡して、前回伝えた食材の希望も踏まえた献立を作成させる。
