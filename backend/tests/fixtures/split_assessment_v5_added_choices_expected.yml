source_bank: split-actions-v4
added_choices:
  pretest_v1:
    llm_knowledge:
    - number: 1
      M1: 説明書の一部を一度AIに入力するとその内容がモデルの重みに保存されるため、初回の問い合わせで示した操作手順を、次回以降はモデルが覚えた情報として回答に利用する。
      M1_reason: 回答時の入力がモデルの重みを更新するという誤信念。既存M1の「最新版なら出力も正確」と区別。
      M3: 取扱説明書をRAGの検索対象へ登録することはモデルに製品知識を追加訓練する処理と同じため、最新版の説明書を検索用の索引へ追加し、その登録を製品知識の学習として案内に利用する。
      M3_reason: 文書検索への登録とモデル追加訓練のカテゴリー混同。既存M3の「追加訓練と回答時検索の同一視」とは方向が逆。
    - number: 2
      M1: 回答順を示す指示を繰り返しAIへ送るとモデルの重みがその形式に適応するため、「結論・操作手順・注意点」の順を毎回指定し、指示の反復によってモデル自体の回答形式を調整する。
      M1_reason: 指示の反復が重みを調整するとの誤信念。既存M1は訓練データへの過度な一般化。
      M3: プロンプトで回答順を指定する操作はモデルの重みを追加訓練で更新する処理と同じため、「結論・操作手順・注意点」の指示文を設定し、その入力操作をモデル自体の形式調整として利用する。
      M3_reason: プロンプト設計と追加訓練の分類誤り。既存M3のプロンプト内資料と外部検索の混同とは別。
    - number: 3
      M1: 職員が追加訓練後の回答を採点すると、その評価結果がモデルの重みへ反映されるため、訓練済みAIの回答形式を職員が確認し、採点結果を次の回答形式の調整に利用する。
      M1_reason: 評価しただけで重みが更新される誤信念。既存M1の訓練事例からの過度な一般化と区別。
      M3: 質問と回答の見本をプロンプトへ含める操作は学習用データによる追加訓練と同じ処理のため、担当者が確認した回答例を毎回の入力に加え、その入力をモデルの回答方法の学習として扱う。
      M3_reason: 例示プロンプトと追加訓練のカテゴリー混同。既存M3のRAG登録と追加訓練の混同と区別。
    multi_agent:
    - number: 1
      M1: 担当の役割名を設定すると必要な調査範囲や判断方法も自動的に定まるため、「蔵書担当」「貸出条件担当」という名前を各AIに与え、その名前を調査内容の設定として利用する。
      M1_reason: 役割名だけで担当の処理内容が成立するという誤信念。既存M1は両担当に同じ仕事を任せる誤信念。
      M3: 蔵書の有無を調べる関数と貸出条件を確認する関数を別々に用意することは、2つのエージェントを設けることと同じため、1つのAIが呼び出す処理を2つの関数に分け、2つの担当AIとして数える。
      M3_reason: 通常の関数とAIエージェントのカテゴリー混同。既存M3は1つのAIへの2役指示。
    - number: 2
      M1: 蔵書担当が返した情報は担当間で受け渡した時点で内容の正確さも確認済みになるため、蔵書担当の貸出状況を利用条件担当の確定情報として採用し、その結果に沿って貸出候補を選ぶ。
      M1_reason: 情報の受け渡しで出所・正確性まで確定するという誤信念。既存M1は担当別指示による自動共有。
      M3: 蔵書担当と利用条件担当の結果を同じ画面に並べることは担当間で情報を交換する仕組みと同じため、蔵書と貸出条件の結果を2つの表示欄にまとめ、その画面表示を情報共有の仕組みとして利用する。
      M3_reason: 出力の画面表示と担当間の情報交換のカテゴリー混同。既存M3は検索ツールをエージェントとして数える混同。
    - number: 3
      M1: 蔵書担当と貸出条件担当がそれぞれ自分の条件を満たす結果を返せば案内全体の条件も満たされるため、本の有無と貸出規則を別々に確認し、両担当の結果を順番に並べた回答を最終案内に採用する。
      M1_reason: 各担当の局所的な成立条件から全体の妥当性を保証する誤信念。既存M1は情報の鮮度・正確性の保証。
      M3: 一度の回答に設けた「蔵書情報」と「貸出条件」の欄は別々のAIの成果に当たるため、1つのAIでその2欄をまとめて生成し、その表示を担当エージェント間の結果の統合として利用する。
      M3_reason: 回答欄と独立した担当の結果のカテゴリー混同。既存M3は条件分岐とエージェントの混同。
    memory_process:
    - number: 1
      M1: 利用者が一度希望をAIに伝えるとモデルが会話を越えてその人の好みを保持するため、初回に「辛い料理は避けたい」と入力し、別の日の献立もモデルが覚えた希望に沿って提案させる。
      M1_reason: 一度入力した好みが次回も内部に残るという誤信念。既存M1は全文の保存だけで次回取得できるとの誤信念。
      M3: 同じ会話の中で直前の発言を参照する機能は別の日にも希望を保持する長期記憶と同じため、会話内の発言履歴を利用する機能を、利用者ごとの継続的な記憶管理として使う。
      M3_reason: 会話中の履歴参照と会話をまたぐ長期記憶のカテゴリー混同。既存M3は追加訓練と記憶管理の混同。
    - number: 2
      M1: 保存記録を検索結果の関連度順に並べれば、希望を伝えた時期にかかわらず現在の条件が上位に来るため、以前の「辛い料理は避けたい」と新しい「少し辛い料理も食べたい」の記録を関連度順に検索し、先頭の希望を献立に採用する。
      M1_reason: 検索の関連度が記録の新旧や有効性まで保証するという誤信念。既存M1は今回の応答で保存記録も自動更新されるという誤信念。
      M3: 希望の変更後にAIが生成した献立の回答文は利用者本人の現在の希望を保存した記録と同じため、少し辛い料理を含む献立の提案文を保存し、その文章を次回の食事希望の記録として利用する。
      M3_reason: AIの生成した献立と本人が表明した希望の記録の混同。既存M3は共通指示と利用者別記憶の混同。
    - number: 3
      M1: 利用者の感想をAIに何度か入力するとその改善内容がモデルの重みに定着するため、「量が多い」という感想を複数回AIへ伝え、後日の献立も調整済みのモデルの回答に合わせる。
      M1_reason: 感想入力の反復だけで重みが更新されるという誤信念。既存M1は自己評価が記憶を更新するとの誤信念。
      M3: 利用者が感想を見返せる会話履歴の表示はAIが次回に必要な情報を検索する記憶管理と同じため、「次から量を少なめに」という発言を履歴画面に表示し、その画面を次回の希望の保存先として利用する。
      M3_reason: 利用者向けの履歴表示とAI用記憶管理のカテゴリー混同。既存M3はプロンプトへの会話貼付と記憶管理の混同。
