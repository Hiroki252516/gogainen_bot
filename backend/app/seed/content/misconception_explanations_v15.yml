# 誤概念の説明ファイル（問題バンク version: 15 に対応）
# M1/M3の各選択肢を、各カテゴリー内の上から1〜3番目で対応付ける。
# source_excerptは選択肢全体ではなく、誤りの箇所を示す短い抜粋。
# 問題バンクそのもの・正解選択肢・採点設定は変更しない。
source_question_bank_version: 15
explanation_schema_version: 1
purpose: 学習確認問題・再テストのM1/M3選択肢について、誤っている箇所と分類根拠を説明する。問題・選択肢の原文は変更しない。
mapping_rules:
  choice_index: 各問題のchoices.M1またはchoices.M3の上から1〜3番目。問題の選択肢順が変わった場合は再対応付けが必要。
  source_excerpt: 提示されたversion 15の該当選択肢から、誤解の焦点がわかる部分を引用。原文全体ではない。
  error_point: どの考え方が誤っているかの説明。
  classification_reason: なぜM1（働きの誤解）またはM3（仕組みのカテゴリー混同）に分類したか。
  correct_understanding: 選択肢を訂正するときに伝えるべき理解。
  qualification: 正しい場合もあり得る条件や、分類・設問としての注意点（該当項目のみ）。
definitions:
  M1: 仕組みの働き・因果関係・条件・結果についての誤信念。
  M3: 異なる種類の対象・技術・処理を同じカテゴリーの仕組みとして扱う誤認。
  scope_note: 分類は本研究の操作的定義であり、選択された誤答だけで学習者の内的な誤概念を確定できない。
references:
- subject: RAGと追加訓練
  url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/retrieval-augmented-generation
- subject: AIエージェントの連携
  url: https://openai.github.io/openai-agents-python/multi_agent/
- subject: エージェントが使うツール
  url: https://openai.github.io/openai-agents-python/tools/
- subject: 記憶の抽出・統合・検索
  url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/what-is-memory?view=foundry
- subject: 誤答選択肢の設計指針
  url: https://www.kuleuven.be/english/stuvo/education/leuvenlearninglab/support/assessment-feedback/design-assessment-and-feedback/designing-an-exam-or-test/multiple-choice-questions
terms:
  llm_knowledge:
    variants:
    - variant_key: learning_round_v1
      explanations:
        M1:
        - choice_index: 1
          source_excerpt: モデルの重みが更新されたことで、新しい規程をAIが覚えた
          error_point: テスト時に規程を入力して正答できたことを、学習済み重みの更新が起きた証拠だと誤って判断している。
          classification_reason: 入力を参照して答えられる動作から、重み更新という起きていない因果関係を推測するためM1。
          correct_understanding: 通常の回答生成で規程を見せても、それだけで重みは更新されない。別の会話で必要なら規程を再取得して参照させる。
        - choice_index: 2
          source_excerpt: 問い合わせのたびにAIへ渡せば、回答を重ねるうちにモデルの重みも更新される
          error_point: 回答例を毎回入力へ含めるだけで、その反復によって追加訓練が進むと思っている。
          classification_reason: 回答例の提示による出力の誘導を、重み更新が発生する仕組みの働きと誤って解釈しているためM1。
          correct_understanding: 例を入力に含める少数例提示と、訓練データでモデルの重みを更新する追加訓練は別。
        - choice_index: 3
          source_excerpt: その順序がモデルの重みに定着する
          error_point: 回答順序の指示を一度入力すればモデルの重みが変わり、以後も指示なしで維持されると思っている。
          classification_reason: プロンプト入力の効果と重み更新の因果関係についての誤信念のためM1。
          correct_understanding: プロンプトはその回答の形式を誘導する。継続適用は共通指示の再使用などで行い、重み更新とは区別する。
        M3:
        - choice_index: 1
          source_excerpt: 取り出せるようにする処理を、回答方法を覚えさせる追加訓練と同じ仕組みとして扱う
          error_point: 過去の回答例を検索して見せる機構と、モデルを追加訓練する機構を同じものとして分類している。
          classification_reason: 回答時の外部検索と学習時のモデル調整という異なる技術カテゴリーの同一視なのでM3。
          correct_understanding: 例を検索してプロンプトへ渡しても、その処理自体はモデルの重みを更新しない。
        - choice_index: 2
          source_excerpt: 学習に使った規程の該当箇所を探して参照できるものとして、文書検索の仕組みの代わりに用いる
          error_point: 追加訓練によって学習元の規程の原文を検索・取得する機能まで得られると扱っている。
          classification_reason: モデル調整と外部文書検索のカテゴリーを混同しているためM3。
          correct_understanding: 追加訓練で規程に関する応答が可能になる場合はあるが、元文書の検索・引用は別の取得機構が必要。
          qualification: 追加訓練で関連知識を出力できる可能性自体は否定しない。
        - choice_index: 3
          source_excerpt: プロンプトそのものを、規程を継続的に保存したり必要な条文を検索したりする文書データベースとして扱う
          error_point: 規程の本文を含んだプロンプトを、文書の管理・検索をするデータベースと同じものと考えている。
          classification_reason: 今回の入力内容と、継続保存・検索のシステムを同一視するカテゴリー誤りなのでM3。
          correct_understanding: プロンプトに規程本文を含めて回答させることは可能だが、それだけで文書データベースが実装されるわけではない。
          qualification: プロンプトを保存・検索できる構成も存在するため、単に本文を入力した行為自体は誤りではない。
    - variant_key: learning_round_v2
      explanations:
        M1:
        - choice_index: 1
          source_excerpt: モデルの重みが更新されたことで、新しい規程をAIが覚えた
          error_point: 施設利用規程を見せたテストで正答したことを、追加訓練による重みの変更が起きたと誤解している。
          classification_reason: 文書参照時の正答と重み更新を誤った因果関係で結んでいるためM1。
          correct_understanding: テストで見せた規程を参照して回答することと、モデルを訓練して重みを変えることは別。
        - choice_index: 2
          source_excerpt: 問い合わせのたびにAIへ渡せば、回答を重ねるうちにモデルの重みも更新される
          error_point: 職員が確認した回答例を繰り返し入力するだけで、モデルが追加学習すると考えている。
          classification_reason: プロンプトへ例を入力する処理の効果を過大に推測しているためM1。
          correct_understanding: 例示を回答に利用することはできるが、重みの調整には別途追加訓練を行う。
        - choice_index: 3
          source_excerpt: その順序がモデルの重みに定着する
          error_point: 案内の順序を指示文で一度指定すれば、その指示がモデルに学習されると思っている。
          classification_reason: 指示による一時的な出力制御を重み更新と誤解するためM1。
          correct_understanding: 「手続き・申請期限・注意点」の形式は回答時のプロンプトで指定でき、重みは通常変わらない。
        M3:
        - choice_index: 1
          source_excerpt: 取り出せるようにする処理を、回答方法を覚えさせる追加訓練と同じ仕組みとして扱う
          error_point: 検索対象に回答例を置いて参照する方法を追加訓練と同一視している。
          classification_reason: 外部情報の検索・利用とモデルの重み調整を同じ技術に分類するためM3。
          correct_understanding: 過去の回答例の検索・提示は、学習データを使って重みを調整する訓練工程とは異なる。
        - choice_index: 2
          source_excerpt: 学習に使った規程の該当箇所を探して参照できるものとして、文書検索の仕組みの代わりに用いる
          error_point: 施設利用規程で追加訓練すると、学習元規程の該当条文を検索できると思っている。
          classification_reason: 追加訓練を文書検索・取得機構のカテゴリーとして扱うためM3。
          correct_understanding: モデルが訓練内容について回答できる場合もあるが、最新版の原文検索は別の仕組みで行う。
        - choice_index: 3
          source_excerpt: プロンプトそのものを、規程を継続的に保存したり必要な条文を検索したりする文書データベースとして扱う
          error_point: 施設利用規程を書き込んだ指示文を文書保存・検索機構と同一視する。
          classification_reason: 入力文とデータベースという別カテゴリーの混同のためM3。
          correct_understanding: 指示文に資料を含めて参照させることと、改訂文書を継続管理・検索することは異なる。
          qualification: 保存された共通プロンプトも存在するので、「入力へ含めること」そのものを誤りにしない。
    - variant_key: learning_round_v3
      explanations:
        M1:
        - choice_index: 1
          source_excerpt: FAQを検索して入力へ加えると、その文章が重みの更新にも反映される
          error_point: 回答時に検索結果を入力へ渡すだけで、モデルの重みも更新されると思っている。
          classification_reason: 検索結果の入力と訓練時の重み更新の因果関係を誤って捉えるためM1。
          correct_understanding: RAGによる入力の補足は、通常の回答生成では重みを変更しない。
        - choice_index: 2
          source_excerpt: 訓練データを使うと、例題が回答時の参照資料として添付される
          error_point: 学習時に使用した例題が、そのまま回答時に自動添付されると考えている。
          classification_reason: 訓練データ利用の結果について誤った動作を想定しているためM1。
          correct_understanding: 追加訓練はモデルの重みを調整する。例題の原文を回答時に渡すには別の保存・取得処理が要る。
        - choice_index: 3
          source_excerpt: 外部文書を入力へ添付すると、訓練データによる重み調整も起こる
          error_point: 外部文書を入力へ加えたことを原因として、同時に追加訓練まで始まると考えている。
          classification_reason: 入力への資料添付が重み更新を引き起こすという誤信念なのでM1。
          correct_understanding: 文書を参照して生成する処理と、訓練用データで重みを更新する工程は分離できる。
          qualification: 1つ目のM1とほぼ同じ因果誤認なので、診断上の重複に注意。
        M3:
        - choice_index: 1
          source_excerpt: RAGは、訓練データから重みを更新する学習工程の名称
          error_point: RAGを追加訓練の別名として分類している。
          classification_reason: 検索・参照による回答生成と学習工程のカテゴリーを取り違えるためM3。
          correct_understanding: RAGは回答時に関連文書を取得して利用する方法で、重み更新を意味しない。
        - choice_index: 2
          source_excerpt: ファインチューニングは、資料を回答時に取得する検索機能
          error_point: ファインチューニングを外部資料の検索機能として分類している。
          classification_reason: 学習工程と文書取得機能を同じカテゴリーとするためM3。
          correct_understanding: ファインチューニングはデータによるモデル調整であり、回答時の検索とは異なる。
        - choice_index: 3
          source_excerpt: 追加訓練とプロンプト設計は、同じ種類の入力編集
          error_point: 追加訓練を、質問の指示文を編集する操作と同一視している。
          classification_reason: 重み調整工程と入力文の設計という異なるカテゴリーの混同なのでM3。
          correct_understanding: プロンプト編集は通常モデルの重みを変えない。追加訓練は対応モデルを訓練データで調整する。
    retest:
    - variant_key: retest_v1
      explanations:
        M1:
        - choice_index: 1
          source_excerpt: モデル自体がその分類方法を学習した
          error_point: 分類例を添えて正しく分類できた結果から、モデル自身が訓練され分類規則を覚えたと判断する。
          classification_reason: 例示による推論時の正答を重み更新の証拠とする因果的な誤解なのでM1。
          correct_understanding: 例を入力に含めた分類と追加訓練は別。例なしでも分類できることはあるが、例を示しただけで重みは変わらない。
        - choice_index: 2
          source_excerpt: 対応手順書を最新版に差し替えると、それに合わせてAIの学習済みの重みも更新される
          error_point: 外部フォルダーの手順書差し替えで、モデルの内部パラメーターも更新されると思っている。
          classification_reason: 外部文書更新と重み更新の間に存在しない自動的な因果関係を想定するためM1。
          correct_understanding: 新しい手順を利用するには、更新文書を検索・取得するなどの構成が必要。
        - choice_index: 3
          source_excerpt: 毎回同じ指示をAIへ送れば、分類を繰り返すうちにモデルの重みも調整される
          error_point: 同じ分類指示に何度も従わせることが追加訓練になると思っている。
          classification_reason: 繰り返し推論の効果を重み調整と取り違えた動作に関する誤信念なのでM1。
          correct_understanding: 通常の問い合わせ分類の反復だけでモデルの重みは更新されない。
        M3:
        - choice_index: 1
          source_excerpt: システムが似た事例を検索してAIに渡すようにする方法を、モデル自体を追加訓練する仕組みとして扱う
          error_point: 類似する分類例を検索して今回の入力へ与える方式を、追加訓練と同種と考えている。
          classification_reason: 回答時の事例検索とモデル調整のカテゴリー混同なのでM3。
          correct_understanding: 検索した分類例を参照して答えることは有効だが、モデル自体の追加訓練ではない。
        - choice_index: 2
          source_excerpt: 学習した内容から回答する方法を、問い合わせのたびに最新の手順書を検索して確認する方法と同じ仕組みとして扱う
          error_point: 訓練で得た知識からの回答を、最新の外部手順書の検索・確認と同一視する。
          classification_reason: 追加訓練と回答時の情報検索を同じカテゴリーと捉えるためM3。
          correct_understanding: モデルが手順を回答できることと、その時点で最新文書を検索して根拠を確認できることは別。
        - choice_index: 3
          source_excerpt: その指示文を、手順書から必要な箇所を検索して取り出す仕組みと同じものとして扱う
          error_point: 「最新版を確認して」と記したプロンプトを、資料の検索・取得機構と同じものと分類する。
          classification_reason: 指示文と実際の外部検索機能を同一視するためM3。
          correct_understanding: 適切な検索ツールを接続して指示で呼び出すことは可能だが、指示文だけが検索機能になるわけではない。
    - variant_key: retest_v2
      explanations:
        M1:
        - choice_index: 1
          source_excerpt: モデル自体がその分類方法を学習した
          error_point: 学内ポータルの分類例を示して正答したため、モデル自体の学習が成立したと推定する。
          classification_reason: 例を参照した回答から重み更新を推測する誤った因果理解なのでM1。
          correct_understanding: Few-shotの例示は通常の推論であり、重みを変える追加訓練とは別。
        - choice_index: 2
          source_excerpt: ITサポートマニュアルを最新版に差し替えると、それに合わせてAIの学習済みの重みも更新される
          error_point: マニュアル更新が自動的にモデルの重みに反映されると思っている。
          classification_reason: 外部ファイル更新と学習済みパラメーター更新の誤った因果関係なのでM1。
          correct_understanding: 最新版を検索できるように文書の取得処理を整えることと、モデルの重み更新は別。
        - choice_index: 3
          source_excerpt: 分類を繰り返すうちにモデルの重みも調整される
          error_point: 3分類を指示して何度も回答させるだけで、モデルが追加学習すると考える。
          classification_reason: 推論を繰り返すことの効果への誤信念なのでM1。
          correct_understanding: 同じ指示を繰り返し与えても、通常はモデルの重みは変わらない。
        M3:
        - choice_index: 1
          source_excerpt: 似た事例を検索してAIに渡すようにする方法を、モデル自体を追加訓練する仕組みとして扱う
          error_point: 正解分類例を検索して渡す検索方式を、訓練工程と同じものに分類する。
          classification_reason: 検索・参照と追加訓練のカテゴリーを混同するためM3。
          correct_understanding: 過去の分類例を参照して分類する方式自体は有効だが、追加訓練とは別。
        - choice_index: 2
          source_excerpt: 学習した内容から回答する方法を、問い合わせのたびに最新のマニュアルを検索して確認する方法と同じ仕組みとして扱う
          error_point: ITマニュアルによるモデル追加訓練と、最新版の検索・取得を同じ仕組みとする。
          classification_reason: モデルの学習工程と外部文書取得機能のカテゴリー混同なのでM3。
          correct_understanding: 訓練内容を回答できても、原文の検索や最新性の確認が自動で起こるわけではない。
        - choice_index: 3
          source_excerpt: その指示文を、マニュアルから必要な箇所を検索して取り出す仕組みと同じものとして扱う
          error_point: 「最新版を確認して答える」という指示を検索機能の実体として分類する。
          classification_reason: プロンプトによる指示と文書検索ツールの混同なのでM3。
          correct_understanding: 指示に従って検索するには、文書を参照できる入力や検索機能の接続が必要。
  multi_agent:
    variants:
    - variant_key: learning_round_v1
      explanations:
        M1:
        - choice_index: 1
          source_excerpt: 検討担当は情報源が十分に確認されていると考え
          error_point: 情報収集専門のAIから渡されたというだけで、情報源の信頼性も確認済みだと考える。
          classification_reason: 担当を分けたことによる情報の信頼性についての誤った動作理解なのでM1。
          correct_understanding: 誰が調べたかだけでは情報の検証の有無は決まらない。必要な確認・確認結果の受け渡しを設計する。
          qualification: 情報収集担当が実際に検証した根拠を渡したなら、後続の担当がそれを利用すること自体は適切。
        - choice_index: 2
          source_excerpt: 役割名を各AIに付ければ、どの情報をどの順番で渡すかも自動的に決まる
          error_point: 役割名を設定するだけで、受け渡し内容や順序も確定し連携できると思う。
          classification_reason: 役割名の設定が情報連携を自動的に生むとする因果の誤信念なのでM1。
          correct_understanding: 各担当が利用できる情報の受け渡し先・内容・手順を連携機構として用意する。
        - choice_index: 3
          source_excerpt: 両者が同じ回答内容を出さなければ、結果を引き継いで連携することはできない
          error_point: 情報収集担当と案内文作成担当の出力が同一でなければ連携できないと考える。
          classification_reason: 異なる役割の担当が連携するための条件を誤って捉えているためM1。
          correct_understanding: 調査報告と住民向け案内は目的が異なるため出力が異なってよく、必要な情報を引き継げることが重要。
        M3:
        - choice_index: 1
