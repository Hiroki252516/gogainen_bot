version: 2
terms:
  llm_knowledge:
    enrichment:
      variants:
        - variant_key: learning_enrichment_v1
          scenario_type: application
          scenario: 市立図書館の案内AIに、昨日改訂された利用規程を反映した回答をさせたい。モデルの再学習は行わず、回答の形式も指定する。
          task: この条件に合う仕組みの説明を三つ選びなさい。
          choices:
            correct:
              - 回答時に該当する規程を検索し、その抜粋を入力文脈へ加える。
              - 指示文の書き方を変えると、同じモデルでも返答形式が変わり得る。
              - 訓練例で重みを調整する工程は、資料検索とは別の方法として扱う。
            M1:
              - 検索した規程は、参照された時点でモデルの重みに取り込まれる。
              - 指示文に規則を書くと、その内容が訓練済み重みに追加される。
              - 入力へ説明を加えると、その情報は利用者別の学習データに記録される。
            M3:
              - RAGは、回答を閲覧する利用者向け検索画面の分類に当たる。
              - プロンプト設計は、回答用資料を保管して取り出すデータベースである。
              - ファインチューニングは、推論時に資料を添付する検索処理である。
        - variant_key: learning_enrichment_v2
          scenario_type: prediction
          scenario: 同じ基盤モデルに「表で答える」と指示した場合と、「一段落で答える」と指示した場合を比べる。どちらも追加学習はしていない。
          task: 起こり得る変化と、重み更新との関係を示す説明を三つ選びなさい。
          choices:
            correct:
              - 指示に応じて出力の形が変わっても、学習済み重みが変化したとは限らない。
              - プロンプトはモデルへ渡す入力の構成を調整する方法として使える。
              - 重みを更新するには、訓練データを使う別の学習工程を行う。
            M1:
              - 指示を変えて出力が変わると、学習済みパラメーターも更新される。
              - 出力形式を指示すると、その形式が以降もモデルに学習済み知識として保持される。
              - 出力に現れた新しい情報は、その都度モデル内部へ保存されていく。
            M3:
              - プロンプトエンジニアリングは、モデルを訓練する工程の一種である。
              - 追加学習は、回答時の入力文を整えるだけの操作に分類される。
              - モデルの出力形式を指定する機能は、外部資料の検索機構に当たる。
        - variant_key: learning_enrichment_v3
          scenario_type: comparison
          scenario: 社内FAQで、更新頻度の高い手順書を回答時に参照する案と、例題を使ってモデルを追加訓練する案を比較している。
          task: 二つの案の処理時点や情報の扱いを区別する説明を三つ選びなさい。
          choices:
            correct:
              - FAQ参照案では、回答時に該当文書を取得して入力へ加えられる。
              - 例題による追加訓練では、学習データを使って重みを調整する。
              - 文書参照と重みの調整は、異なる処理として組み合わせることもできる。
            M1:
              - FAQを検索して入力へ加えると、その文章が重みの更新にも反映される。
              - 訓練データを使うと、例題が回答時の参照資料として添付される。
              - 外部文書を入力へ添付すると、訓練データによる重み調整も起こる。
            M3:
              - RAGは、訓練データから重みを更新する学習工程の名称である。
              - ファインチューニングは、資料を回答時に取得する検索機能である。
              - 追加訓練とプロンプト設計は、同じ種類の入力編集として分類できる。
        - variant_key: learning_enrichment_v4
          scenario_type: boundary
          scenario: ある回答システムでは、検索した記事を回答ごとに入力へ添付する。別のシステムでは、例題を使ってモデルを訓練し直す。
          task: 両者を区別する判断基準として適切な説明を三つ選びなさい。
          choices:
            correct:
              - 検索結果をその場の入力として使うか、訓練で重みを調整するかを確認する。
              - 記事を回答時に取得する方式は、モデル外の情報を文脈へ加える。
              - 例題で重みを調整する方式は、入力文の書き換えだけではない。
            M1:
              - 回答に記事の内容が現れた場合、モデルの重みも同時に変わっている。
              - 検索結果を入力へ加えると、その内容がモデルの知識更新に反映される。
              - 訓練例を増やす処理は、既存の指示文を長くする操作にすぎない。
            M3:
              - 記事を検索する方式は、モデルの訓練工程として分類する。
              - 重みを調整する方式は、外部文書をその場で探す仕組みとして扱う。
              - 入力文を整理するプロンプトは、訓練用データの保管場所である。
        - variant_key: learning_enrichment_v5
          scenario_type: diagnosis
          scenario: 開発担当者は「手順書を検索して回答へ添付する方式」と「例題を使ってモデルを調整する方式」を同じ設定画面で管理している。
          task: それぞれの方式を正しく説明する記述を三つ選びなさい。
          choices:
            correct:
              - 前者は推論時に参照文書を使い、後者は訓練時に重みを調整する。
              - 指示文の調整では、モデルへ渡す入力の内容や形を指定できる。
              - 文書検索、プロンプト設計、追加訓練は異なる役割を持つ。
            M1:
              - 文書を回答へ添付すると、添付内容が訓練済み重みに反映される。
              - 指示文で専門用語を説明すると、その用語が追加学習される。
              - 例題から重みを調整する処理は、検索結果を一時表示するだけである。
            M3:
              - プロンプトは、訓練データをモデルへ適用して重みを調整する機能である。
              - 追加訓練は、回答直前に関連文書を取得して添付する機能である。
              - RAGは、利用者が検索語を入力する画面そのものとして分類される。
    conceptual_change:
      variants:
        - variant_key: learning_conceptual_change_v1
          scenario_type: application
          scenario: 医療機関の案内AIが、診療時間の変更をすぐ回答へ反映し、学習済みモデルの更新作業は避けたい。回答には根拠資料も使わせる。
          task: 必要な処理と、重み更新との境界を示す説明を三つ選びなさい。
          choices:
            correct:
              - 回答時に更新済み資料を検索し、該当箇所をモデルの入力へ含める。
              - 回答の構成を指示する文面と、参照資料を取得する処理は別の役割を持つ。
              - 追加訓練を行う場合は、訓練データを使った重み調整を伴う。
            M1:
              - 資料を入力へ含めると、参照と同時に学習済み重みが変更される。
              - 回答形式を指示すると、その指示がモデルの訓練例として登録される。
              - 最新資料を使うには、資料の検索より先に重みを更新する必要がある。
            M3:
              - RAGは、モデルの重みを訓練データで更新する手法に当たる。
              - ファインチューニングは、回答時の資料検索を行う仕組みである。
              - プロンプトは、外部資料を格納して検索する知識ベースである。
        - variant_key: learning_conceptual_change_v2
          scenario_type: prediction
          scenario: 同じ質問へ、検索で取得した最新資料を添えた場合と、資料を添えずに指示文だけ変えた場合の回答を比べる。どちらもモデル訓練は実施しない。
          task: 回答の変化と各情報源の関係を説明する記述を三つ選びなさい。
          choices:
            correct:
              - 資料を添えると、その回答では外部情報を文脈として利用できる。
              - 指示文の変更は出力に影響し得るが、単独では重み更新を意味しない。
              - 資料の検索とモデルの追加訓練は、別々の処理として判定する。
            M1:
              - 資料を添えて回答できた場合、その記述が学習済み重みに保存される。
              - 指示に沿った回答が出ると、モデルは指示内容を訓練済みになる。
              - 外部情報が出力に反映されれば、モデル内部の知識も更新されたことになる。
            M3:
              - 入力指示の変更は、例題で重みを調整する訓練工程として扱う。
              - 検索で取得した資料は、モデルを訓練するデータセットと同じ分類である。
              - 追加訓練は、出力形式をその場で指定するプロンプト機能に当たる。
        - variant_key: learning_conceptual_change_v3
          scenario_type: comparison
          scenario: 技術文書の更新を回答へ反映する案と、過去の問い合わせ例を学習させて回答傾向を調整する案が検討されている。
          task: 情報の置き場所と処理の違いを正しく捉えた説明を三つ選びなさい。
          choices:
            correct:
              - 文書を検索する案では、取得した内容を回答時の入力文脈に利用する。
              - 問い合わせ例を使う案では、訓練工程でモデルの重みを調整し得る。
              - プロンプトの工夫は、モデルへ渡す指示や入力を設計する操作である。
            M1:
              - 文書検索の結果が回答に使われると、その内容は重みに蓄積される。
              - 問い合わせ例を見せるだけなら、モデルの重みは追加訓練で変わる。
              - 指示文を整える操作には、外部資料の取得処理も含まれる。
            M3:
              - 外部文書の取得は、モデルの内部パラメーターを訓練する工程である。
              - 問い合わせ例による訓練は、回答時の検索拡張として分類される。
              - プロンプト設計は、訓練後の重みを保管するデータベースの機能である。
        - variant_key: learning_conceptual_change_v4
          scenario_type: boundary
          scenario: 回答システムの設定を調べると、資料検索、入力指示の編集、訓練データによるモデル調整が別々に記録されていた。
          task: それぞれの分類を見分ける基準を示す説明を三つ選びなさい。
          choices:
            correct:
              - 回答時の情報取得、入力の指示、訓練による重み調整を分けて確認する。
              - 参照資料を回答時だけ使うなら、検索結果と学習済み重みは区別される。
              - 訓練データを用いてパラメーターを調整する場合は学習工程に当たる。
            M1:
              - 資料を繰り返し検索すると、取得内容がモデルの重みに順次書き込まれる。
              - 指示文が回答へ反映される場合、モデル内部の重みも更新されている。
              - 訓練データを指定しても、実際の重み調整は行われず入力だけが変わる。
            M3:
              - 資料検索は、モデルの学習済みパラメーターを更新する方法である。
              - 重み調整は、推論時の入力文脈へ資料を追加する操作である。
              - プロンプトの編集は、外部文書を保存・検索する仕組みとして分類される。
        - variant_key: learning_conceptual_change_v5
          scenario_type: diagnosis
          scenario: 担当者は、回答時に社内資料を参照する設定を「モデルへ知識を学習させた」と報告した。別の担当者は例題でモデルを調整したと報告した。
          task: 二つの報告の違いを検討する説明を三つ選びなさい。
          choices:
            correct:
              - 資料の参照だけなら、回答時に情報を使っても重み更新とは限らない。
              - 例題でモデルのパラメーターを調整したなら、訓練工程を実施している。
              - 指示の編集、資料の取得、モデルの訓練は処理の役割で区別できる。
            M1:
              - 資料を回答に使った記録があれば、その資料で重みも調整されている。
              - 例題による訓練を行っても、調整されるのは回答時の入力文脈である。
              - 指示の変更を保存すれば、次の回答前にモデルの重みも更新される。
            M3:
              - 回答時に資料を取得する方式は、追加訓練という種類に分類される。
              - 例題から重みを調整する方式は、外部検索という種類に分類される。
              - プロンプト編集は、モデル内部の知識を保存するストレージに当たる。
  multi_agent:
    enrichment:
      variants:
        - variant_key: learning_enrichment_v1
          scenario_type: application
          scenario: 災害対応チームのAIでは、情報収集、避難計画、住民向け案内を別々に担当させ、結果を次の担当へ渡したい。
          task: この構成の連携を説明する記述を三つ選びなさい。
          choices:
            correct:
              - 役割を持つ複数のエージェントが、担当結果を次の処理へ受け渡せる。
              - 調査結果を計画担当へ共有すると、複雑な課題を連携して進められる。
              - 最終案内を作る担当は、前段の結果を受けて別の判断を行える。
            M1:
              - 担当が共有した情報は、後続の判断でも正しい前提として利用できる。
              - 担当の役割名から、必要な情報の受け渡し先と順序が決まる。
              - 住民向け案内の担当は、調査担当と一致する回答でなければ結果を引き継げない。
            M3:
              - 担当結果のファイルそのものが、目的や判断を持つエージェントである。
              - 条件分岐の数が増えれば、単一処理も複数エージェントとして分類できる。
              - 大規模な単一モデルを使えば、役割分担がなくても協調主体になる。
        - variant_key: learning_enrichment_v2
          scenario_type: prediction
          scenario: 調査役の出力を計画役へ渡す構成と、同じプログラムが調査から案内まで一度に処理する構成を比べる。
          task: 設計変更によって生じる違いを説明する記述を三つ選びなさい。
          choices:
            correct:
              - 役割間で結果を受け渡す構成では、担当ごとの処理を連携させられる。
              - 一つの処理を複数段階に分けただけでは、独立した主体があるとは限らない。
              - 連携の有無は、処理数より役割と情報交換の設計で判断する。
            M1:
              - 調査結果を計画役へ渡すと、情報の妥当性も引き継がれる。
              - 計画役が調査結果を受け取ると、情報源の信頼性も確認済みになる。
              - 役割を分けた担当は、異なる判断をすると連携できなくなる。
            M3:
              - 一つの処理を複数手順で書いたものは、主体間協調というカテゴリーに当たる。
              - 担当間で渡す結果は、それ自体が独立した判断主体として機能する。
              - マルチエージェントは単一モデルの処理速度を上げる方式である。
        - variant_key: learning_enrichment_v3
          scenario_type: comparison
          scenario: 問い合わせ対応で、検索ツールの結果を一つの担当が整理する案と、調査担当・回答担当が情報を共有する案を比較する。
          task: ツールの利用とエージェント間の協力を区別する記述を三つ選びなさい。
          choices:
            correct:
              - 検索ツールは情報を返す機能であり、担当エージェントは結果を評価できる。
              - 調査担当から回答担当へ根拠を渡すと、複数の役割が連携する。
              - ツールの返却値を使うことと、複数主体が協力することは別の設計要素である。
            M1:
              - ツールの出力は、共有された時点で出所と妥当性を確認済みの根拠として扱える。
              - 検索結果を共有した担当者は、同じ情報を基に同じ結論を出す。
              - 一つのエージェントが二つのツールを使うと、利用結果も次回まで記憶される。
            M3:
              - ツールが返す文章は、独立した目的と判断を持つエージェントである。
              - 複数の検索機能を置くことは、主体間の情報交換と同じ設計に当たる。
              - 担当エージェントは、検索結果を返すだけの外部機能として分類される。
        - variant_key: learning_enrichment_v4
          scenario_type: boundary
          scenario: 経費審査では、条件に応じて同じプログラムの処理経路を変える案と、申請確認役・規程確認役が判断を共有する案がある。
          task: どこから協調する複数主体の設計といえるかを示す記述を三つ選びなさい。
          choices:
            correct:
              - 分岐だけでなく、役割を持つ担当同士の判断や結果の受け渡しを確認する。
              - 一つのワークフローでも条件分岐は作れるため、分岐数だけでは決まらない。
              - 規程確認の結果を申請確認役が利用する設計には、役割間の連携がある。
            M1:
              - 条件分岐の設定には、担当間で情報を受け渡す処理も含まれる。
              - 申請確認役の情報は、一度共有すれば有効期限を考えず使い続けられる。
              - 担当間で異なる判断が出た場合、結論を一つにするには判断を揃える必要がある。
            M3:
              - 分岐ワークフローは、複数の自律主体が協力する仕組みとして扱われる。
              - 共有された判定結果は、判断を行った担当者と同じ主体に分類される。
              - 役割分担は単一モデルの内部処理を細かく分ける方法に限られる。
        - variant_key: learning_enrichment_v5
          scenario_type: diagnosis
          scenario: 開発者は「検索、要約、回答の三つのプロンプトを用意したので、マルチエージェントだ」と説明した。実装には結果の受け渡し設計がまだない。
          task: この説明を評価する観点として適切な記述を三つ選びなさい。
          choices:
            correct:
              - 指示文の数だけでなく、担当の役割や結果共有が実装されているかを確認する。
              - 同一処理の手順分割と、複数主体の協力設計を区別する必要がある。
              - 各担当が別の判断を行い、その結果を次へ渡す構成なら連携を説明できる。
            M1:
              - プロンプトを役割ごとに分けると、各担当の間で結果も受け渡される。
              - 検索の返却結果は、設計上の検証を経ずに確定した知識として扱える。
              - 異なる担当が別々の判断を返す場合、全体の結論は一貫しなくなる。
            M3:
              - 複数の指示文を用いることは、主体を協調させる設計そのものである。
              - 検索や要約の処理機能は、独立した目的を持つ担当者と同じである。
              - 手順を分けた単一の処理は、複数エージェントの協調と同じ分類になる。
    conceptual_change:
      variants:
        - variant_key: learning_conceptual_change_v1
          scenario_type: application
          scenario: 旅行計画AIで、候補地の調査役が条件をまとめ、予算担当が費用を比較し、日程担当が候補を組み立てる。各担当は判断結果を共有する。
          task: この設計の成立条件を正しく説明する記述を三つ選びなさい。
          choices:
            correct:
