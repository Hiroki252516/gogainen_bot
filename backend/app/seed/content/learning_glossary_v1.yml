version: learning-glossary-v1
entries:
  - id: weights
    term: 重み
    aliases: [重み, ウェイト]
    definition: AIの内部の計算で、ある情報をどれくらい結果に反映するかに関わる数値。学習の過程で調整されます。
    sources: ["https://developers.google.com/machine-learning/glossary/fundamentals#weight"]
  - id: parameters
    term: パラメーター
    aliases: [パラメーター, パラメータ]
    definition: AIの動作を決める内部の数値の総称です。学習で調整される重みなどが含まれます。
    sources: ["https://developers.google.com/machine-learning/glossary/fundamentals#parameter"]
  - id: model
    term: モデル
    aliases: [モデル]
    definition: 入力された情報を計算で処理し、予測や文章などの結果を出す仕組み。ここでは、学習済みのAIの仕組みを指します。
    sources: ["https://developers.google.com/machine-learning/glossary/fundamentals#model"]
  - id: ai
    term: AI（人工知能）
    aliases: [AI, 人工知能]
    definition: 文章を作る、画像を見分けるなど、人の知的な活動に関わる処理をコンピューターで行う技術です。
    sources: ["https://developers.google.com/machine-learning/glossary#artificial_intelligence"]
  - id: llm
    term: LLM（大規模言語モデル）
    aliases: [LLM, 大規模言語モデル]
    definition: 大量の文章などを使って学習し、入力に応じた文章を作るAIの仕組みです。
    sources: ["https://developers.google.com/machine-learning/glossary/generative#large_language_model"]
  - id: pretraining
    term: 事前学習
    aliases: [事前学習, 事前訓練, プレトレーニング]
    definition: 様々な用途に使うための土台として、大量のデータから言葉の使い方や特徴を学ぶ処理です。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:30-32"]
  - id: additional_training
    term: 追加学習
    aliases: [追加学習, 追加訓練, 追加トレーニング]
    definition: すでに学習したAIに対し、さらにデータを使って内部の数値を調整する処理です。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:34-36", "https://developers.google.com/machine-learning/glossary/fundamentals#training"]
  - id: fine_tuning
    term: ファインチューニング
    aliases: [ファインチューニング, ファインチューン, ファインチューニング処理, fine-tuning, fine tuning]
    definition: 学習済みのAIを特定の用途に合わせるため、その用途のデータを使ってさらに学習させる方法です。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:34-36"]
  - id: inference
    term: 推論
    aliases: [推論]
    definition: ここでは、学習済みのAIが入力を処理し、予測や回答を作る処理を指します。
    sources: ["https://developers.google.com/machine-learning/glossary/fundamentals#inference"]
  - id: prompt
    term: プロンプト
    aliases: [プロンプト]
    definition: AIへ渡す質問や指示、参考となる情報を含む入力のことです。
    sources: ["https://developers.google.com/machine-learning/glossary/generative#prompt"]
  - id: prompt_engineering
    term: プロンプトエンジニアリング
    aliases: [プロンプトエンジニアリング, prompt engineering]
    definition: 望む回答を得られるよう、AIへ渡す質問や指示、参考情報の書き方を工夫することです。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:38-40"]
  - id: rag
    term: RAG（検索拡張生成）
    aliases: [RAG, 検索拡張生成]
    definition: 質問に関係する資料を外部から検索し、取り出した情報を使ってAIに回答を作らせる仕組みです。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:43-45"]
  - id: context
    term: コンテキスト
    aliases: [コンテキスト, 入力文脈]
    definition: AIが今回の回答を作るときに参照する情報。質問、指示、会話や資料の内容などが含まれます。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:26-49", "https://developers.google.com/machine-learning/glossary/generative#context_window"]
  - id: database
    term: データベース
    aliases: [データベース, DB]
    definition: 多くの情報を整理して保存し、必要な情報を探したり書き換えたりできるようにした仕組みです。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:51-66"]
  - id: knowledge_base
    term: 知識ベース
    aliases: [知識ベース, ナレッジベース]
    definition: 回答や判断に使う情報をまとめた保存先。説明書や案内文などを整理して入れておきます。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:43-66"]
  - id: agent
    term: エージェント
    aliases: [エージェント]
    definition: 与えられた目的に向けて、状況を見ながら次の行動を判断して進める担当のような仕組みです。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:71-80"]
  - id: multi_agent
    term: マルチエージェント
    aliases: [マルチエージェント, マルチ・エージェント, multi-agent, multi agent]
    definition: 複数の担当がそれぞれ判断し、情報や結果をやり取りしながら課題を進める仕組みです。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:71-84"]
  - id: tool
    term: ツール
    aliases: [ツール]
    definition: 検索や計算など、特定の処理を実行するために呼び出して使う機能です。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:180-194"]
  - id: task
    term: タスク
    aliases: [タスク]
    definition: 調べる、予定を作るなど、達成したい作業や課題のことです。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:74-84"]
  - id: task_decomposition
    term: タスク分解
    aliases: [タスク分解, タスクの分解]
    definition: 大きな課題を、調査、比較、まとめなどの小さな作業に分けることです。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:180-198"]
  - id: workflow
    term: ワークフロー
    aliases: [ワークフロー, ワーク・フロー]
    definition: 作業をどの順番で進め、条件によってどこへ進むかを決めた流れのことです。
    sources: ["backend/app/seed/content/learning_content.yml:teaching_targets.multi_agent.I"]
  - id: memory_process
    term: 記憶プロセス
    aliases: [記憶プロセス, メモリ機能, メモリー機能, 記憶機能]
    definition: 過去の会話などから必要な情報を保存し、後で取り出したり、新しい内容へ更新したりする処理です。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:47-49,216-222", "backend/app/seed/content/learning_content.yml:terms.memory_process"]
  - id: persistence
    term: 永続化
    aliases: [永続化, 永続保存]
    definition: 今回の処理や会話が終わった後でも使えるよう、情報を保存先に残しておくことです。
    sources: ["rag_agent_knowledge_base/sources/source_02.txt:64-76"]
  - id: vector
    term: ベクトル
    aliases: [ベクトル]
    definition: ここでは、文章などの特徴を表すために、複数の数値をひとまとめにしたものを指します。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:64-66", "https://developers.google.com/machine-learning/glossary#vector"]
  - id: embedding
    term: 埋め込み
    aliases: [埋め込み, 埋込み, エンベディング, エンベッディング, embedding, embeddings]
    definition: 文章などの特徴を数値の並びで表すこと。意味や特徴が近い情報を探す際などに使います。
    sources: ["rag_agent_knowledge_base/sources/source_01.txt:64-66", "https://developers.google.com/machine-learning/glossary#embedding"]
