# 仕様版51の4用語モード。問題本文と選択肢は参加者向け、teaching_targetsは提案群の教材生成用。
terms:
  - slug: transformer
    label: Transformer
    description: Transformerの基本構造とAttention・FFNの役割。
    component_terms: [Transformer, Attention, FFN, トークン]
    rag_dir: rag_ready_教材
    rag_sections: ["1.1.2.4"]
    question: Transformerの構造と、その内部にあるAttention・FFNの働きについて、正しい説明を3つ選びなさい。
    options:
      - {label: A, role: correct, body: "Transformerは、AttentionやFFNなどの層を組み合わせて作られる、ニューラルネットワークの構造である。"}
      - {label: B, role: correct, body: "Attentionは、各トークンが自分自身や他のトークンからどの程度情報を取り込むかを、計算した重みによって調整する仕組みである。"}
      - {label: C, role: correct, body: "FFNは、Attentionなどで処理された各トークンの特徴を、別の形の数値情報に変換する層である。"}
      - {label: D, role: M1, body: "Transformerでは、Attentionが文章の中から最も重要な単語を1つ選び、FFNがその単語の情報を使ってすべてのトークンを処理する。"}
      - {label: E, role: M1, body: "Attentionは、同じ単語が文章に何回現れたかを数え、出現回数が多い単語ほど強く参照する仕組みである。"}
      - {label: F, role: M1, body: "FFNは、トークン同士のつながりを比較して、Attentionが使う重みを決める役割を持つ。"}
      - {label: G, role: M3, body: "Attentionは、重要な単語を外部のデータベースから探して取り出す検索ツールである。"}
      - {label: H, role: M3, body: "FFNは、各トークンの内容を調べ、どのような回答を出すかを自分で決めるAIエージェントである。"}
      - {label: I, role: M3, body: "Transformerは、AttentionとFFNを使って翻訳や文章生成を提供するAIアプリそのものを指す。"}
      - {label: J, role: unknown, body: わからない。}
    teaching_targets:
      D: {corrected_claim: "Attentionは最も重要な1語だけを選ぶのではなく、各トークンが系列内の複数のトークン情報を重み付けして参照する。FFNは1語の情報だけで各トークンを処理するのではなく、各トークンの特徴表現を変換する。", mechanism_explanation: "Attentionはトークン間の重み付けを通じて複数の情報を各トークンの表現に反映する。その後、FFNは各トークンの表現に変換を適用する。", contrast_example: "単一の重要語だけを選んで全体を処理する説明と、系列内の複数の情報を参照して各トークンの表現を変換する説明は異なる。"}
      E: {corrected_claim: "Attentionは、単語の出現回数だけを数えてトークン間の関係を決める仕組みではない。", mechanism_explanation: "Attentionは入力されたトークンの表現に基づいて参照の重みを計算し、各トークンが文脈に応じた情報を取り込めるようにする。", contrast_example: "単語の出現回数が同じでも、語順や周囲の語が異なればトークンの表現や参照の重みは異なり得る。"}
      F: {corrected_claim: "FFNはトークン同士を比較してAttentionの重みを決める層ではなく、各トークンの特徴表現を変換する層である。", mechanism_explanation: "Attentionがトークン間の参照の重みを計算して情報を反映した後、FFNはその結果を含む各トークンの表現に変換を適用する。", contrast_example: "トークン間の参照の重みを計算するAttentionと、各トークンの表現を変換するFFNは異なる役割を担う。"}
      G: {corrected_claim: "Attentionは入力系列内のトークン表現を処理するモデル内部の仕組みであり、外部から重要語や文書を検索して取得するツールではない。", mechanism_explanation: "Attentionは入力された系列内のトークン間で情報を参照する重みを計算する。外部資料を取得する処理は検索システムが担う。", contrast_example: "入力系列内のトークン情報を関連付けるAttentionと、外部のデータベースや文書から情報を検索する処理は別の仕組みである。", wrong_category: 外部検索, correct_category: モデル内部の系列処理, boundary_criterion: 入力系列内の表現を計算するか、外部資料を取得するか}
      H: {corrected_claim: "FFNは回答を自律的に決める独立したAIエージェントではなく、各トークンの特徴表現を変換するTransformer内部の層である。", mechanism_explanation: "FFNは学習済みのパラメータに基づく計算を各トークンの表現に適用する。独立した目標を持って回答や行動を選ぶ主体ではない。", contrast_example: "各トークンの表現に計算を適用するニューラルネットワークの層と、自律的に行動を選択するエージェントは異なる。", wrong_category: 独立した判断主体, correct_category: ニューラルネットワークの層, boundary_criterion: 自律的な目的・行動選択を担うか、各トークンに変換計算を適用するか}
      I: {corrected_claim: "Transformerは翻訳や文章生成を行うアプリケーションそのものではなく、モデルを構成するニューラルネットワークの構造である。", mechanism_explanation: "Transformer構造を用いたモデルを翻訳や文章生成のアプリケーションが利用することはあるが、モデルの構造とそれを利用するアプリケーションは別のものである。", contrast_example: "Transformerを用いるモデルの内部構造と、そのモデルを使って翻訳や文章生成を提供するサービスは同じ対象ではない。", wrong_category: 利用アプリケーション, correct_category: モデルのネットワーク構造, boundary_criterion: モデル内部の構成を指すか、利用者が使うサービスを指すか}

  - slug: llm_training_stages
    label: LLMの学習段階
    description: LLMの事前学習、インストラクションチューニング、人の評価を用いる事後学習の基本。
    component_terms: [LLM, 事前学習, インストラクションチューニング, 事後学習, モデルの重み]
    rag_dir: rag_ready_教材
    rag_sections: ["1.1.3.2"]
    question: LLMの事前学習と、インストラクションチューニングなどの事後学習について、正しい説明を3つ選びなさい。
    options:
      - {label: A, role: correct, body: "事前学習では、大量の文章を使い、次に続くトークンを予測する学習などを通して、言語のパターンを学ぶ。"}
      - {label: B, role: correct, body: "インストラクションチューニングでは、指示と適切な回答を組にしたデータでモデルを訓練し、指示に沿って答えられるよう調整する。"}
      - {label: C, role: correct, body: "事後学習には、人が回答を評価した結果を学習に利用し、回答の有用性や安全性を高める調整も含まれる。"}
      - {label: D, role: M1, body: "事前学習では、文章に現れた単語の回数を覚え、その出現回数だけを使って文章の続きを予測する。"}
      - {label: E, role: M1, body: "インストラクションチューニングでは、指示と回答の例文を暗記し、初めて見る指示にも覚えた回答文を選んで返す。"}
      - {label: F, role: M1, body: "人の評価を使う事後学習では、回答に点数が付いた時点で、その点数に合わせてモデルの重みが自動的に変わる。"}
      - {label: G, role: M3, body: "事前学習は、完成したLLMに質問を入力して回答を受け取るときに行われる処理である。"}
      - {label: H, role: M3, body: "インストラクションチューニングは、会話履歴をコンテキストウィンドウに一時的に保持するための機能である。"}
      - {label: I, role: M3, body: "人の評価を使う事後学習は、完成したLLMの回答を採点して性能を測定し、その点数を記録するテストである。"}
      - {label: J, role: unknown, body: わからない。}
    teaching_targets:
      D: {corrected_claim: "事前学習では語順や文脈を含む言語パターンを学習する。", mechanism_explanation: "次のトークンを予測する過程で、前後の語や文脈に関係する情報をモデルの重みに反映する。", contrast_example: "語の数え上げだけでなく、文の続きや表現の関係を予測する。"}
      E: {corrected_claim: "インストラクションチューニングは回答例を暗記して選ぶだけの仕組みではなく、指示と回答の対応を使って応答の仕方を学習する。", mechanism_explanation: "指示と対応する回答例を学習データとして訓練し、さまざまな指示に応じる出力傾向をモデルに調整する。", contrast_example: "訓練例と完全に同じ文を再現することと、指示と回答例から応答の仕方を学習することは異なる。"}
      F: {corrected_claim: "評価点を付けるだけでは重みは変わらず、評価信号を使った訓練・最適化の工程が必要である。", mechanism_explanation: "人の評価や好みを学習に利用する工程では、定められた最適化を通じてモデルを調整する。", contrast_example: "評価結果を記録する測定と、その評価信号を訓練へ利用する処理は区別される。"}
      G: {corrected_claim: "事前学習はモデルを訓練する段階であり、完成済みモデルへ質問して回答を得る推論とは異なる。", mechanism_explanation: "事前学習ではデータを使ってパラメータを調整し、推論では固定されたモデルが入力に応じて出力する。", contrast_example: "モデルを作る訓練と、作られたモデルを使う質問応答は別工程である。", wrong_category: 推論時の利用, correct_category: モデルの訓練, boundary_criterion: 学習データでパラメータを更新するか、学習済みモデルで出力を得るか}
      H: {corrected_claim: "インストラクションチューニングは訓練による応答調整であり、会話履歴を一時保持する機能ではない。", mechanism_explanation: "指示と回答例を使った訓練でモデルの応答傾向を調整する。コンテキストウィンドウは現在の入力内で会話情報を扱う。", contrast_example: "学習時に回答傾向を調整することと、実行時に履歴を入力へ含めることは別である。", wrong_category: 実行時の一時履歴, correct_category: 学習による応答調整, boundary_criterion: 訓練データでモデルを調整するか、現在の入力情報を保持するか}
      I: {corrected_claim: "人の評価を使う事後学習は、性能を測るだけでなく評価信号を使ってモデルを調整する訓練工程を含む。", mechanism_explanation: "評価テストは結果を測定・記録するが、事後学習は評価情報を最適化に使い応答を調整する。", contrast_example: "成績を測るだけの評価と、その結果を学習に利用することは同じではない。", wrong_category: 性能評価, correct_category: 評価信号を利用する訓練, boundary_criterion: 結果を記録するだけか、評価を使ってモデルを調整するか}

  - slug: multi_agent_four_topic
    label: マルチエージェント
    description: 複数のAIエージェントの役割分担、情報受け渡し、結果統合。
    component_terms: [AIエージェント, 役割分担, 情報共有, 結果統合]
    question: 複数のAIエージェントが仕事を分担し、情報を共有する仕組みについて、正しい説明を3つ選びなさい。
    options:
      - {label: A, role: correct, body: "複数のAIエージェントに異なる役割を与え、1つの目的に向けて仕事を分担できる。"}
      - {label: B, role: correct, body: "調査を担当するAIが得た情報を別のAIに渡し、次の担当がその情報を使って作業を進められる。"}
      - {label: C, role: correct, body: "担当ごとの結果を組み合わせ、必要に応じて内容の食い違いを確認・修正し、最終的な回答にまとめられる。"}
      - {label: D, role: M1, body: "各AIエージェントに役割名を付けると、必要な情報が担当間に自動的に伝わる。"}
      - {label: E, role: M1, body: "各担当の回答を順番に並べると、回答同士の食い違いも自動的に解消され、1つの最終回答になる。"}
      - {label: F, role: M1, body: "複数の担当に仕事を分けた後で結果を修正すると、役割分担の意味が失われるため、最初に出した結果をそのまま採用する。"}
      - {label: G, role: M3, body: "指定された資料を探して結果を返す検索ツールも、情報を調べる役割があるため、独立したAIエージェントの1つである。"}
      - {label: H, role: M3, body: "1つのAIが条件に応じて処理を複数に分けると、その分岐先がそれぞれ別のAIエージェントになる。"}
      - {label: I, role: M3, body: "1つのAIに「調査」「計画」「案内」の3つの見出しで回答させると、3つのAIエージェントが仕事を分担したことになる。"}
      - {label: J, role: unknown, body: わからない。}
    teaching_targets:
      D: {corrected_claim: "役割名だけでは情報共有は起きず、担当間で結果を渡す仕組みが必要である。", mechanism_explanation: "各エージェントの入出力を調整するオーケストレーションが、必要な情報を次の担当へ渡す。", contrast_example: "担当に名前を付けることと、調査結果を次の担当の入力に含めることは別である。"}
      E: {corrected_claim: "回答を並べるだけでは矛盾は解消されず、結果を統合・確認する処理が必要である。", mechanism_explanation: "統合担当やルールが結果間の不一致を検査し、必要に応じて修正・再確認する。", contrast_example: "複数の回答を連結しただけの一覧と、整合性を確認した最終回答は異なる。"}
      F: {corrected_claim: "結果を確認・修正しても役割分担は維持できる。", mechanism_explanation: "担当別の出力を統合段階で検証し、必要な修正を加えることは協調処理の一部である。", contrast_example: "作業を分担した後に品質確認することは、分担を取り消すことではない。"}
      G: {corrected_claim: "検索ツールは情報を取得する機能であり、独立した判断主体であるエージェントとは区別する。", mechanism_explanation: "エージェントは目的に沿って状況を判断し行動するが、検索ツールは呼び出しに応じて検索結果を返す。", contrast_example: "検索APIが候補を返すことと、AI担当が候補を評価して選ぶことは異なる。", wrong_category: 情報取得ツール, correct_category: 目的に沿って判断する担当主体, boundary_criterion: 自ら状況に応じた行動を判断するか、指定処理の結果を返すか}
      H: {corrected_claim: "一つのAI処理の分岐だけでは、分岐ごとのエージェントが存在するとは限らない。", mechanism_explanation: "複数エージェントと呼ぶには、それぞれが担当・判断主体として構成され、必要な情報を受け渡す設計がある。", contrast_example: "条件分岐で同じプログラムの処理経路を選ぶことと、複数の担当主体を連携させることは異なる。", wrong_category: 単一処理の分岐, correct_category: 複数の担当主体, boundary_criterion: 複数の独立した担当が判断する構成か、単一処理の経路分岐か}
      I: {corrected_claim: "一つのAIの出力に複数の見出しを設けても、複数エージェントの役割分担にはならない。", mechanism_explanation: "見出しは出力の形式であり、各役割を担う別個の判断主体や情報連携を定義しない。", contrast_example: "一つの回答を3節に分けることと、3担当が別々に作業して結果を統合することは異なる。", wrong_category: 出力の見出し分割, correct_category: 複数エージェントの役割分担, boundary_criterion: 表示欄の数ではなく、別の担当主体・目的・情報連携があるか}

  - slug: memory_process_four_topic
    label: 記憶プロセス
    description: Memory、MemGPT、Reflectionによる情報保存・取得と振り返り。
    component_terms: [Memory, MemGPT, Reflection, 外部記憶, 振り返り]
    question: AIエージェントのMemory・MemGPT・Reflectionについて、正しい説明を3つ選びなさい。
    options:
      - {label: A, role: correct, body: "Memoryは、会話などで得た情報を保存し、後の応答で必要な情報を取り出して使う仕組みである。"}
      - {label: B, role: correct, body: "MemGPTは、OSの仮想メモリの考え方を参考に、LLMの入力内に置く情報と外部に保存する情報を管理する仕組みである。"}
      - {label: C, role: correct, body: "Reflectionは、過去の出力やその評価を振り返って改善点をまとめ、次の試行に生かす処理である。"}
      - {label: D, role: M1, body: "LLMは一度回答に使った利用者の希望を自分で覚えるため、別の日に新しい会話が始まってもその希望を利用できる。"}
      - {label: E, role: M1, body: "MemGPTは、過去の情報を使うために、外部に保存された記録を毎回すべてLLMの入力に読み込む仕組みである。"}
      - {label: F, role: M1, body: "Reflectionで振り返りの文章を一度作ると、それだけで改善点が新しい会話にも引き継がれる。"}
      - {label: G, role: M3, body: "Memoryは、利用者ごとの希望をモデルの学習済みの重みに保存し、必要なときに取り出す仕組みである。"}
      - {label: H, role: M3, body: "Reflectionは、振り返りを行うたびにモデルの重みを更新する追加訓練の仕組みである。"}
      - {label: I, role: M3, body: "MemGPTは、モデルのネットワーク構造を変更して、一度に入力できる情報量（コンテキストウィンドウ）を広げる技術である。"}
      - {label: J, role: unknown, body: わからない。}
    teaching_targets:
      D: {corrected_claim: "新しい会話へ希望を引き継ぐには、情報を保存し、必要時に取得する記憶機構が必要である。", mechanism_explanation: "別セッションでは会話履歴が自動で共有されないため、利用者に紐づく記録を読み出して入力へ反映する。", contrast_example: "同じ会話の履歴を参照することと、会話を越えて保存・取得することは異なる。"}
      E: {corrected_claim: "MemGPTは外部記憶を必要に応じて管理し、保存情報を毎回すべて入力へ詰め込むとは限らない。", mechanism_explanation: "入力に置く情報と外部に置く情報を管理し、必要に応じて移動・取得する。", contrast_example: "全記録を毎回読み込む方法と、必要な情報を選んで参照する管理は異なる。"}
      F: {corrected_claim: "Reflectionの結果を後の試行で使うには、結果を保存して次に参照する処理が必要である。", mechanism_explanation: "振り返りは改善に役立つ情報を作る処理であり、作成だけで別会話へ自動伝達されるものではない。", contrast_example: "振り返りを書き出すことと、その記録を次の入力へ取り込むことは別工程である。"}
