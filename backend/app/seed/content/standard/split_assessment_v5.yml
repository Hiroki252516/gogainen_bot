status: active_standard_split_v5
rounds:
  pretest_v1:
    llm_knowledge:
      scenario: 家電メーカーが、最新の取扱説明書に基づいて回答する製品サポートAIを開発している。回答は「結論・操作手順・注意点」の順にそろえたい。指示を工夫しても表現にばらつきが残るため、担当者が確認した質問と回答の事例を使った追加訓練も検討している。
      questions:
      - number: 1
        title: 最新の取扱説明書を参照する方法
        task: 最新の取扱説明書に基づいて回答させるための対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 利用者から製品の操作方法を質問されたときに最新の取扱説明書に基づいた回答を作成するため、対象製品の最新の取扱説明書から関連する操作手順や注意点を検索し、見つけた箇所を質問文と一緒にシステムがAIへ渡して回答を作成させる仕組みを実装する。
        - role: M1
          label: B
          body: 利用者から操作方法について質問されたら、最新版の取扱説明書から操作手順や注意点を検索し、その情報をAIに渡して案内文を作成させる。回答の品質を点検する際は、AIに渡した資料に必要な操作条件や注意点が記載されているかを評価項目とし、その結果を案内文の品質評価に利用する。
        - role: M1
          label: C
          body: 説明書の一部を一度AIに入力するとその内容がモデルの重みに保存されるため、初回の問い合わせで示した操作手順を、次回以降はモデルが覚えた情報として回答に利用する。
        - role: M3
          label: D
          body: 改訂後の取扱説明書をAIの追加訓練に利用し、製品の操作手順や注意点を学習させる。利用者から質問を受けた際には、訓練済みのAIに学習で使った説明書の関連箇所を取り出させ、その内容を回答の根拠として案内文を作成させる。
        - role: M3
          label: E
          body: 製品の新しい操作手順をAIに学習させるため、改訂後の取扱説明書をRAGの検索用索引に登録する。説明書が更新された場合も索引の内容を入れ替えて対応し、利用者から質問を受けた際は、登録した内容を学習済みのAIに操作手順や注意点を案内させる。
        - role: unknown
          label: F
          body: わからない。
      - number: 2
        title: 回答形式を指定する方法
        task: 回答を「結論・操作手順・注意点」の順にそろえるため、AIへの入力を工夫する対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 製品についての回答を「結論・操作手順・注意点」の順に示すため、質問を受けたときにAIへの指示文（プロンプト）に項目と順序を明記し、その指示文を利用者の質問と一緒に毎回AIへ渡して、指定した構成で案内を作成させる。
        - role: M1
          label: B
          body: 訓練に使った質問に「結論・操作手順・注意点」の順で答えられれば初めて受ける質問にも同じ形式で答えられるため、担当者が確認した質問と回答の事例を使ってAIを追加訓練し、訓練時の回答結果を形式調整の完了基準にする。
        - role: M1
          label: C
          body: 回答順を示す指示を繰り返しAIへ送るとモデルの重みがその形式に適応するため、「結論・操作手順・注意点」の順を毎回指定し、指示の反復によってモデル自体の回答形式を調整する。
        - role: M3
          label: D
          body: プロンプトに含めた取扱説明書の本文から質問に合う情報を選んで回答させる方法は、外部の文書データベースから必要な情報を検索して取り出す方法と同じ仕組みのため、説明書の本文をあらかじめAIへのプロンプトに含め、その中から質問に合う情報を選んで回答させる。
        - role: M3
          label: E
          body: プロンプトで回答順を指定する操作はモデルの重みを追加訓練で更新する処理と同じため、「結論・操作手順・注意点」の指示文を設定し、その入力操作をモデル自体の形式調整として利用する。
        - role: unknown
          label: F
          body: わからない。
      - number: 3
        title: 回答例を使った追加訓練
        task: 担当者が確認した質問と回答の事例を使って、モデル自体の回答方法を調整する対応・説明として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 「結論・操作手順・注意点」の順で答えるようにモデルを調整するため、担当者が確認した質問と回答の見本を使ってAIを追加訓練する。
        - role: M1
          label: B
          body: 訓練に使った質問に「結論・操作手順・注意点」の順で答えられれば新しい問い合わせでも同じ順序で回答できるため、担当者が確認した質問と回答の見本でAIを追加訓練し、訓練時の回答結果を形式調整の完了基準にする。
        - role: M1
          label: C
          body: 職員が追加訓練後の回答を採点すると、その評価結果がモデルの重みへ反映されるため、訓練済みAIの回答形式を職員が確認し、採点結果を次の回答形式の調整に利用する。
        - role: M3
          label: D
          body: RAGの検索対象に質問と回答の事例を登録することが回答方法の追加学習に当たるため、質問と回答の事例をRAGの検索対象へ登録し、その登録によってモデルの回答方法を学習させる。
        - role: M3
          label: E
          body: 質問と回答の見本をプロンプトへ含める操作は学習用データによる追加訓練と同じ処理のため、担当者が確認した回答例を毎回の入力に加え、その入力をモデルの回答方法の学習として扱う。
        - role: unknown
          label: F
          body: わからない。
    multi_agent:
      scenario: '大学が、学生からの本の貸出に関する質問に回答するAIシステムを開発している。


        例えば、学生が「統計学の入門書を借りたい。借りられる本はありますか？」と質問した場合、図書館にどのような本があるかだけでなく、その本が現在貸出中かどうかや、館外への貸出が認められているかも確認する必要がある。


        開発担当者は、図書館にある本や貸出状況を調べる担当と、本の種類や図書館の貸出規則を確認する担当に仕事を分け、それぞれが調べた情報をもとに学生へ適切な案内を行うAIシステムを作りたいと考えている。'
      questions:
      - number: 1
        title: 役割分担
        task: 複数のエージェントに役割を分担させる設計として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 蔵書担当と貸出条件担当にそれぞれ異なる仕事を設定するため、図書館にある本を調べるAIと貸出条件を確認するAIを別々のエージェントとして設け、蔵書担当には本の有無や貸出状況の調査を任せ、貸出条件担当には本の種類や貸出規則を確認させる。
        - role: M1
          label: B
          body: 複数の担当が一つの案内を作るには同じ調査内容を返す必要があるため、蔵書担当のAIと貸出条件担当のAIの両方に、本の有無と館外貸出の可否を同じように調べさせる。
        - role: M1
          label: C
          body: 担当の役割名を設定すると必要な調査範囲や判断方法も自動的に定まるため、「蔵書担当」「貸出条件担当」という名前を各AIに与え、その名前を調査内容の設定として利用する。
        - role: M3
          label: D
          body: 図書館の案内を行う1つのAIエージェントに、「蔵書担当として本の有無を調べる指示」と「利用条件担当として貸出規則を確認する指示」を順番に与える。指示ごとに得られた回答を別々の担当エージェントの調査結果として整理し、学生への案内に利用する。
        - role: M3
          label: E
          body: 図書館の案内AIに、本の有無を調べる機能と、貸出条件を確認する機能をそれぞれ用意する。2つの機能に「蔵書担当AI」「貸出条件担当AI」という名前を付け、1つのAIがそれぞれの機能を使って得た情報を、2つの担当AIが分担して調べた結果としてまとめ、学生への案内を作成する。
        - role: unknown
          label: F
          body: わからない。
      - number: 2
        title: 担当間の情報共有
        task: 担当間で調査結果を利用する仕組みとして、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 貸出可能な候補を絞り込ませるため、蔵書担当の調査結果を利用条件の確認担当へ渡す。
        - role: M1
          label: B
          body: 別々の担当に指示を出すだけで担当間の調査結果も自動的に共有されるため、蔵書を調べる担当と利用条件を確認する担当にそれぞれ指示を送り、その指示を担当間の情報共有手順として運用する。
        - role: M1
          label: C
          body: 蔵書担当が返した情報は担当間で受け渡した時点で内容の正確さも確認済みになるため、蔵書担当の貸出状況を利用条件担当の確定情報として採用し、その結果に沿って貸出候補を選ぶ。
        - role: M3
          label: D
          body: 本の一覧や貸出状況を返す検索ツールも貸出に関する情報を調べているため、蔵書担当のAIが使うその検索ツールを、利用条件を確認する別のAIエージェントとして数える。
        - role: M3
          label: E
          body: 蔵書担当と利用条件担当の結果を同じ画面に並べることは担当間で情報を交換する仕組みと同じため、蔵書と貸出条件の結果を2つの表示欄にまとめ、その画面表示を情報共有の仕組みとして利用する。
        - role: unknown
          label: F
          body: わからない。
      - number: 3
        title: 結果を合わせて案内する
        task: 各担当の結果から利用者への案内を作る対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 両担当の結果を利用者への案内に反映するため、結果をまとめる処理を設け、食い違う条件を確認してから案内を作る。
        - role: M1
          label: B
          body: 担当が一度返した蔵書情報は常に正しいため、蔵書担当から受け取った情報を案内時の確定情報として採用し、その内容をもとに案内を作成する。
        - role: M1
          label: C
          body: 蔵書担当と貸出条件担当がそれぞれ自分の条件を満たす結果を返せば案内全体の条件も満たされるため、本の有無と貸出規則を別々に確認し、両担当の結果を順番に並べた回答を最終案内に採用する。
        - role: M3
          label: D
          body: 貸出可否の条件分岐を増やすことは複数エージェントの実装に当たるため、1つの処理の中で貸出可否に応じた分岐を増やし、それぞれの分岐をエージェントとして扱う。
        - role: M3
          label: E
          body: 一度の回答に設けた「蔵書情報」と「貸出条件」の欄は別々のAIの成果に当たるため、1つのAIでその2欄をまとめて生成し、その表示を担当エージェント間の結果の統合として利用する。
        - role: unknown
          label: F
          body: わからない。
    memory_process:
      scenario: '利用者の食事に関する相談に応じて、献立を提案する健康相談AIを開発している。


        ある利用者は、以前の相談で「辛い料理は避けたい」と伝えていたが、その後「最近は少し辛い料理も食べられるようになったので、これからは献立に入れてほしい」と希望を変更した。また、AIが提案した献立について「量が多かったので、次からは少なめにしてほしい」と感想を伝えた。


        開発担当者は、この利用者が別の日に新しく相談した際にも、以前に伝えた希望やその後の変更、提案への感想を踏まえて献立を提案できるAIシステムを作りたいと考えている。'
      questions:
      - number: 1
        title: 希望の保存と利用
        task: 食事上の希望を次回の相談でも利用できるようにする対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 利用者が会話で伝えた食事の好みや避けたい食材を次回以降の提案に利用できるようにするため、必要な情報を選んで利用者ごとに保存し、次の相談時に関連する情報を検索してAIがその情報を参考に食事を提案できる仕組みを実装する。
        - role: M1
          label: B
          body: 利用者が「辛い料理は避けたい」と伝えた会話を、利用者ごとの履歴として全文保存する。別の日の相談でも以前の希望に沿った献立を提案するため、過去の会話履歴は保存先に残しておき、AIには今回の相談内容だけを渡して回答を作成させる。
        - role: M1
          label: C
          body: 利用者が一度希望をAIに伝えるとモデルが会話を越えてその人の好みを保持するため、初回に「辛い料理は避けたい」と入力し、別の日の献立もモデルが覚えた希望に沿って提案させる。
        - role: M3
          label: D
          body: 利用者が「辛い料理は避けたい」と伝えた際、その希望に沿った献立の質問と回答の例を学習用データに加え、AIを追加訓練する。別の日に同じ利用者が相談したときは、追加訓練したAIからその利用者の以前の希望を取り出し、献立の条件に反映させる。
        - role: M3
          label: E
          body: 利用者が「辛い料理は避けたい」と伝えた後、同じ会話の中で続けて献立を相談したときにも、その希望を反映できるよう、直前までの会話履歴をAIに渡す機能を設ける。この会話内で履歴を参照する機能を利用者ごとの長期記憶として採用し、別の日に新しく相談したときも以前の希望に沿った献立を提案させる。
        - role: unknown
          label: F
          body: わからない。
      - number: 2
        title: 希望の変更
        task: 利用者が食事上の希望を変更したときの対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 利用者の変更後の希望を現在の条件として次回の献立に反映するため、以前の「辛い料理は避けたい」を「少し辛い料理も食べたい」に変更したら、利用者別の記録に残る古い希望を確認して新しい希望に更新し、次回の相談で更新した記録を参照して新しい希望に沿う献立を提案させる。
        - role: M1
          label: B
          body: 新しい希望をAIに伝えて献立を作らせると以前の保存記録も自動的に書き換わるため、「辛い料理は避けたい」から「少し辛い料理も食べたい」へ希望を変更した際、新しい希望をAIに伝えて献立を作らせ、次回は更新済みの記録を参照して献立を提案させる。
        - role: M1
          label: C
          body: 保存記録を検索結果の関連度順に並べれば、希望を伝えた時期にかかわらず現在の条件が上位に来るため、以前の「辛い料理は避けたい」と新しい「少し辛い料理も食べたい」の記録を関連度順に検索し、先頭の希望を献立に採用する。
        - role: M3
          label: D
          body: すべての利用者に共通する指示文の変更は利用者ごとの希望を記憶する仕組みに当たるため、「辛い料理は避けたい」から「少し辛い料理も食べたい」への希望変更を受け、共通指示文を「少し辛い料理も提案する」に変更する。
        - role: M3
          label: E
          body: 希望の変更後にAIが生成した献立の回答文は利用者本人の現在の希望を保存した記録と同じため、少し辛い料理を含む献立の提案文を保存し、その文章を次回の食事希望の記録として利用する。
        - role: unknown
          label: F
          body: わからない。
      - number: 3
        title: 反応を次回に生かす
        task: 提案への反応を次回の応答改善に生かす対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 提案への反応を次の相談に生かすため、反応を振り返って必要な要点を記録し、次の相談で取り出して説明の調整に使う。
        - role: M1
          label: B
          body: 応答後の自己評価だけで利用者別の記憶が自動的に更新され、後日の提案にも改善が反映されるため、毎回の応答後に自己評価を実行し、その評価結果を後日の提案に反映する。
        - role: M1
          label: C
          body: 利用者の感想をAIに何度か入力するとその改善内容がモデルの重みに定着するため、「量が多い」という感想を複数回AIへ伝え、後日の献立も調整済みのモデルの回答に合わせる。
        - role: M3
          label: D
          body: 前回の会話をプロンプトに貼り付ける操作は会話終了後も情報を保存・検索・更新する記憶機能に当たるため、前回の会話を今回の入力に貼り付け、その入力操作を継続的な記憶管理として利用する。
        - role: M3
          label: E
          body: 利用者が感想を見返せる会話履歴の表示はAIが次回に必要な情報を検索する記憶管理と同じため、「次から量を少なめに」という発言を履歴画面に表示し、その画面を次回の希望の保存先として利用する。
        - role: unknown
          label: F
          body: わからない。
  retest_v1:
    llm_knowledge:
      scenario: '企業が、社員からの「パスワードを忘れた」「社内Wi-Fiにつながらない」「パソコンの電源が入らない」といった問い合わせに対応するAIを開発している。


        このAIは、問い合わせ内容を「アカウント」「ネットワーク」「機器」の3種類に分類し、その分類に応じた対応手順を社員に案内する。


        社員への案内は、「確認すること・対応手順・注意点」の順に、わかりやすく説明する形式にそろえたい。


        また、最近、社内の対応手順書が改訂されたため、開発担当者は新しい手順を案内に反映したいと考えている。さらに、担当者が正しく分類した過去の問い合わせ事例を利用して、AIの分類精度も改善したい。'
      questions:
      - number: 1
        title: 改訂後の対応手順書を利用する方法
        task: 改訂後の対応手順書に基づいて案内するための対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 改訂後の対応手順書に基づいて案内するため、社員から「社内Wi-Fiにつながらない」と相談されたら、改訂後の対応手順書から関係する箇所を検索し、見つけた情報を元に、その内容を参考に案内を作成させる。
        - role: M1
          label: B
          body: 参照用フォルダーの対応手順書を最新版に差し替えるとAIの学習済みの重みも更新されるため、対応手順書を最新版に差し替え、そのAIが学習した内容から案内を作成させる。
        - role: M1
          label: C
          body: 改訂後の対応手順書を一度AIへ入力すると、新しい対応方法が学習済みの重みに保存されるため、開発時に「社内Wi-Fiにつながらない」への手順を示し、その後の案内はモデルの保持した知識から作成させる。
        - role: M3
          label: D
          body: 改訂後の対応手順書を、本文とページ番号を含む学習用データにまとめてAIを追加訓練する。社員から問い合わせを受けた際には、追加訓練したAIの内部から、学習時に使った手順書の該当箇所とページ番号を検索して取り出し、その情報を根拠に案内文を作成させる。
        - role: M3
          label: E
          body: 改訂後の対応手順書を、社内Wi-Fiの接続方法やパスワードの再設定方法などの項目に分け、文書検索用の索引へ登録する。この登録作業をAIモデルに新しい対応方法を学習させる工程として実施し、登録後は追加訓練を終えたAIに社員からの問い合わせへの案内を作成させる。
        - role: unknown
          label: F
          body: わからない。
      - number: 2
        title: 回答時の入力を工夫する方法
        task: 回答時にAIへ渡す指示や事例の使い方として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 社員への回答を「確認すること・対応手順・注意点」の順にそろえるため、AIへ渡す指示文（プロンプト）に説明する項目と順序を指定し、問い合わせへの回答時に利用する。
        - role: M1
          label: B
          body: 質問に「パスワードを忘れた→アカウント」などの分類例を添えて正しく分類できた時点でモデル自体が分類方法を学習するため、開発中にその分類例を添えて回答を確認し、新しい会話ではモデルが習得した分類方法で問い合わせを分類させる。
        - role: M1
          label: C
          body: 一度「確認すること・対応手順・注意点」の順に回答できれば、その形式が次の会話でもモデルに保持されるため、最初の問い合わせで回答順を指定し、後の問い合わせも保持済みの順序に沿って案内させる。
        - role: M3
          label: D
          body: 共通指示文（プロンプト）に「最新版の対応手順書を確認して答える」と書くことは、対応手順書から必要な箇所を検索して取り出す仕組みと同じため、社員からの質問に応じてその指示を共通指示文に書き、文書検索の機能として利用する。
        - role: M3
          label: E
          body: 回答の項目や順序をプロンプトに指定する操作はモデルの回答形式を追加訓練する処理と同じため、「確認すること・対応手順・注意点」の順を共通指示文に加え、その指示を学習済みの形式調整として利用する。
        - role: unknown
          label: F
          body: わからない。
      - number: 3
        title: 問い合わせの分類方法を調整する方法
        task: 過去の問い合わせ事例を利用して、モデル自体の分類方法を調整する対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: モデル自体の分類方法を調整するため、担当者が「パスワードを忘れた→アカウント」などと確認した問い合わせ文と分類結果の組を学習用データにし、対応モデルを追加訓練する。
        - role: M1
          label: B
          body: 問い合わせを3種類に分類する指示を毎回送るとモデルの重みも徐々に調整されるため、問い合わせごとに同じ分類指示を送り続け、その反復によって分類能力を調整する。
        - role: M1
          label: C
          body: 追加訓練に使った分類例で正しく分類できれば、初めて受ける問い合わせでも同じ精度が得られるため、担当者が確認した「パスワードを忘れた→アカウント」などの事例でAIを追加訓練し、その事例への正答率を分類調整の完了基準にする。
        - role: M3
          label: D
          body: 保存した分類例から似た事例を検索してAIに渡す方法はモデル自体を追加訓練する仕組みと同じため、担当者が確認した「パスワードを忘れた→アカウント」等の分類例を保存し、問い合わせのたびにシステムが似た事例を検索してAIに渡す。
        - role: M3
          label: E
          body: 分類例をAIへのプロンプトに加える操作は分類モデルの追加訓練と同じ処理のため、「パスワードを忘れた→アカウント」などの問い合わせと分類結果を入力文に含め、その入力をモデル自体の学習として利用する。
        - role: unknown
          label: F
          body: わからない。
    multi_agent:
      scenario: '旅行会社が、公共交通を利用する日帰り観光プランを提案するAIシステムを開発している。


        例えば、利用者が「午前に美術館、午後に水族館を訪れ、17時までに出発駅へ戻りたい」と希望した場合、観光候補の情報、訪問する順番や滞在時間、電車やバスの移動条件などを考慮して、実行可能な旅行計画を案内する必要がある。


        開発担当者は、複数のAIエージェントに仕事を分担させ、協力して旅行計画を作成する仕組みを検討している。'
      questions:
      - number: 1
        title: 役割分担と担当の構成
        task: 旅行計画を作成する複数のエージェントの構成として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 担当ごとに何を調べ、何を判断するかを設定するため、観光候補を調べるAI、訪問順や滞在時間を決めるAI、電車やバスの移動条件を確認するAIを設け、それぞれに異なる仕事を担当させる。
        - role: M1
          label: B
          body: 観光候補担当が施設を選んだ後は、その選定結果を日程担当に引き継ぎ、日程担当は訪問順や滞在時間の調整を行う。移動時間や営業時間を確認した結果、17時までに出発駅へ戻る計画を組めない場合は、施設の再選定を観光候補担当に依頼する工程は設けず、日程担当が選定済みの施設を使って計画を作成する。
        - role: M1
          label: C
          body: 各AIに「観光候補」「日程」「移動確認」という役割名を与えると調査範囲や判断方法が定まるため、3つの担当に役割名を設定し、その名前を旅行計画の担当手順として利用する。
        - role: M3
          label: D
          body: 旅行計画を作成するAIを1つ用意し、回答を「観光候補」「日程」「移動」の3つの欄に分けて作成させる。各欄の内容をそれぞれ「観光候補担当AI」「日程担当AI」「移動確認担当AI」の作業結果として記録し、3つの担当の成果をまとめた旅行計画として利用者に提示する。
        - role: M3
          label: E
          body: 旅行計画を作るAIエージェントを1つ用意し、観光候補の調査、日程作成、移動確認を順番に行わせる。各段階に「観光候補担当AI」「日程担当AI」「移動確認担当AI」という名前を付け、3つの担当AIが処理を引き継ぐ構成として運用する。
        - role: unknown
          label: F
          body: わからない。
      - number: 2
        title: 担当間の情報の受け渡し
        task: 各担当が必要な情報を利用して旅行計画を作成するための対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 各担当の結果を次の担当の作業に利用するため、観光候補担当が見つけた施設や営業時間を日程担当へ渡し、日程担当が作成した訪問順と予定時刻を移動確認担当に引き継ぐ仕組みを設ける。
        - role: M1
          label: B
          body: 観光調査・日程作成・移動確認のAIに役割を設定して個別に質問すると他の担当の結果も自動的に共有されるため、それぞれのAIに役割を設定して個別に質問する運用を担当間の情報共有手順として利用する。
        - role: M1
          label: C
          body: 日程担当が作成した予定時刻を移動確認担当へ渡せば、利用者が希望する17時までに出発駅へ戻るという条件も自動的に共有されるため、予定時刻だけを次の担当へ引き継ぎ、利用者の全条件が伝わった情報として移動確認に利用する。
        - role: M3
          label: D
          body: 電車の発着時刻だけを返す乗換検索ツールも日程担当へ交通情報を渡す役割を持つため、その検索ツールを移動条件を判断するAIエージェントの一つとして数える。
        - role: M3
          label: E
          body: 日程担当が作成した訪問順と予定時刻の表は、移動条件を判断する独立した担当と同じ働きをするため、その予定表を移動確認エージェントとして数え、日程担当から結果を受け渡す相手に設定する。
        - role: unknown
          label: F
          body: わからない。
      - number: 3
        title: 計画全体の確認と見直し
        task: 利用者の希望に合う実行可能な旅行計画にするための対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 移動確認担当の判断を計画の見直しに反映できるようにするため、移動確認担当が予定された出発時刻で移動すると出発駅への帰着が17時を過ぎると判断したら、その結果を日程担当へ返し、訪問順や滞在時間を見直せるようにする。
        - role: M1
          label: B
          body: 観光候補担当が営業時間に合う施設を選び、移動確認担当が利用できる電車を調べれば、各担当の結果を組み合わせるだけで17時までに出発駅へ戻れるため、個々の結果を組み合わせた計画を最終案として採用する。
        - role: M1
          label: C
          body: 移動確認担当が電車の条件を調べて問題点を返すと日程担当の役割まで変更されるため、移動条件の確認結果は案内の注意点として追加し、日程担当が作成した訪問順と滞在時間を計画の最終条件として採用する。
        - role: M3
          label: D
          body: 1つのAIが移動距離に応じて徒歩と電車の案内を切り替える場合、切り替え先の処理がそれぞれ独立したAIエージェントに当たるため、切り替え先を複数のAIエージェントとして数え、連携する構成とみなす。
        - role: M3
          label: E
          body: 電車の検索ツールが返す複数の移動候補は、別々のAIエージェントによる計画案と同じ情報のため、検索された候補を複数担当の判断結果として並べ、その一覧を旅行計画の統合結果として利用する。
        - role: unknown
          label: F
          body: わからない。
    memory_process:
      scenario: 料理の献立を提案するAIサービスを開発している。ある利用者は以前の相談で「ピーマンは苦手なので、今後の献立には入れないでほしい」と伝えた。その後、別の日に「最近は食べられるようになったので、これからはピーマンも献立に入れてほしい」と希望を変更した。また、提案された料理について「味が濃かったので、次からは薄味にしてほしい」と感想を伝えた。開発担当者は、別の日に新しい相談が始まった場合にも、その利用者の新しい希望や過去の感想を適切に反映できる仕組みを作りたいと考えている。
      questions:
      - number: 1
        title: 希望の保存と利用
        task: 利用者が伝えた希望を別の日の相談でも利用する方法として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 利用者が伝えた希望を別の日の相談でも献立の提案に利用できるようにするため、「ピーマンを避けたい」と話した段階でその希望を利用者別の記録に保存し、別の日の相談でも必要に応じて取り出す。
        - role: M1
          label: B
          body: 過去の相談を全文保存すると別の日の相談でもAIが食材の好みを自動的に把握できるため、利用者ごとの会話を全文保存し、その保存済みの会話を次回の希望の取得にも対応する記憶機能として運用する。
        - role: M1
          label: C
          body: 利用者が一度「ピーマンを避けたい」とAIに伝えると、その希望が別の日の会話でもモデルに保持されるため、初回の相談でその希望を入力し、次の相談ではモデルが覚えた条件に沿って献立を作成させる。
        - role: M3
          label: D
          body: 利用者が「ピーマンを避けたい」と伝えた内容を利用者IDと組にして学習用データへ追加し、献立提案AIを追加訓練する。別の日の相談では、利用者IDを指定して、追加訓練に使った希望をそのAIから利用者別の保存記録として読み出し、献立の条件に反映させる。
        - role: M3
          label: E
          body: 利用者が「ピーマンを避けたい」と伝えた発言を、相談ごとに管理する会話履歴へ記録し、その相談中の献立提案に利用する。別の日に新しい相談が始まった際は、新しい相談の会話履歴をAIに渡して、前回伝えた食材の希望も踏まえた献立を作成させる。
        - role: unknown
          label: F
          body: わからない。
      - number: 2
        title: 現在の希望の管理
        task: 利用者が変更した現在の食材の希望を管理する方法として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 本人が「今後はピーマンも使ってほしい」と希望を変更した後の献立に変更後の条件を反映するため、以前の「避けたい」という記録を現在の希望と区別して更新する。
        - role: M1
          label: B
          body: 以前の「ピーマンを避けたい」という記録に新しい「今後はピーマンも使ってほしい」を追加するとAIが次回の相談で新しい方を自動的に選べるため、以前の記録を残したまま新しい希望を追加し、保存した2つの記録をそのまま次の相談で検索して利用する。
        - role: M1
          label: C
          body: 変更後の「今後はピーマンも使ってほしい」をAIに伝えて今回の献立に反映できれば以前の保存記録も新しい内容に更新されるため、変更後の希望を今回の入力へ加え、その回答を更新済みの希望に沿った次回の献立の基準にする。
        - role: M3
          label: D
          body: 以前AIが提案した「ピーマンを使わない献立」の履歴は利用者自身が伝えた現在の食材の希望と同じ情報のため、その提案履歴を保存し、現在の希望を管理する記憶として扱う。
        - role: M3
          label: E
          body: 利用者の希望変更を今回のプロンプトに書くことは、保存済みの個人別の希望を更新する仕組みと同じため、「今後はピーマンも使ってほしい」という希望を入力に加え、その入力操作を利用者別の記録の更新として利用する。
        - role: unknown
          label: F
          body: わからない。
      - number: 3
        title: 会話で得た情報を後日の提案に生かす
        task: 会話で得た希望や感想を、別の日の新しい相談にも反映する方法として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 利用者の感想を後日の献立に生かすため、料理への「味が濃かった」という感想から「次から薄味にしてほしい」という希望を記録し、後日の献立でも必要に応じて取り出して、味付けを決める際の参考にする。
        - role: M1
          label: B
          body: 「味が濃かった」という感想をもとにAIが一度薄味の献立を提案できればその改善内容が次の相談にも引き継がれるため、その場で提案を調整し、今回の回答結果を後日の改善として利用する。
        - role: M1
          label: C
          body: AIが今回の返信で「次回は薄味の献立を提案します」と伝えれば、次の相談でもその方針が自動的に参照されるため、「味が濃かった」という感想を受けた回答に改善方針を書き、その回答を後日の献立の条件として利用する。
        - role: M3
          label: D
          body: 同じ会話で「ピーマンも使ってほしい」と伝えた後の献立に希望が反映されることは、別の日の会話でも食材の好みを保存・更新する記憶機能と同じため、会話中の発言を参照する仕組みを継続的な記憶管理として利用する。
        - role: M3
          label: E
          body: AIが今回作った改善後の献立は利用者本人が伝えた現在の味付けの希望を保存した記録と同じ情報のため、「次から薄味にしてほしい」という希望に沿って生成した献立を保存し、その内容を後日の献立の希望条件として利用する。
        - role: unknown
          label: F
          body: わからない。
