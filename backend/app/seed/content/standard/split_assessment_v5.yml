          label: E
          body: ITサポートマニュアルを文書検索の対象へ登録することはモデルに新しい対応方法を追加訓練する処理と同じため、改訂後のITサポートマニュアルを検索用の索引へ追加し、その登録を対応方法の学習として案内に利用する。
        - role: unknown
          label: F
          body: わからない。
      - number: 2
        title: 回答時の入力を工夫する方法
        task: 回答時にAIへ渡す指示や事例の使い方として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 教職員への回答を「確認すること・対応手順・注意点」の順にそろえるため、AIへ渡す指示文（プロンプト）に説明する項目と順序を指定し、問い合わせへの回答時に利用する。
        - role: M1
          label: B
          body: 質問に「学内ポータルのパスワードを忘れた→アカウント」などの分類例を添えて正しく分類できた時点でモデル自体が分類方法を学習するため、開発中にその分類例を添えて回答を確認し、新しい会話ではモデルが習得した分類方法で問い合わせを分類させる。
        - role: M1
          label: C
          body: 一度「確認すること・対応手順・注意点」の順に回答できれば、その形式が次の会話でもモデルに保持されるため、最初の問い合わせで回答順を指定し、後の問い合わせも保持済みの順序に沿って案内させる。
        - role: M3
          label: D
          body: 共通指示文（プロンプト）に「最新版のITサポートマニュアルを確認して答える」と書くことは、ITサポートマニュアルから必要な箇所を検索して取り出す仕組みと同じため、教職員からの質問に応じてその指示を共通指示文に書き、文書検索の機能として利用する。
        - role: M3
          label: E
          body: 回答の項目や順序をプロンプトに指定する操作はモデルの回答形式を追加訓練する処理と同じため、「確認すること・対応手順・注意点」の順を共通指示文に加え、その指示を学習済みの形式調整として利用する。
        - role: unknown
          label: F
          body: わからない。
      - number: 3
        title: 問い合わせの分類方法を調整する方法
        task: 過去の問い合わせ事例を利用して、モデル自体の分類方法を調整する対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: モデル自体の分類方法を調整するため、担当者が「学内ポータルのパスワードを忘れた→アカウント」などと確認した問い合わせ文と分類結果の組を学習用データにし、対応モデルを追加訓練する。
        - role: M1
          label: B
          body: 問い合わせを3種類に分類する指示を毎回送るとモデルの重みも徐々に調整されるため、問い合わせごとに同じ分類指示を送り続け、その反復によって分類能力を調整する。
        - role: M1
          label: C
          body: 追加訓練に使った分類例で正しく分類できれば、初めて受ける問い合わせでも同じ精度が得られるため、担当者が確認した「学内ポータルのパスワードを忘れた→アカウント」などの事例でAIを追加訓練し、その事例への正答率を分類調整の完了基準にする。
        - role: M3
          label: D
          body: 保存した分類例から似た事例を検索してAIに渡す方法はモデル自体を追加訓練する仕組みと同じため、担当者が確認した「学内ポータルのパスワードを忘れた→アカウント」等の分類例を保存し、問い合わせのたびにシステムが似た事例を検索してAIに渡す。
        - role: M3
          label: E
          body: 分類例をAIへのプロンプトに加える操作は分類モデルの追加訓練と同じ処理のため、「学内ポータルのパスワードを忘れた→アカウント」などの問い合わせと分類結果を入力文に含め、その入力をモデル自体の学習として利用する。
        - role: unknown
          label: F
          body: わからない。
    multi_agent:
      scenario: '博物館が、館内を移動する短時間の見学コースを提案するAIシステムを開発している。


        例えば、来館者が「最初に恐竜展示、次に化石展示を訪れ、40分以内に入口へ戻りたい」と希望した場合、展示候補の情報、見学する順番や滞在時間、展示室間の移動経路や所要時間などを考慮して、実行可能な見学計画を案内する必要がある。


        開発担当者は、複数のAIエージェントに仕事を分担させ、協力して見学計画を作成する仕組みを検討している。'
      questions:
      - number: 1
        title: 役割分担と担当の構成
        task: 見学計画を作成する複数のエージェントの構成として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 担当ごとに何を調べ、何を判断するかを設定するため、展示候補を調べるAI、見学順や滞在時間を決めるAI、展示室間の移動条件を確認するAIを設け、それぞれに異なる仕事を担当させる。
        - role: M1
          label: B
          body: 展示候補担当が選んだ展示を見学計画担当が変更すると役割分担が崩れるため、移動時間や公開時間との調整が必要な場合も、最初に選んだ展示をそのまま計画の候補として採用する。
        - role: M1
          label: C
          body: 各AIに「展示候補」「見学計画」「移動確認」という役割名を与えると調査範囲や判断方法も自動的に定まるため、3つの担当に役割名を設定し、その名前を見学計画の担当手順として利用する。
        - role: M3
          label: D
          body: 1つのAIの回答を「展示候補」「見学計画」「移動」の3つの見出しに分けることは、3つのAIエージェントが役割分担する仕組みと同じため、その3つの見出しで回答させ、複数のエージェントが協力する構成として扱う。
        - role: M3
          label: E
          body: 1つのAIが展示候補の調査・見学計画の作成・移動確認を3つの手順として順番に実行することは、3つのAIエージェントが役割分担する構成と同じため、単一AIの処理を3段階に分け、各段階を独立した担当AIとして数える。
        - role: unknown
          label: F
          body: わからない。
      - number: 2
        title: 担当間の情報の受け渡し
        task: 各担当が必要な情報を利用して見学計画を作成するための対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 各担当の結果を次の担当の作業に利用するため、展示候補担当が見つけた展示室や公開時間を見学計画担当へ渡し、見学計画担当が作成した見学順と予定時刻を移動確認担当に引き継ぐ仕組みを設ける。
        - role: M1
          label: B
          body: 展示調査・見学計画・移動確認のAIに役割を設定して個別に質問すると他の担当の結果も自動的に共有されるため、それぞれのAIに役割を設定して個別に質問する運用を担当間の情報共有手順として利用する。
        - role: M1
          label: C
          body: 見学計画担当が作成した予定時刻を移動確認担当へ渡せば、利用者が希望する40分以内に入口へ戻るという条件も自動的に共有されるため、予定時刻だけを次の担当へ引き継ぎ、利用者の全条件が伝わった情報として移動確認に利用する。
        - role: M3
          label: D
          body: 展示室間の所要時間だけを返す館内経路検索ツールも見学計画担当へ移動情報を渡す役割を持つため、その検索ツールを移動条件を判断するAIエージェントの一つとして数える。
        - role: M3
          label: E
          body: 見学計画担当が作成した見学順と予定時刻の表は、移動条件を判断する独立した担当と同じ働きをするため、その予定表を移動確認エージェントとして数え、見学計画担当から結果を受け渡す相手に設定する。
        - role: unknown
          label: F
          body: わからない。
      - number: 3
        title: 計画全体の確認と見直し
        task: 来館者の希望に合う実行可能な見学計画にするための対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 移動確認担当の判断を計画の見直しに反映できるようにするため、移動確認担当が予定された出発時刻で移動すると見学開始から入口へ戻るまでの時間が40分を超えると判断したら、その結果を見学計画担当へ返し、見学順や滞在時間を見直せるようにする。
        - role: M1
          label: B
          body: 展示候補担当が公開時間に合う展示を選び、移動確認担当が利用できる館内経路を調べれば、各担当の結果を組み合わせるだけで40分以内に入口へ戻れるため、個々の結果を組み合わせた計画を最終案として採用する。
        - role: M1
          label: C
          body: 移動確認担当が館内経路の条件を調べて問題点を返すと見学計画担当の役割まで変更されるため、移動条件の確認結果は案内の注意点として追加し、見学計画担当が作成した見学順と滞在時間を計画の最終条件として採用する。
        - role: M3
          label: D
          body: 1つのAIが展示室の階数に応じて階段とエレベーターの案内を切り替える場合、切り替え先の処理がそれぞれ独立したAIエージェントに当たるため、切り替え先を複数のAIエージェントとして数え、連携する構成とみなす。
        - role: M3
          label: E
          body: 館内経路の検索ツールが返す複数の移動候補は、別々のAIエージェントによる計画案と同じ情報のため、検索された候補を複数担当の判断結果として並べ、その一覧を見学計画の統合結果として利用する。
        - role: unknown
          label: F
          body: わからない。
    memory_process:
      scenario: 企業が、利用者からの問い合わせに対応するAIサービスを開発している。ある利用者は以前の相談で「メールは使いにくいので、今後の連絡は電話にしてほしい」と伝えた。その後、別の日に「最近はメールを使えるようになったので、これからはメールで連絡してほしい」と希望を変更した。また、送られた案内メールについて「文章が長かったので、次からは要点を先に書いてほしい」と感想を伝えた。開発担当者は、別の日に新しい相談が始まった場合にも、その利用者の新しい希望や過去の感想を適切に反映できる仕組みを作りたいと考えている。
      questions:
      - number: 1
        title: 希望の保存と利用
        task: 利用者が伝えた希望を別の日の相談でも利用する方法として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 利用者が伝えた希望を別の日の相談でも連絡方法の決定に利用できるようにするため、「電話で連絡してほしい」と話した段階でその希望を利用者別の記録に保存し、別の日の相談でも必要に応じて取り出す。
        - role: M1
          label: B
          body: 過去の相談を全文保存すると別の日の相談でもAIが連絡方法の好みを自動的に把握できるため、利用者ごとの会話を全文保存し、その保存済みの会話を次回の希望の取得にも対応する記憶機能として運用する。
        - role: M1
          label: C
          body: 利用者が一度「電話で連絡してほしい」とAIに伝えると、その希望が別の日の会話でもモデルに保持されるため、初回の相談でその希望を入力し、次の相談ではモデルが覚えた条件に沿って案内を作成させる。
        - role: M3
          label: D
          body: 「電話で連絡してほしい」という希望を追加訓練でモデルの重みに覚えさせる処理は、利用者別の連絡方法の好みを保存・更新・検索する記憶管理と同じ仕組みのため、その希望を追加訓練でモデルの重みに覚えさせる。
        - role: M3
          label: E
          body: 同じ会話で以前の発言を参照できる履歴機能は、別の日にも希望を取り出せる利用者別の長期記憶と同じため、「電話で連絡してほしい」という発言を含む会話履歴を、継続的な希望の記憶として運用する。
        - role: unknown
          label: F
          body: わからない。
      - number: 2
        title: 現在の希望の管理
        task: 利用者が変更した現在の連絡方法の希望を管理する方法として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 本人が「今後はメールで連絡してほしい」と希望を変更した後の案内に変更後の条件を反映するため、以前の「電話で連絡してほしい」という記録を現在の希望と区別して更新する。
        - role: M1
          label: B
          body: 以前の「電話で連絡してほしい」という記録に新しい「今後はメールで連絡してほしい」を追加するとAIが次回の相談で新しい方を自動的に選べるため、以前の記録を残したまま新しい希望を追加し、保存した2つの記録をそのまま次の相談で検索して利用する。
        - role: M1
          label: C
          body: 変更後の「今後はメールで連絡してほしい」をAIに伝えて今回の案内に反映できれば以前の保存記録も新しい内容に更新されるため、変更後の希望を今回の入力へ加え、その回答を更新済みの希望に沿った次回の案内の基準にする。
        - role: M3
          label: D
          body: 以前AIが提案した「電話で連絡する方法」の履歴は利用者自身が伝えた現在の連絡方法の希望と同じ情報のため、その提案履歴を保存し、現在の希望を管理する記憶として扱う。
        - role: M3
          label: E
          body: 利用者の希望変更を今回のプロンプトに書くことは、保存済みの個人別の希望を更新する仕組みと同じため、「今後はメールで連絡してほしい」という希望を入力に加え、その入力操作を利用者別の記録の更新として利用する。
        - role: unknown
          label: F
          body: わからない。
      - number: 3
        title: 会話で得た情報を後日の案内に生かす
        task: 会話で得た希望や感想を、別の日の新しい相談にも反映する方法として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 利用者の感想を後日の案内に生かすため、案内メールへの「文章が長かった」という感想から「次からは要点を先に書いてほしい」という希望を記録し、後日の案内でも必要に応じて取り出して、文章を作成する際の参考にする。
        - role: M1
          label: B
          body: 「文章が長かった」という感想をもとにAIが一度要点を先に書いた案内文を作成できればその改善内容が次の相談にも引き継がれるため、その場で提案を調整し、今回の回答結果を後日の改善として利用する。
        - role: M1
          label: C
          body: AIが今回の返信で「次回からは要点を先に書いて案内します」と伝えれば、次の相談でもその方針が自動的に参照されるため、「文章が長かった」という感想を受けた回答に改善方針を書き、その回答を後日の案内の条件として利用する。
        - role: M3
          label: D
          body: 同じ会話で「メールで連絡してほしい」と伝えた後の案内に希望が反映されることは、別の日の会話でも連絡方法の好みを保存・更新する記憶機能と同じため、会話中の発言を参照する仕組みを継続的な記憶管理として利用する。
        - role: M3
          label: E
          body: AIが今回作った改善後の案内文は利用者本人が伝えた現在の案内文の構成の希望を保存した記録と同じ情報のため、「次からは要点を先に書いてほしい」という希望に沿って生成した案内文を保存し、その内容を後日の案内の希望条件として利用する。
        - role: unknown
          label: F
          body: わからない。
