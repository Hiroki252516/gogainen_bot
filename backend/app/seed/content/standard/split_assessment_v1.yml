    memory_process:
      scenario: 企業が、利用者からの問い合わせに対応するAIサービスを開発している。ある利用者は以前の相談で「メールは使いにくいので、今後の連絡は電話にしてほしい」と伝えた。その後、別の日に「最近はメールを使えるようになったので、これからはメールで連絡してほしい」と希望を変更した。また、送られた案内メールについて「文章が長かったので、次からは要点を先に書いてほしい」と感想を伝えた。開発担当者は、別の日に新しい相談が始まった場合にも、その利用者の新しい希望や過去の感想を適切に反映できる仕組みを作りたいと考えている。
      questions:
      - number: 1
        title: 希望の保存と利用
        task: 利用者が伝えた希望を別の日の相談でも利用する方法として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 利用者が「電話で連絡してほしい」と話した段階で、その希望を利用者別の記録に保存し、別の日の相談でも必要に応じて取り出し、連絡方法の決定に利用できるようにする。
          M1:
            label: B
            body: 過去の相談を全文保存しておけば、AIは別の日の相談でもそこに書かれた連絡方法の好みを自動的に把握できると考え、保存した会話から必要な情報を取り出す処理は設けない。
          M3:
            label: C
            body: 利用者が伝えた「電話で連絡してほしい」という希望を追加訓練でモデルの重みに覚えさせる処理を、利用者別の連絡方法の好みを保存し、必要に応じて更新・検索する記憶管理と同じ仕組みとして扱う。
          unknown:
            label: D
            body: わからない。
      - number: 2
        title: 現在の希望の管理
        task: 利用者が変更した現在の連絡方法の希望を管理する方法として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 本人が「今後はメールで連絡してほしい」と希望を変更したら、以前の「電話で連絡してほしい」という記録を現在の希望と区別して更新し、その後の案内には変更後の条件を反映する。
          M1:
            label: B
            body: 利用者が「今後はメールで連絡してほしい」と伝えたら、以前の「電話で連絡してほしい」という記録を残して新しい希望を追加し、どちらが現在の希望かを判断する仕組みがなくても、次回はAIが新しい方を使うと考える。
          M3:
            label: C
            body: 以前AIが提案した「電話で連絡する方法」の履歴を保存し、その履歴を、利用者自身が伝えた現在の連絡方法の希望を管理する記憶と同じものとして扱う。
          unknown:
            label: D
            body: わからない。
      - number: 3
        title: 会話で得た情報を後日の案内に生かす
        task: 会話で得た希望や感想を、別の日の新しい相談にも反映する方法として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 案内メールへの「文章が長かった」という感想から「次からは要点を先に書いてほしい」という希望を記録し、後日の案内でも必要に応じて取り出して、文章を作成する際の参考にする。
          M1:
            label: B
            body: 「文章が長かった」という感想をもとにAIが一度要点を先に書いた案内文を作成できれば、その改善内容は次の相談にも引き継がれると考え、感想や新しい希望を保存する処理は設けない。
          M3:
            label: C
            body: 同じ会話で「メールで連絡してほしい」と伝えた後の案内に希望が反映されたため、会話中の発言を参照する仕組みを、別の日の新しい会話でも連絡方法の好みを保存・更新する記憶機能と同じものとして扱う。
          unknown:
            label: D
            body: わからない。
