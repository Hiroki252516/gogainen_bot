status: active_standard_split_v1
rounds:
  pretest_v1:
    llm_knowledge:
      scenario: 家電メーカーが、最新の取扱説明書に基づいて回答する製品サポートAIを開発している。回答は「結論・操作手順・注意点」の順にそろえたい。指示を工夫しても表現にばらつきが残るため、担当者が確認した質問と回答の事例を使った追加訓練も検討している。
      questions:
      - number: 1
        title: 最新の取扱説明書を参照する方法
        task: 最新の取扱説明書に基づいて回答させるための対応として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 利用者の質問に応じて最新の取扱説明書を検索し、該当箇所を質問と一緒にAIへ渡して回答を作らせる仕組みを実装する。
          M1:
            label: B
            body: 問い合わせに関係する取扱説明書を回答時に参照させる。参照資料が最新版であれば、生成される案内にも操作条件や注意点が正確に引き継がれるので、出力内容を照合する仕組みを作らない。
          M3:
            label: C
            body: 説明書の該当箇所を取り出すため、文書検索の代わりにファインチューニングの訓練処理へ質問を送る。
          unknown:
            label: D
            body: わからない。
      - number: 2
        title: 回答形式を指定する方法
        task: 回答を「結論・操作手順・注意点」の順にそろえるため、AIへの入力を工夫する対応として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 利用者からの質問に回答するとき、「結論・操作手順・注意点」の順に説明するよう、AIに指示するプロンプトを設定する。
          M1:
            label: B
            body: 回答例を毎回の入力に加えて重みを調整し、学習用データによる訓練処理を省く。
          M3:
            label: C
            body: 取扱説明書を保存・検索する仕組みとして、説明書の本文をプロンプトに登録し、プロンプトそのものを文書データベースとして利用するように設計する。
          unknown:
            label: D
            body: わからない。
      - number: 3
        title: 回答例を使った追加訓練
        task: 担当者が確認した質問と回答の事例を使って、モデル自体の回答方法を調整する対応・説明として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 担当者が確認した質問と回答の見本を使ってAIを追加訓練し、「結論・操作手順・注意点」の順で答えるように調整する。
          M1:
            label: B
            body: 担当者が確認した質問と回答の見本でAIを追加訓練をする。そして訓練に使った質問に「結論・操作手順・注意点」の順で答えられたら、新しい問い合わせでも同じ順序で回答出来るので別の質問で確かめる必要が無い
          M3:
            label: C
            body: 回答方法を追加学習させるため、質問と回答の事例をRAGの検索対象へ登録して訓練を済ませる。
          unknown:
            label: D
            body: わからない。
    multi_agent:
      scenario: 図書館の案内システムは、蔵書を調べる担当と利用条件を確認する担当を分け、結果を合わせて質問へ回答する。
      questions:
      - number: 1
        title: 役割分担
        task: 複数のエージェントに役割を分担させる設計として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 蔵書を調べる役と利用条件を確認する役を別のエージェントとして設け、それぞれに目的を与える。
          M1:
            label: B
            body: 担当ごとの調査内容を分ける代わりに全員へ同じ最終回答を出させ、回答が異なる場合は連携を止める。
          M3:
            label: C
            body: 一回の回答を蔵書欄と条件欄に分けるだけで、別の主体を設けずに複数エージェントの構成を完成させる。
          unknown:
            label: D
            body: わからない。
      - number: 2
        title: 担当間の情報共有
        task: 担当間で調査結果を利用する仕組みとして、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 蔵書担当の調査結果を利用条件の確認担当へ渡し、貸出可能な候補を絞り込ませる。
          M1:
            label: B
            body: 蔵書を調べる担当と利用条件を確認する担当にそれぞれ指示を出し、調査結果を受け渡したり統合したりする仕組みを設けずに、担当同士が自動的に連携して案内を作るように設計する。
          M3:
            label: C
            body: 検索で返された本の一覧そのものを判断主体として数え、独立した担当の代わりに役割を割り当てる。
          unknown:
            label: D
            body: わからない。
      - number: 3
        title: 結果を合わせて案内する
        task: 各担当の結果から利用者への案内を作る対応として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 両担当の結果をまとめる処理を設け、食い違う条件を確認してから利用者への案内を作る。
          M1:
            label: B
            body: 担当が一度返した蔵書情報は常に正しいものとして扱い、案内前に情報の古さを確認する処理を省く。
          M3:
            label: C
            body: 貸出可否の条件分岐だけを増やし、判断する担当や情報交換を設けずにエージェント群を構成する。
          unknown:
            label: D
            body: わからない。
    memory_process:
      scenario: 健康相談AIは、利用者が伝えた食事上の希望を次回の提案にも生かしたい。希望が変わったときは古い内容をそのまま使わない。
      questions:
      - number: 1
        title: 希望の保存と利用
        task: 食事上の希望を次回の相談でも利用できるようにする対応として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 利用者が会話で伝えた食事の好みや避けたい食材から、次回以降の提案に必要な情報を選んで利用者ごとに保存し、次の相談時に関連する情報を検索して、AIがその情報を参考に食事を提案できる仕組みを実装する。
          M1:
            label: B
            body: 利用者の食事の希望を次回も覚えておくには、必要な情報だけを保存する方法では記憶できないため、過去の会話をすべて全文のまま保存する仕組みを実装する。
          M3:
            label: C
            body: 利用者別の記録を保存・検索する処理の代わりに、モデルの重みの追加訓練だけを記憶機能として実装する。
          unknown:
            label: D
            body: わからない。
      - number: 2
        title: 希望の変更
        task: 利用者が食事上の希望を変更したときの対応として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 利用者から希望の変更を受けたら以前の記録と照合し、次回は更新した内容を参照する。
          M1:
            label: B
            body: 一度記録した食事上の希望は常に現在も正しいとみなし、変更の申し出があっても以前の内容を使う。
          M3:
            label: C
            body: 一般公開の栄養資料を検索する機能だけを用意し、個人の希望を保存せずに利用者別の記憶管理まで完了させる。
          unknown:
            label: D
            body: わからない。
      - number: 3
        title: 反応を次回に生かす
        task: 提案への反応を次回の応答改善に生かす対応として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 提案への反応を振り返って必要な要点を記録し、次の相談で取り出して説明の調整に使う。
          M1:
            label: B
            body: 応答後に自己評価だけを実行し、結果の保存や次回の検索を設けずに後の提案へ反映させる。
          M3:
            label: C
            body: 前回の会話をプロンプトに貼り付けるだけで、会話終了後も情報を保存・検索・更新する記憶機能を実現できる。
          unknown:
            label: D
            body: わからない。
  retest_v1:
    llm_knowledge:
      scenario: '企業が、社員からの「パスワードを忘れた」「社内Wi-Fiにつながらない」「パソコンの電源が入らない」といった問い合わせに対応するAIを開発している。


        このAIは、問い合わせ内容を「アカウント」「ネットワーク」「機器」の3種類に分類し、その分類に応じた対応手順を社員に案内する。


        社員への案内は、「確認すること・対応手順・注意点」の順に、わかりやすく説明する形式にそろえたい。


        また、最近、社内の対応手順書が改訂されたため、開発担当者は新しい手順を案内に反映したいと考えている。さらに、担当者が正しく分類した過去の問い合わせ事例を利用して、AIの分類精度も改善したい。'
      questions:
      - number: 1
        title: 改訂後の対応手順書を利用する方法
        task: 改訂後の対応手順書に基づいて案内するための対応として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 社員が「社内Wi-Fiにつながらない」と相談したら、改訂後の対応手順書から関係する箇所を検索し、見つけた情報を元に、その内容を参考に案内を作成させる。
          M1:
            label: B
            body: 参照用フォルダーに保存した対応手順書を最新版に差し替えると、それに合わせてAIの学習済みの重みも更新されると考え、回答時には文書を検索させない。
          M3:
            label: C
            body: 改訂後の対応手順書を使ってAIを追加訓練し、そのAIが学習した内容から回答する方法を、問い合わせのたびに最新の手順書を検索して確認する方法と同じ仕組みとして扱う。
          unknown:
            label: D
            body: わからない。
      - number: 2
        title: 回答時の入力を工夫する方法
        task: 回答時にAIへ渡す指示や事例の使い方として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 社員への回答を「確認すること・対応手順・注意点」の順にそろえるため、AIへ渡す指示文（プロンプト）に説明する項目と順序を指定し、問い合わせへの回答時に利用する。
          M1:
            label: B
            body: 開発中、「パスワードを忘れた→アカウント」などの分類例を質問に添えるとAIが正しく分類できたため、モデル自体がその分類方法を学習したと考え、新しい会話では例を示さずに分類させる。
          M3:
            label: C
            body: 社員からの質問に応じて「最新版の対応手順書を確認して答える」とAIへの共通指示文（プロンプト）に書き、その指示文を、手順書から必要な箇所を検索して取り出す仕組みと同じものとして扱う。
          unknown:
            label: D
            body: わからない。
      - number: 3
        title: 問い合わせの分類方法を調整する方法
        task: 過去の問い合わせ事例を利用して、モデル自体の分類方法を調整する対応として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 担当者が「パスワードを忘れた→アカウント」などと確認した問い合わせ文と分類結果の組を学習用データにし、対応モデルを追加訓練して分類方法を調整する。
          M1:
            label: B
            body: 問い合わせを3種類に分類するよう毎回同じ指示をAIへ送れば、分類を繰り返すうちにモデルの重みも調整されると考え、担当者が確認した事例を使う追加訓練は行わない。
          M3:
            label: C
            body: 担当者が確認した「パスワードを忘れた→アカウント」等の分類例を保存し、問い合わせの度にシステムが似た事例を検索してAIに渡すようにする方法を、モデル自体を追加訓練する仕組みとして扱う。
          unknown:
            label: D
            body: わからない。
    multi_agent:
      scenario: '旅行会社が、公共交通を利用する日帰り観光プランを提案するAIシステムを開発している。


        例えば、利用者が「午前に美術館、午後に水族館を訪れ、17時までに出発駅へ戻りたい」と希望した場合、観光候補の情報、訪問する順番や滞在時間、電車やバスの移動条件などを考慮して、実行可能な旅行計画を案内する必要がある。


        開発担当者は、複数のAIエージェントに仕事を分担させ、協力して旅行計画を作成する仕組みを検討している。'
      questions:
      - number: 1
        title: 役割分担と担当の構成
        task: 旅行計画を作成する複数のエージェントの構成として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 観光候補を調べるAI、訪問順や滞在時間を決めるAI、電車やバスの移動条件を確認するAIを設け、それぞれが何を調べ、何を判断するかを設定する。
          M1:
            label: B
            body: 観光候補担当が選んだ施設について、日程担当が別の候補を求めると役割分担が崩れると考え、移動時間や営業時間が合わない場合も、担当間で候補の見直しを行う仕組みは設けない。
          M3:
            label: C
            body: 1つのAIに「観光候補」「日程」「移動」の3つの見出しで回答させれば、各見出しが別のAIの担当に当たると考え、複数のエージェントが協力する構成として扱う。
          unknown:
            label: D
            body: わからない。
      - number: 2
        title: 担当間の情報の受け渡し
        task: 各担当が必要な情報を利用して旅行計画を作成するための対応として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 観光候補担当が見つけた施設や営業時間を日程担当へ渡し、日程担当が作成した訪問順と予定時刻を移動確認担当に引き継ぐ仕組みを設ける。
          M1:
            label: B
            body: 観光調査・日程作成・移動確認のAIに役割を設定して個別に質問すれば、他の担当が出した結果も共有されると考え、調査内容を次の担当へ渡す仕組みは設けない。
          M3:
            label: C
            body: 電車の発着時刻だけを返す乗換検索ツールも、日程担当へ交通情報を渡す役割があるので、移動条件を判断するAIエージェントの一つとして数える。
          unknown:
            label: D
            body: わからない。
      - number: 3
        title: 計画全体の確認と見直し
        task: 利用者の希望に合う実行可能な旅行計画にするための対応として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 移動確認担当が、予定された出発時刻では17時までに駅へ戻れないと判断したら、その結果を日程担当へ返し、訪問順や滞在時間を見直せるようにする。
          M1:
            label: B
            body: 観光候補担当が営業時間に合う施設を選び、移動確認担当が利用できる電車を調べれば、各担当の結果を組み合わせるだけで17時までに出発駅へ戻れると考え、計画全体の時刻は確認しない。
          M3:
            label: C
            body: 1つのAIが移動距離に応じて徒歩と電車の案内を切り替える場合、切り替え先の処理をそれぞれ独立したAIエージェントとして数え、複数のAIが連携する構成とみなす。
          unknown:
            label: D
            body: わからない。
    memory_process:
      scenario: 料理の献立を提案するAIサービスを開発している。ある利用者は以前の相談で「ピーマンは苦手なので、今後の献立には入れないでほしい」と伝えた。その後、別の日に「最近は食べられるようになったので、これからはピーマンも献立に入れてほしい」と希望を変更した。また、提案された料理について「味が濃かったので、次からは薄味にしてほしい」と感想を伝えた。開発担当者は、別の日に新しい相談が始まった場合にも、その利用者の新しい希望や過去の感想を適切に反映できる仕組みを作りたいと考えている。
      questions:
      - number: 1
        title: 希望の保存と利用
        task: 利用者が伝えた希望を別の日の相談でも利用する方法として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 利用者が「ピーマンを避けたい」と話した段階で、その希望を利用者別の記録に保存し、別の日の相談でも必要に応じて取り出し、献立の提案に利用できるようにする。
          M1:
            label: B
            body: 過去の相談を全文保存しておけば、AIは別の日の相談でもそこに書かれた好みを自動的に把握できると考え、保存した会話から必要な情報を取り出す処理は設けない。
          M3:
            label: C
            body: 利用者が伝えた「ピーマンを避けたい」という希望を追加訓練でモデルの重みに覚えさせる処理を、利用者別の好みを保存し、必要に応じて更新・検索する記憶管理と同じ仕組みとして扱う。
          unknown:
            label: D
            body: わからない。
      - number: 2
        title: 現在の希望の管理
        task: 利用者が変更した現在の食材の希望を管理する方法として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 本人が「今後はピーマンも使ってほしい」と希望を変更したら、以前の「避けたい」という記録を現在の希望と区別して更新し、その後の献立には変更後の条件を反映する。
          M1:
            label: B
            body: 利用者が「今後はピーマンも使ってほしい」と伝えたら、以前の「避けたい」という記録を残して新しい希望を追加し、どちらが現在の希望かを判断する仕組みがなくても、次回はAIが新しい方を使うと考える。
          M3:
            label: C
            body: 以前AIが提案した「ピーマンを使わない献立」の履歴を保存し、その履歴を、利用者自身が伝えた現在の食材の希望を管理する記憶と同じものとして扱う。
          unknown:
            label: D
            body: わからない。
      - number: 3
        title: 会話で得た情報を後日の提案に生かす
        task: 会話で得た希望や感想を、別の日の新しい相談にも反映する方法として、最も適切なものを1つ選びなさい。
        choices:
          correct:
            label: A
            body: 料理への「味が濃かった」という感想から「次から薄味にしてほしい」という希望を記録し、後日の提案でも必要に応じて取り出して、味付けを考える際の参考にする。
          M1:
            label: B
            body: 「味が濃かった」という感想をもとにAIが一度薄味の献立を提案できれば、その改善内容は次の相談にも引き継がれると考え、感想や新しい希望を保存する処理は設けない。
          M3:
            label: C
            body: 同じ会話で「ピーマンも使ってほしい」と伝えた後の提案に希望が反映されたため、会話中の発言を参照する仕組みを、別の日の新しい会話でも好みを保存・更新する記憶機能と同じものとして扱う。
          unknown:
            label: D
            body: わからない。
