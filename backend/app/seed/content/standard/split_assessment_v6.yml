# 設問1の理由欄は研究者向けで、参加者には送信しない。
# M1/M3は設問設計上の操作的な解釈であり、選択だけで個人の信念を確定しない。
# エージェントの別は論理的な担当構成を指し、別モデル・別プロセスを必須としない。
# V6 contains question 1 only. Historical banks V1-V5 retain their recorded question sets.
status: active_standard_split_v6
rounds:
  pretest_v1:
    llm_knowledge:
      scenario: 家電メーカーが、最新の取扱説明書に基づいて回答する製品サポートAIを開発している。回答は「結論・操作手順・注意点」の順にそろえたい。指示を工夫しても表現にばらつきが残るため、担当者が確認した質問と回答の事例を使った追加訓練も検討している。
      questions:
      - number: 1
        title: 最新の取扱説明書を参照する方法
        task: 最新の取扱説明書に基づいて回答させるための対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 利用者から製品の操作方法を質問されたときに最新の取扱説明書に基づいた回答を作成するため、対象製品の最新の取扱説明書から関連する操作手順や注意点を検索し、見つけた箇所を質問文と一緒にシステムがAIへ渡して回答を作成させる仕組みを実装する。
          rationale: >-
            最新版の取扱説明書から質問に関係する箇所を検索し、その情報を質問と一緒にAIへ渡して回答させる。外部資料の検索と回答時の参照を組み合わせているため、この設問の正解とする。
        - role: M1
          label: B
          body: 利用者から操作方法について質問されたら、最新版の取扱説明書から関連する操作手順や注意点を検索し、その情報をAIへ渡して回答させる。渡した資料に必要な操作条件や注意点が含まれていれば回答にも正しく反映されるため、品質評価では資料の内容だけを点検し、生成された回答が資料と一致しているかは確認しない。
          rationale: >-
            本選択肢は、資料に必要な情報が含まれていれば、AIの回答にも正しく反映されると扱う。資料の充足だけで回答内容の正しさが保証されるという、回答生成の働きに関する誤りを狙うため、設問設計上M1とする。
        - role: M1
          label: C
          body: RAGで利用者の質問に関連する取扱説明書の箇所を検索する。検索結果は質問との関連度が高いほど新しい情報になっているため、関連度が最も高い箇所をAIへ渡して回答を作成させる。
          rationale: >-
            質問との関連度が高ければ、検索された情報も新しいと扱う誤りを表す。関連度は情報の新しさを保証せず、旧版の記述が最上位になる場合もある。検索順位と情報の新しさの関係に関する個別の誤った主張を狙うため、設問設計上M1とする。
        - role: M3
          label: D
          body: 改訂後の取扱説明書をAIの追加訓練に利用し、製品の操作手順や注意点を学習させる。利用者から質問を受けた際には、訓練済みのAIに学習で使った説明書の関連箇所を取り出させ、その内容を回答の根拠として案内文を作成させる。
          rationale: >-
            追加訓練したモデルから、訓練に使った説明書の該当箇所を資料として取り出せるものと扱う。パラメータ調整と資料の検索・取得という異なる処理の混同を狙うため、設問設計上M3とする。
        - role: M3
          label: E
          body: "RAGの検索用索引に文書を登録する処理は、その文書を使ってモデル自体に知識を学習させる追加訓練と同じ仕組みのため、改訂後の取扱説明書を検索用索引へ登録する。この登録作業をモデルの追加訓練として扱い、説明書が更新された場合も索引への再登録によってモデルの学習を更新する。"
          rationale: >-
            本選択肢は、検索索引への文書登録とモデルの追加訓練を同じ仕組みとして扱う。外部検索対象の整備とモデルのパラメータ調整という異なる処理の混同を狙うため、設問設計上M3とする。
        - role: unknown
          label: F
          body: わからない。
          rationale: >-
            「わからない」を選ぶ回答で、特定の誤った主張を選んでいない。個別の誤概念を割り当てず、unknownとして扱う。
    multi_agent:
      scenario: '大学が、学生からの本の貸出に関する質問に回答するAIシステムを開発している。


        例えば、学生が「統計学の入門書を借りたい。借りられる本はありますか？」と質問した場合、図書館にどのような本があるかだけでなく、その本が現在貸出中かどうかや、館外への貸出が認められているかも確認する必要がある。


        開発担当者は、図書館にある本や貸出状況を調べる担当と、本の種類や図書館の貸出規則を確認する担当に仕事を分け、それぞれが調べた情報をもとに学生へ適切な案内を行うAIシステムを作りたいと考えている。'
      questions:
      - number: 1
        title: 役割分担
        task: 複数のエージェントに役割を分担させる設計として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 蔵書担当と貸出条件担当にそれぞれ異なる仕事を設定するため、図書館にある本を調べるAIと貸出条件を確認するAIを別々のエージェントとして設け、蔵書担当には本の有無や貸出状況の調査を任せ、貸出条件担当には本の種類や貸出規則を確認させる。
          rationale: >-
            蔵書を調べる担当と貸出条件を確認する担当を別々のエージェントとして設け、それぞれの調査内容を分けている。複数の担当エージェントによる役割分担に合致するため、この設問の正解とする。
        - role: M1
          label: B
          body: 複数の担当が一つの案内を作るには同じ調査内容を返す必要があるため、蔵書担当のAIと貸出条件担当のAIの両方に、本の有無と館外貸出の可否を同じように調べさせる。
          rationale: >-
            異なる担当が一つの案内を作るには同じ調査内容が必要だと扱う。担当ごとの異なる情報を統合して案内できるため、役割分担の成立条件に関する個別の誤りを狙う選択肢として設問設計上M1とする。
        - role: M1
          label: C
          body: "役割名を与えると、名前に含まれていない調査範囲や判断基準まで開発者の意図どおりに自動設定されるため、各AIに「蔵書担当」「貸出条件担当」という名前だけを与え、担当する仕事や守る条件を具体的に設定せずに運用する。"
          rationale: >-
            本選択肢は、役割名だけで名前に含まれない調査範囲や判断基準まで開発者の意図どおりに定まると扱う。名称の指定だけで具体的な処理が十分に設定されるという誤りを狙うため、設問設計上M1とする。
        - role: M3
          label: D
          body: 図書館の案内を行う1つのAIエージェントに、「蔵書担当として本の有無を調べる指示」と「利用条件担当として貸出規則を確認する指示」を順番に与える。指示ごとに得られた回答を別々の担当エージェントの調査結果として整理し、学生への案内に利用する。
          rationale: >-
            一つのエージェントへ順に与えた複数の指示と回答を、別々の担当エージェントの結果として扱う。単一エージェントへの役割指示と複数エージェントの構成という異なる種類の混同を狙うため、設問設計上M3とする。 ここで区別するエージェントは論理的な担当構成を指し、異なる基盤モデルや物理プロセスを必須としない。
        - role: M3
          label: E
          body: 図書館の案内AIに、本の有無を調べる機能と、貸出条件を確認する機能をそれぞれ用意する。2つの機能に「蔵書担当AI」「貸出条件担当AI」という名前を付け、1つのAIがそれぞれの機能を使って得た情報を、2つの担当AIが分担して調べた結果としてまとめ、学生への案内を作成する。
          rationale: >-
            一つのAIが使う機能に担当名を付け、その機能を別の担当エージェントとして数える。AIが使う機能と仕事を担うエージェントという異なる構成要素の混同を狙うため、設問設計上M3とする。 ここで区別するエージェントは論理的な担当構成を指し、異なる基盤モデルや物理プロセスを必須としない。
        - role: unknown
          label: F
          body: わからない。
          rationale: >-
            「わからない」を選ぶ回答で、特定の誤った主張を選んでいない。個別の誤概念を割り当てず、unknownとして扱う。
    memory_process:
      scenario: '利用者の食事に関する相談に応じて、献立を提案する健康相談AIを開発している。


        ある利用者は、以前の相談で「辛い料理は避けたい」と伝えていたが、その後「最近は少し辛い料理も食べられるようになったので、これからは献立に入れてほしい」と希望を変更した。また、AIが提案した献立について「量が多かったので、次からは少なめにしてほしい」と感想を伝えた。


        開発担当者は、この利用者が別の日に新しく相談した際にも、以前に伝えた希望やその後の変更、提案への感想を踏まえて献立を提案できるAIシステムを作りたいと考えている。'
      questions:
      - number: 1
        title: 希望の保存と利用
        task: 食事上の希望を次回の相談でも利用できるようにする対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 利用者が会話で伝えた食事の好みや避けたい食材を次回以降の提案に利用できるようにするため、必要な情報を選んで利用者ごとに保存し、次の相談時に関連する情報を検索してAIがその情報を参考に食事を提案できる仕組みを実装する。
          rationale: >-
            必要な情報を利用者ごとに保存し、次の相談時に関係する情報を検索してAIへ渡す。会話を越えた情報の保持と取得を含むため、この設問の正解とする。
        - role: M1
          label: B
          body: 利用者が「辛い料理は避けたい」と伝えた会話を、利用者ごとの履歴として全文保存する。別の日の相談でも以前の希望に沿った献立を提案するため、過去の会話履歴は保存先に残しておき、AIには今回の相談内容だけを渡して回答を作成させる。
          rationale: >-
            過去の会話を保存するだけで、今回の入力に含めなくても以前の希望が回答へ反映されると扱う。保存した情報の取得・提示なしに次回の利用が自動的に成立するという、記憶の働きに関する誤りを狙うため設問設計上M1とする。
        - role: M1
          label: C
          body: 利用者が一度希望をAIに伝えるとモデルが会話を越えてその人の好みを保持するため、初回に「辛い料理は避けたい」と入力し、別の日の献立もモデルが覚えた希望に沿って提案させる。
          rationale: >-
            一度希望を入力すれば、モデルが会話を越えて利用者の好みを保持すると扱う。単発の入力だけで継続的な情報保持が起こるという仕組み上の誤認を狙うため、設問設計上M1とする。
        - role: M3
          label: D
          body: "利用者の希望に沿った質問と回答の例でモデルを追加訓練する処理は、希望を利用者別の記録として保存し、必要に応じて更新・検索する記憶管理と同じ仕組みのため、「辛い料理は避けたい」という希望に沿った回答例でAIを追加訓練する。そのモデルを利用者の希望の保存先・検索先として使い、別の日の献立提案にも利用する。"
          rationale: >-
            本選択肢は、回答傾向を調整する追加訓練と、利用者別の希望を保存・更新・検索する記憶管理を同じ仕組みとして扱う。異なる種類の処理の混同を狙うため、設問設計上M3とする。
        - role: M3
          label: E
          body: 利用者が「辛い料理は避けたい」と伝えた後、同じ会話の中で続けて献立を相談したときにも、その希望を反映できるよう、直前までの会話履歴をAIに渡す機能を設ける。この会話内で履歴を参照する機能を利用者ごとの長期記憶として採用し、別の日に新しく相談したときも以前の希望に沿った献立を提案させる。
          rationale: >-
            同じ会話内の履歴参照を、別の日の相談にも使える利用者別の長期記憶として扱う。会話内の文脈参照と会話を越える情報保持・取得という異なる仕組みの混同を狙うため、設問設計上M3とする。
        - role: unknown
          label: F
          body: わからない。
          rationale: >-
            「わからない」を選ぶ回答で、特定の誤った主張を選んでいない。個別の誤概念を割り当てず、unknownとして扱う。
  retest_v1:
    llm_knowledge:
      scenario: '企業が、社員からの「パスワードを忘れた」「社内Wi-Fiにつながらない」「パソコンの電源が入らない」といった問い合わせに対応するAIを開発している。


        このAIは、問い合わせ内容を「アカウント」「ネットワーク」「機器」の3種類に分類し、その分類に応じた対応手順を社員に案内する。


        社員への案内は、「確認すること・対応手順・注意点」の順に、わかりやすく説明する形式にそろえたい。


        また、最近、社内の対応手順書が改訂されたため、開発担当者は新しい手順を案内に反映したいと考えている。さらに、担当者が正しく分類した過去の問い合わせ事例を利用して、AIの分類精度も改善したい。'
      questions:
      - number: 1
        title: 改訂後の対応手順書を利用する方法
        task: 改訂後の対応手順書に基づいて案内するための対応として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 改訂後の対応手順書に基づいて案内するため、社員から「社内Wi-Fiにつながらない」と相談されたら、改訂後の対応手順書から関係する箇所を検索し、見つけた情報を元に、その内容を参考に案内を作成させる。
          rationale: >-
            改訂後の対応手順書から相談に関係する箇所を検索し、その情報を参考に案内を作成させる。最新の外部資料を回答時の根拠として使うため、この設問の正解とする。
        - role: M1
          label: B
          body: 参照用フォルダーの対応手順書を最新版に差し替えるとAIの学習済みの重みも更新されるため、対応手順書を最新版に差し替え、そのAIが学習した内容から案内を作成させる。
          rationale: >-
            参照用フォルダーの手順書を差し替えるだけで、モデルの学習済みの重みも更新されると扱う。外部ファイルの変更から重み更新が起こるという仕組み上の誤認を狙うため、設問設計上M1とする。
        - role: M1
          label: C
          body: 改訂後の対応手順書を一度AIへ入力すると、新しい対応方法が学習済みの重みに保存されるため、開発時に「社内Wi-Fiにつながらない」への手順を示し、その後の案内はモデルの保持した知識から作成させる。
          rationale: >-
            改訂後の手順書を一度入力すれば、内容が学習済みの重みに保存されると扱う。回答時の入力と追加訓練による重み更新を取り違える誤りを狙うため、設問設計上M1とする。
        - role: M3
          label: D
          body: 改訂後の対応手順書を、本文とページ番号を含む学習用データにまとめてAIを追加訓練する。社員から問い合わせを受けた際には、追加訓練したAIの内部から、学習時に使った手順書の該当箇所とページ番号を検索して取り出し、その情報を根拠に案内文を作成させる。
          rationale: >-
            追加訓練したモデルの内部から元の手順書とページ番号を検索して取り出せるものと扱う。モデルのパラメータに基づく生成と資料の検索・取得という異なる処理の混同を狙うため、設問設計上M3とする。
        - role: M3
          label: E
          body: 改訂後の対応手順書を、社内Wi-Fiの接続方法やパスワードの再設定方法などの項目に分け、文書検索用の索引へ登録する。この登録作業をAIモデルに新しい対応方法を学習させる工程として実施し、登録後は追加訓練を終えたAIに社員からの問い合わせへの案内を作成させる。
          rationale: >-
            文書検索用の索引へ手順書を登録する工程を、モデルの追加訓練として扱う。外部検索対象の整備とモデルのパラメータ調整という異なる処理の混同を狙うため、設問設計上M3とする。
        - role: unknown
          label: F
          body: わからない。
          rationale: >-
            「わからない」を選ぶ回答で、特定の誤った主張を選んでいない。個別の誤概念を割り当てず、unknownとして扱う。
    multi_agent:
      scenario: '旅行会社が、公共交通を利用する日帰り観光プランを提案するAIシステムを開発している。


        例えば、利用者が「午前に美術館、午後に水族館を訪れ、17時までに出発駅へ戻りたい」と希望した場合、観光候補の情報、訪問する順番や滞在時間、電車やバスの移動条件などを考慮して、実行可能な旅行計画を案内する必要がある。


        開発担当者は、複数のAIエージェントに仕事を分担させ、協力して旅行計画を作成する仕組みを検討している。'
      questions:
      - number: 1
        title: 役割分担と担当の構成
        task: 旅行計画を作成する複数のエージェントの構成として、最も適切なものを1つ選びなさい。
        choices:
        - role: correct
          label: A
          body: 担当ごとに何を調べ、何を判断するかを設定するため、観光候補を調べるAI、訪問順や滞在時間を決めるAI、電車やバスの移動条件を確認するAIを設け、それぞれに異なる仕事を担当させる。
          rationale: >-
            観光候補・日程・移動条件を扱う複数の担当AIを設け、それぞれに異なる調査・判断を割り当てている。旅行計画のための複数エージェントによる役割分担に合致するため、この設問の正解とする。
        - role: M1
          label: B
          body: "観光候補担当が選んだ施設について、日程担当や移動確認担当が再選定を求めると役割分担が崩れるため、移動時間や営業時間を確認した結果、17時までに出発駅へ戻る計画を組めない場合も、候補を見直す依頼は行わず、最初に選ばれた施設を使って計画を作成する。"
          rationale: >-
            本選択肢は、他担当から再選定を求めると役割分担が崩れると扱う。担当間で候補を再検討することと各担当の役割を保つことは両立するため、役割分担の働きに関する誤りを狙う選択肢として設問設計上M1とする。
        - role: M1
          label: C
