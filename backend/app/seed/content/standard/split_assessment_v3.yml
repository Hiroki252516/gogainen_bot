          M1:
            label: B
            body: 参照用フォルダーに保存したITサポートマニュアルを最新版に差し替えると、それに合わせてAIの学習済みの重みも更新されると考え、回答時には文書を検索させない。
          M3:
            label: C
            body: 改訂後のITサポートマニュアルを使ってAIを追加訓練し、そのAIが学習した内容から回答する方法を、問い合わせのたびに最新のマニュアルを検索して確認する方法と同じ仕組みとして扱う。
          unknown:
