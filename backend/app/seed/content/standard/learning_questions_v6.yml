version: 6
terms:
  llm_knowledge:
    variants:
    - variant_key: learning_round_v1
      scenario_type: application
      scenario: 大学の履修案内AIに、更新された履修規程を使わせたい。回答は「必要な手続き・提出期限・注意点」の順にそろえ、担当者が確認した質問と回答の例も改善に利用したい。
      task: 担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 利用者の質問に応じて履修規程の該当箇所を検索し、質問と一緒にAIへ渡して回答を作らせる。
        - 「必要な手続き・提出期限・注意点」の順に説明するよう、AIへ渡すプロンプトに指示を加える。
        - 担当者が確認した質問と回答の例を学習用データにして、AIを追加訓練する。
        M1:
        - 履修規程を一度AIへ渡せば、その内容がモデルの重みに保存され、以後は検索しなくてもよい。
        - 回答例を毎回の質問に加えれば、学習用データによる訓練をしなくてもモデルの重みを調整できる。
        - 回答の順番を指示する文章をプロンプトに加えることで、モデルの重みを更新する。
        M3:
        - 回答例をRAGの検索対象に登録すれば、回答方法の追加訓練が完了する。
        - 履修規程の該当箇所を探すには、文書検索ではなくファインチューニングを使う。
        - 履修規程の本文をプロンプトに含めれば、プロンプト自体を文書の保存・検索先として使える。
    - variant_key: learning_round_v2
      scenario_type: prediction
      scenario: 同じ基盤モデルに「表で答える」と指示した場合と、「一段落で答える」と指示した場合を比べる。どちらも追加学習はしていない。
      task: 起こり得る変化と、重み更新との関係を示す説明を三つ選びなさい。
      choices:
        correct:
        - 指示に応じて出力の形が変わっても、学習済み重みが変化したとは限らない。
        - プロンプトはモデルへ渡す入力の構成を調整する方法として使える。
        - 重みを更新するには、訓練データを使う別の学習工程を行う。
        M1:
        - 指示を変えて出力が変わると、学習済みパラメーターも更新される。
        - 出力形式を指示すると、その形式が以降もモデルに学習済み知識として保持される。
        - 出力に現れた新しい情報は、その都度モデル内部へ保存されていく。
        M3:
        - プロンプトエンジニアリングは、モデルを訓練する工程の一種である。
        - 追加学習は、回答時の入力文を整えるだけの操作に分類される。
        - モデルの出力形式を指定する機能は、外部資料の検索機構に当たる。
    - variant_key: learning_round_v3
      scenario_type: comparison
      scenario: 社内FAQで、更新頻度の高い手順書を回答時に参照する案と、例題を使ってモデルを追加訓練する案を比較している。
      task: 二つの案の処理時点や情報の扱いを区別する説明を三つ選びなさい。
      choices:
        correct:
        - FAQ参照案では、回答時に該当文書を取得して入力へ加えられる。
        - 例題による追加訓練では、学習データを使って重みを調整する。
        - 文書参照と重みの調整は、異なる処理として組み合わせることもできる。
        M1:
        - FAQを検索して入力へ加えると、その文章が重みの更新にも反映される。
        - 訓練データを使うと、例題が回答時の参照資料として添付される。
        - 外部文書を入力へ添付すると、訓練データによる重み調整も起こる。
        M3:
        - RAGは、訓練データから重みを更新する学習工程の名称である。
        - ファインチューニングは、資料を回答時に取得する検索機能である。
        - 追加訓練とプロンプト設計は、同じ種類の入力編集として分類できる。
  multi_agent:
    variants:
    - variant_key: learning_round_v1
      scenario_type: application
      scenario: 自治体が、災害時に住民向けの避難案内を作成するAIシステムを開発している。このシステムでは、被害状況や道路の情報を集めるAI、集めた情報をもとに避難方法を検討するAI、検討結果から住民向けの案内文を作成するAIにそれぞれ役割を分け、前の担当が出した結果を次の担当に引き継いで案内を行うシステムを作っている。
      task: この仕組みを説明する記述を3つ選びなさい。
      choices:
        correct:
        - 役割を持つ複数のエージェントが、担当結果を次の処理へ受け渡せる。
        - 調査結果を計画担当へ共有すると、複雑な課題を連携して進められる。
        - 最終案内を作る担当は、前段の結果を受けて別の判断を行える。
        M1:
        - 担当が共有した情報は、後続の判断でも正しい前提として利用できる。
        - 担当の役割名から、必要な情報の受け渡し先と順序が決まる。
        - 住民向け案内の担当は、調査担当と一致する回答でなければ結果を引き継げない。
        M3:
        - 担当結果のファイルそのものが、目的や判断を持つエージェントである。
        - 1つのAIエージェントに、道路が通れる場合と通れない場合で案内内容を切り替える仕組みを設け、案内の方法が2つあるので、AIエージェントも2つ存在する。
        - 性能の高いAIエージェントを1つ用意し、情報収集、避難方法の検討、住民向けの案内文作成をすべて担当させれば、複数のエージェントが連携するマルチエージェントの仕組みになる。
    - variant_key: learning_round_v2
      scenario_type: prediction
      scenario: 調査役の出力を計画役へ渡す構成と、同じプログラムが調査から案内まで一度に処理する構成を比べる。
      task: 設計変更によって生じる違いを説明する記述を三つ選びなさい。
      choices:
        correct:
        - 役割間で結果を受け渡す構成では、担当ごとの処理を連携させられる。
        - 一つの処理を複数段階に分けただけでは、独立した主体があるとは限らない。
        - 連携の有無は、処理数より役割と情報交換の設計で判断する。
        M1:
        - 調査結果を計画役へ渡すと、情報の妥当性も引き継がれる。
        - 計画役が調査結果を受け取ると、情報源の信頼性も確認済みになる。
        - 役割を分けた担当は、異なる判断をすると連携できなくなる。
        M3:
        - 一つの処理を複数手順で書いたものは、主体間協調というカテゴリーに当たる。
        - 担当間で渡す結果は、それ自体が独立した判断主体として機能する。
        - マルチエージェントは単一モデルの処理速度を上げる方式である。
    - variant_key: learning_round_v3
      scenario_type: comparison
      scenario: 問い合わせ対応で、検索ツールの結果を一つの担当が整理する案と、調査担当・回答担当が情報を共有する案を比較する。
      task: ツールの利用とエージェント間の協力を区別する記述を三つ選びなさい。
      choices:
        correct:
        - 検索ツールは情報を返す機能であり、担当エージェントは結果を評価できる。
        - 調査担当から回答担当へ根拠を渡すと、複数の役割が連携する。
        - ツールの返却値を使うことと、複数主体が協力することは別の設計要素である。
        M1:
        - ツールの出力は、共有された時点で出所と妥当性を確認済みの根拠として扱える。
        - 検索結果を共有した担当者は、同じ情報を基に同じ結論を出す。
        - 一つのエージェントが二つのツールを使うと、利用結果も次回まで記憶される。
        M3:
        - ツールが返す文章は、独立した目的と判断を持つエージェントである。
        - 複数の検索機能を置くことは、主体間の情報交換と同じ設計に当たる。
        - 担当エージェントは、検索結果を返すだけの外部機能として分類される。
  memory_process:
    variants:
    - variant_key: learning_round_v1
      scenario_type: application
      scenario: 学習支援AIが、利用者の希望する説明形式を次回にも反映したい。必要な設定だけを保存し、次回の応答前に取り出して使う。
      task: この流れを成り立たせる説明を三つ選びなさい。
      choices:
        correct:
        - 次回に使う情報を選んで保存し、必要な場面で検索して入力へ渡す。
        - 保存対象や形式、保持期間はシステムの設計で決められる。
        - 古くなった希望を更新できるよう、保存後の管理方法も考える。
        M1:
        - 希望を保存した履歴は、利用者が内容を変えた後も現在の条件として使える。
        - 会話全文を保存すれば、必要情報の検索や選択を設計する必要がない。
        - 次回の応答に情報が反映されると、その情報はモデルの重みに移される。
        M3:
        - 記憶プロセスは、学習済み重みを更新して応答傾向を変える工程である。
        - 記憶を保存する処理は、利用者が回答を検索する画面そのものである。
        - プロンプトへ会話を貼る操作だけで、保存と更新を含む記憶機能になる。
    - variant_key: learning_round_v2
      scenario_type: prediction
      scenario: AIが過去の会話から要点だけを保存し、次の相談で関連する要点を取り出す。利用者の希望が変わった場合は古い要点を更新する。
      task: この設計で起こる情報の扱いを説明する記述を三つ選びなさい。
      choices:
        correct:
        - 保存する情報を要約しておけば、全文をそのまま残さない構成にできる。
        - 次の相談に関係する記録を検索し、現在の処理で参照できる。
        - 希望が変わった際に記録を更新すれば、古い内容を修正できる。
        M1:
        - 要点を保存すると、前回の希望も現在の希望として扱える。
        - 検索して取り出した記録は、その内容がモデルの重みに反映される。
        - 要約文を保存すると、検索規則がなくても相談内容に応じて必要な記録が選ばれる。
        M3:
        - 要約文は、記憶を検索する処理と同じ種類の仕組みとして扱われる。
        - 検索機能は、会話からモデルを追加訓練する工程に当たる。
        - 保存記録は、利用者が直接操作する検索画面として分類される。
    - variant_key: learning_round_v3
      scenario_type: comparison
      scenario: 一方の会話AIは過去の希望を記録して必要時に参照する。もう一方は毎回の入力欄に以前の会話を貼り付けている。
      task: 記憶を扱う処理と単なる入力の違いを示す説明を三つ選びなさい。
      choices:
        correct:
        - 記録を保存・検索・更新する手順があるかを確認する。
        - 過去の会話を入力へ貼るだけでは、持続的な保存方法は定まらない。
        - 次回に必要な情報を選び、参照できる形で管理する設計が重要になる。
        M1:
        - 前回の会話を入力へ貼る機能を設けると、保存記録も同時に更新される。
        - 一度回答に使った会話内容は、保存操作がなくても次の相談で参照される。
        - 同じ事実が記録されていれば、項目や形式の違いは検索結果に影響しない。
        M3:
        - 会話文を入力に含める操作は、保存・検索・更新を行う記憶機構である。
        - 記憶機能はモデルの訓練済み重みそのものとして分類できる。
        - 保存された希望は、利用者が操作するアプリ画面と同じ仕組みである。
