version: 9
terms:
  llm_knowledge:
    variants:
    - variant_key: learning_round_v1
      scenario_type: application
      scenario: 大学の履修案内AIに、更新された履修規程を使わせたい。回答は「必要な手続き・提出期限・注意点」の順にそろえ、担当者が確認した質問と回答の例も改善に利用したい。
      task: 担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 利用者の質問に応じて履修規程の該当箇所を検索し、質問と一緒にAIへ渡して回答を作らせる。
        - 「必要な手続き・提出期限・注意点」の順に説明するよう、AIへ渡すプロンプトに指示を加える。
        - 担当者が確認した質問と回答の例を学習用データにして、AIを追加訓練する。
        M1:
        - 履修規程を一度AIへ渡せば、その内容がモデルの重みに保存され、以後は検索しなくてもよい。
        - 回答例を毎回の質問に加えれば、学習用データによる訓練をしなくてもモデルの重みを調整できる。
        - 回答の順番を指示する文章をプロンプトに加えることで、モデルの重みを更新する。
        M3:
        - 回答例をRAGの検索対象に登録すれば、回答方法の追加訓練が完了する。
        - 履修規程の該当箇所を探すには、文書検索ではなくファインチューニングを使う。
        - 履修規程の本文をプロンプトに含めれば、プロンプト自体を文書の保存・検索先として使える。
    - variant_key: learning_round_v2
      scenario_type: prediction
      scenario: 同じ基盤モデルに「表で答える」と指示した場合と、「一段落で答える」と指示した場合を比べる。どちらも追加学習はしていない。
      task: 起こり得る変化と、重み更新との関係を示す説明を三つ選びなさい。
      choices:
        correct:
        - 指示に応じて出力の形が変わっても、学習済み重みが変化したとは限らない。
        - プロンプトはモデルへ渡す入力の構成を調整する方法として使える。
        - 重みを更新するには、訓練データを使う別の学習工程を行う。
        M1:
        - 指示を変えて出力が変わると、学習済みパラメーターも更新される。
        - 出力形式を指示すると、その形式が以降もモデルに学習済み知識として保持される。
        - 出力に現れた新しい情報は、その都度モデル内部へ保存されていく。
        M3:
        - プロンプトエンジニアリングは、モデルを訓練する工程の一種である。
        - 追加学習は、回答時の入力文を整えるだけの操作に分類される。
        - モデルの出力形式を指定する機能は、外部資料の検索機構に当たる。
    - variant_key: learning_round_v3
      scenario_type: comparison
      scenario: 社内FAQで、更新頻度の高い手順書を回答時に参照する案と、例題を使ってモデルを追加訓練する案を比較している。
      task: 二つの案の処理時点や情報の扱いを区別する説明を三つ選びなさい。
      choices:
        correct:
        - FAQ参照案では、回答時に該当文書を取得して入力へ加えられる。
        - 例題による追加訓練では、学習データを使って重みを調整する。
        - 文書参照と重みの調整は、異なる処理として組み合わせることもできる。
        M1:
        - FAQを検索して入力へ加えると、その文章が重みの更新にも反映される。
        - 訓練データを使うと、例題が回答時の参照資料として添付される。
        - 外部文書を入力へ添付すると、訓練データによる重み調整も起こる。
        M3:
        - RAGは、訓練データから重みを更新する学習工程の名称である。
        - ファインチューニングは、資料を回答時に取得する検索機能である。
        - 追加訓練とプロンプト設計は、同じ種類の入力編集として分類できる。
  multi_agent:
    variants:
    - variant_key: learning_round_v1
      scenario_type: application
      scenario: 自治体が、災害時に住民向けの避難案内を作成するAIシステムを開発している。このシステムでは、被害状況や道路の情報を集めるAI、集めた情報をもとに避難方法を検討するAI、検討結果から住民向けの案内文を作成するAIにそれぞれ役割を分け、前の担当が出した結果を次の担当に引き継いで案内を行うシステムを作っている。
      task: この仕組みを説明する記述を3つ選びなさい。
      choices:
        correct:
        - 被害状況や道路の情報を集めるAIが調査結果を避難方法の検討担当へ渡し、その検討結果を避難案内文作成担当に引き継ぐようにすれば、複数のAIが分担した作業を順番に繋げられる。
        - 情報収集担当が被害状況と道路の通行状況を整理して避難方法の検討担当に共有し、検討担当がその情報を自分の作業に利用することで、異なる役割のAIが協力して避難案内を作れる。
        - 避難方法の検討担当から避難経路の候補を受け取った避難案内文作成担当は、その情報を参考にして、住民に何をどのような順番で伝えるかを自分の役割として判断できる。
        M1:
        - 情報収集担当のAIが道路の通行状況を調べて避難方法の検討担当へ渡した場合、検討担当は情報源が十分に確認されていると考え、その報告をもとに避難経路を決める。
        - 情報収集担当、避難方法の検討担当、避難案内文作成担当という役割名を各AIに付ければ、どの情報をどの順番で渡すかも自動的に決まるので、受け渡しの仕組みを設計する必要はない。
        - 情報収集担当が道路の通行状況を報告し、避難案内文作成担当がその情報を使って説明を作る場合でも、両者が同じ回答内容を出さなければ、結果を引き継いで連携することはできない。
        M3:
        - 情報収集担当のAIが被害状況や道路の情報をまとめたファイルは、避難方法の検討担当に情報を渡すために使われるので、そのファイルも連携するAIエージェントの一つとして数える。
        - 1つのAIエージェントに、道路が通れる場合と通れない場合で避難案内内容を切り替える仕組みを設け、案内の方法が2つあるので、AIエージェントも2つ存在する。
        - 性能の高いAIエージェントを1つ用意し、情報収集、避難方法の検討、住民向けの避難案内文作成をすべて担当させれば、複数のエージェントが連携するマルチエージェントの仕組みになる。
    - variant_key: learning_round_v2
      scenario_type: prediction
      scenario: |-
        自治体が、被害状況や道路の情報をもとに、住民向けの避難案内を作成するAIシステムについて、次の2つの設計を比較している。

        案1： 1つのAIエージェントが、情報収集、避難方法の検討、住民向け案内文の作成を順番に行う。

        案2： 情報収集、避難方法の検討、案内文の作成をそれぞれ別のAIエージェントに担当させ、前の担当の結果を次の担当へ引き継ぐ。
      task: 案1から案2に変更した場合の仕組みの違いについて、適切な説明を3つ選びなさい。
      choices:
        correct:
        - 案2では、情報収集担当のAIが集めた道路情報を避難方法の検討担当へ渡し、その検討結果を避難案内文作成担当へ引き継ぐことで、異なる担当の作業を一つの案内作成に繋げられる。
        - 案1では1つのAIが調査から避難案内文の作成まで担当するが、案2では役割ごとに別のAIを設けるため、各担当に異なる指示や必要な資料を設定する構成にできる。
        - 案2で複数のAIを連携させるには、どの担当から次の担当へ何を渡すかを決め、受け取った結果を各AIの作業に利用できるよう、情報の受け渡し方を設計する。
        M1:
        - 案2では、道路情報の調査を専門に担当するAIを設けているため、調査内容の信頼性も確保されており、避難方法の検討担当はその報告を確認せずに利用する。
        - 案2では、情報収集担当がまとめた道路情報を避難計画担当へ渡しておけば、避難計画担当の役割に必要な情報が自動的に選ばれて届くと考え、受け渡す情報の内容は特に指定しない。
        - 案2で情報収集担当が「道路Aは通行可能」と報告し、避難計画担当が「避難には道路Bを使う」と判断した場合、担当同士の結論が一致していないため、両者の判断をそろえなければ連携を続けられない。
        M3:
        - 案1では、1つのAIが情報収集、避難方法の検討、避難案内文の作成を3つの手順に分けて行っているため、3つのAIエージェントが連携している構成として分類できる。
        - 案2では、情報収集担当が作成した道路情報の報告ファイルも、計画担当が避難方法を判断する際に利用されるため、調査担当や避難計画担当と同じく、連携するAIエージェントの一つとして数える。
        - 案2で3つのAIに作業を分担させることは、1つのAIモデルの内部計算を複数に分割して処理速度を上げる方式と同じ種類の仕組みであると考える。
    - variant_key: learning_round_v3
      scenario_type: comparison
      scenario: |-
        大学が、学生からの「学内Wi-Fiにつながらない」という問い合わせに対応するAIシステムを開発している。開発担当者は、次の2つの設計を比較している。

        案1： 1つのAIエージェントが、Wi-Fiの設定マニュアルを検索するツールと、大学のネットワーク障害情報を調べるツールを使い、学生への回答を作成する。

        案2： 調査担当のAIエージェントが設定マニュアルや障害情報を調べて必要な内容を整理し、その結果を受け取った回答担当のAIエージェントが、学生への回答を作成する。

        なお、ここでいう検索ツールとは、指定された資料や情報を探して結果を返す機能を指す。
      task: 案1と案2の仕組みの違いについて、適切な説明を3つ選びなさい。
      choices:
        correct:
        - 案1でWi-Fiの設定手順が検索ツールから返ってきた場合、その手順が学生の端末に合うかを確認し、どの対処を案内するかは、ツールを使うAIエージェントが判断する。
        - 案2では、調査担当のAIが見つけた設定手順や障害情報を、回答担当のAIが受け取り、学生の問い合わせ内容に合わせて説明を組み立てることで、2つのAIが連携できる。
        - 案1で検索ツールを2種類利用しても、AIエージェントが2つに増えるわけではない。案2では調査と回答を別々のAIに担当させ、結果を受け渡している。
        M1:
        - 案1でWi-Fiの設定手順が検索結果の上位に表示された場合、その手順は学生の端末やOSに合うものとして選ばれていると考え、適用条件を確かめずに案内する。
        - 案2で調査担当のAIが設定マニュアルを調べ、接続設定のやり直しを提案した場合、同じ資料を共有する回答担当のAIも同じ対処方法を選ぶと考える。
        - 案1でマニュアル検索と障害情報確認の2つのツールを使って回答すると、使った情報はそのAIの記憶に残るため、記録を保存する仕組みがなくても次の問い合わせに利用できる。
        M3:
        - 案1で検索ツールが返したWi-Fi設定手順の説明文は、学生への回答を作るために使われるので、その文章も案2の調査担当のAIと同じ、1つのエージェントとして数える。
        - 案1ではマニュアル検索と障害情報確認という2つのツールが別々に結果を返すので、ツールが2つあることを、調査担当と回答担当の2つのAIが協力する構成と同じものとして扱う。
        - 案2で調査担当のAIが資料を読んで質問に必要な情報を整理しても、その処理は案1のマニュアル検索ツールと同じ種類の検索機能として分類できる。
  memory_process:
    variants:
    - variant_key: learning_round_v1
      scenario_type: application
      scenario: 学習支援AIが、利用者の希望する説明形式を次回にも反映したい。必要な設定だけを保存し、次回の応答前に取り出して使う。
      task: この流れを成り立たせる説明を三つ選びなさい。
      choices:
        correct:
        - 次回に使う情報を選んで保存し、必要な場面で検索して入力へ渡す。
        - 保存対象や形式、保持期間はシステムの設計で決められる。
        - 古くなった希望を更新できるよう、保存後の管理方法も考える。
        M1:
        - 希望を保存した履歴は、利用者が内容を変えた後も現在の条件として使える。
        - 会話全文を保存すれば、必要情報の検索や選択を設計する必要がない。
        - 次回の応答に情報が反映されると、その情報はモデルの重みに移される。
        M3:
        - 記憶プロセスは、学習済み重みを更新して応答傾向を変える工程である。
        - 記憶を保存する処理は、利用者が回答を検索する画面そのものである。
        - プロンプトへ会話を貼る操作だけで、保存と更新を含む記憶機能になる。
    - variant_key: learning_round_v2
      scenario_type: prediction
      scenario: AIが過去の会話から要点だけを保存し、次の相談で関連する要点を取り出す。利用者の希望が変わった場合は古い要点を更新する。
      task: この設計で起こる情報の扱いを説明する記述を三つ選びなさい。
      choices:
        correct:
        - 保存する情報を要約しておけば、全文をそのまま残さない構成にできる。
        - 次の相談に関係する記録を検索し、現在の処理で参照できる。
        - 希望が変わった際に記録を更新すれば、古い内容を修正できる。
        M1:
        - 要点を保存すると、前回の希望も現在の希望として扱える。
        - 検索して取り出した記録は、その内容がモデルの重みに反映される。
        - 要約文を保存すると、検索規則がなくても相談内容に応じて必要な記録が選ばれる。
        M3:
        - 要約文は、記憶を検索する処理と同じ種類の仕組みとして扱われる。
        - 検索機能は、会話からモデルを追加訓練する工程に当たる。
        - 保存記録は、利用者が直接操作する検索画面として分類される。
    - variant_key: learning_round_v3
      scenario_type: comparison
      scenario: 一方の会話AIは過去の希望を記録して必要時に参照する。もう一方は毎回の入力欄に以前の会話を貼り付けている。
      task: 記憶を扱う処理と単なる入力の違いを示す説明を三つ選びなさい。
      choices:
        correct:
        - 記録を保存・検索・更新する手順があるかを確認する。
        - 過去の会話を入力へ貼るだけでは、持続的な保存方法は定まらない。
        - 次回に必要な情報を選び、参照できる形で管理する設計が重要になる。
        M1:
        - 前回の会話を入力へ貼る機能を設けると、保存記録も同時に更新される。
        - 一度回答に使った会話内容は、保存操作がなくても次の相談で参照される。
        - 同じ事実が記録されていれば、項目や形式の違いは検索結果に影響しない。
        M3:
        - 会話文を入力に含める操作は、保存・検索・更新を行う記憶機構である。
        - 記憶機能はモデルの訓練済み重みそのものとして分類できる。
        - 保存された希望は、利用者が操作するアプリ画面と同じ仕組みである。
