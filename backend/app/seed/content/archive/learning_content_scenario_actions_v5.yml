version: 2
selection_policy:
  option_count: 10
  scored_labels:
  - A
  - B
  - C
  - D
  - E
  - F
  - G
  - H
  - I
  correct_count: 3
  misconception_counts:
    M1: 3
    M3: 3
  unknown_label: J
  classification_priority:
  - M3
  - M1
  - unknown
teaching_targets:
  llm_knowledge:
    D:
      corrected_claim: 説明書を一度入力するだけでは重みに保存されないため、回答時には必要な説明書の記述を入力へ渡す。
      mechanism_explanation: 推論時の入力追加と訓練によるパラメーター更新は異なり、一度参照した資料が重みに定着するわけではない。
      contrast_example: 説明書を毎回検索して入力する方法と、質問・回答の訓練例で重みを調整する方法を比較する。
    E:
      corrected_claim: 回答例を毎回入力へ加えることは例示による入力の工夫であり、それだけでモデルの重みを調整する訓練にはならない。
      mechanism_explanation: 入力中の例はその回答の文脈として使われ、重みを更新するには別途データを用いた訓練処理が必要になる。
      contrast_example: 回答例をプロンプトに添える方法と、同じ例を学習用データにして追加訓練する方法を区別する。
    F:
      corrected_claim: 回答順序の指示文を書き換えるだけでは学習済みの重みは変わらず、追加訓練の代わりにはならない。
      mechanism_explanation: プロンプトの編集はモデルに渡す入力を変える操作であり、訓練データと最適化処理によるパラメーター更新とは異なる。
      contrast_example: 結論から答えるよう指示する操作と、確認済みの回答事例でモデルを訓練する操作を比較する。
    G:
      corrected_claim: 質問・回答事例をRAGの検索対象へ登録するだけでは追加訓練は完了せず、モデルの重みを更新するには訓練処理が必要である。
      mechanism_explanation: 検索対象への登録は後で情報を取り出す準備であり、事例に基づいてパラメーターを最適化する学習処理ではない。
      contrast_example: 事例を検索して回答時の入力へ添えるRAGと、事例で重みを調整するファインチューニングを比較する。
      wrong_category: RAGへの事例登録を重み更新の訓練処理とみなすこと
      correct_category: 外部情報を登録・検索して推論時に参照する処理
      boundary_criterion: 検索対象を整備する処理か、訓練によってモデルの重みを更新する処理かで区別する。
    H:
      corrected_claim: 説明書の該当箇所は文書検索で取得し、ファインチューニングは学習用事例によってモデルの重みを調整するために使う。
      mechanism_explanation: 訓練処理へ質問を送ることは説明書の検索処理ではなく、訓練と推論時の資料取得は別の役割を持つ。
      contrast_example: 質問に関係する説明書を取り出す検索と、質問・回答の組を使って重みを調整する追加訓練を比較する。
      wrong_category: ファインチューニングの訓練処理を文書検索機能とみなすこと
      correct_category: 学習用データによってモデルの重みを調整する訓練処理
      boundary_criterion: 回答時に資料を取得する処理か、データに基づきパラメーターを更新する処理かで区別する。
    I:
      corrected_claim: 説明書の本文をプロンプトへ含めて参照させることはできるが、プロンプトそのものは文書を保存・検索するデータベースではない。
      mechanism_explanation: プロンプトはモデルへ渡す指示や文脈であり、文書データベースは資料本文を保持して必要な情報を検索する機構である。本文を入力に含めても、この管理機構が自動的に備わるわけではない。
      contrast_example: 説明書本文を今回の入力へ添えて参照させる操作と、説明書をデータベースへ保存して必要な箇所を検索する仕組みを比較する。
      wrong_category: プロンプトを資料の保存先・検索データベースとみなすこと
      correct_category: モデルに渡す指示や文脈としての入力
      boundary_criterion: 入力を指定する文面か、資料本文を保持して検索できる保存・取得機構かで区別する。
  multi_agent:
    D:
      corrected_claim: 各担当に指示を出すだけで連携が自動的に成立するわけではなく、調査結果を受け渡したり統合したりする仕組みを設ける必要がある。
      mechanism_explanation: 担当を分けても、別の担当の結果を参照できる経路や結果をまとめる処理がなければ、それぞれの調査は案内へ結び付かない。
      contrast_example: 蔵書担当と利用条件担当が別々に結果を返すだけの設計と、両者の結果を共有して一つの案内にまとめる設計を比較する。
    E:
      corrected_claim: マルチエージェントでは役割に応じて異なる判断や回答をしてよく、すべてのエージェントが同じ回答を出す必要はない。
      mechanism_explanation: 役割分担があるため、調査・計画・実行などの担当は異なる情報を処理し、最後に結果を連携できる。
      contrast_example: 調査役が候補を集め、計画役が手順を作るように異なる出力を受け渡す設計は、同一回答の反復とは異なる。
    F:
      corrected_claim: 担当が返した蔵書情報にも誤りや古さがあり得るため、案内に使う前に必要な確認を行う。
      mechanism_explanation: 担当を分けても各出力の正確さは自動保証されず、結果を統合するときには根拠や更新状況を照合する必要がある。
      contrast_example: 蔵書の状態を照合して統合する構成と、一度得た結果を無条件に正しいとする構成を比較する。
    G:
      corrected_claim: 一回の生成結果を複数の欄に分けるだけでは、目的を持つ複数の主体とその連携を実装したことにはならない。
      mechanism_explanation: 使うモデルの種類や数ではなく、担当としての実行主体、役割、結果の受け渡しを設計する。同じモデルを複数の担当として使うことはできる。
      contrast_example: 一つの応答内の見出し分けと、同じモデルでも蔵書役・条件確認役を別の実行主体として連携させる構成を比較する。
      wrong_category: 一回の回答の欄を複数のエージェントとみなすこと
      correct_category: 単一の生成結果を整理する表示上の区分
      boundary_criterion: 単なる出力の区分か、目的を持つ実行主体と主体間の情報交換がある構成かで区別する。
    H:
      corrected_claim: ツールから返されたデータは、それだけで独立した目的や判断を持つエージェントではない。
      mechanism_explanation: ツールは処理結果を返す機能であり、エージェントは目的に基づいて判断し他の主体と連携する単位である。
      contrast_example: 検索ツールの返却データと、検索結果を評価して次の行動を決める担当エージェントを比較する。
      wrong_category: 独立した目的と判断を持つエージェント
      correct_category: エージェントが利用する処理機能・データ
      boundary_criterion: 独立した目的と判断を持つ主体か、呼び出されて結果を返す機能かで分類する。
    I:
      corrected_claim: 処理が分岐するだけではマルチエージェントとは限らず、役割や自律的な判断を持つ複数の主体の連携が必要である。
      mechanism_explanation: 条件分岐は一つのワークフローでも実現できるが、マルチエージェントでは主体間の目的・役割・結果交換が設計される。
      contrast_example: 条件に応じて同じプログラムの経路が変わる処理と、異なる役割のエージェントが相談して進める処理を比較する。
      wrong_category: 単なる分岐ワークフロー
      correct_category: 役割と自律性を持つ複数主体の協調
      boundary_criterion: 分岐だけでなく、主体ごとの役割・目的・情報交換があるかで分類する。
  memory_process:
    D:
      corrected_claim: 食事の希望は必要な情報を選んで保存しても次回に利用でき、過去の会話をすべて全文のまま保存することは必須ではない。
      mechanism_explanation: 次回に必要な情報を取り出せるよう保存し、希望の変更時に更新すれば、会話全文を残さなくても記憶を利用できる。全文保存という方法自体を誤りとするものではない。
      contrast_example: 食事の好みや避けたい食材の要点を保存・更新する方法と、会話全文を保存したうえで関連情報を取り出す方法を比較し、全文保存だけが記憶の方法ではないことを示す。
    E:
      corrected_claim: 記憶を利用するときは、保存した情報の内容や鮮度を確認し、常に正しいと無条件にみなしてはいけない。
      mechanism_explanation: 保存情報には誤りや古さが含まれる可能性があるため、検索後に検証・更新する仕組みが必要になる。
      contrast_example: 保存日時や根拠を確認して使う記憶と、古い情報を検証せず回答へ使う処理を比較する。
    F:
      corrected_claim: 自己評価だけでは記憶は自動更新されず、検索先・保存形式・更新規則を設計して次の応答へ反映する必要がある。
      mechanism_explanation: 振り返りの結果を保存し、次回に検索して利用する処理があって初めて自己評価が応答改善へつながる。
      contrast_example: 評価結果を記録して次回の判断に参照する設計と、評価するだけで保存も検索もしない処理を比較する。
    G:
      corrected_claim: この場面の記憶機能は利用者の希望を保存・検索・更新する処理であり、モデルの重みの追加訓練だけではその管理機構を置き換えられない。
      mechanism_explanation: 利用者ごとの記録は保存先と検索・更新処理で管理でき、モデルのパラメーターを最適化する訓練とは別に扱う。
      contrast_example: 希望を記録して次回に取り出す処理と、事例から重みを調整する訓練工程を比較する。
      wrong_category: 利用者別の記憶管理を重み更新の訓練工程だけで置き換えること
      correct_category: 過去情報の保存・検索・更新を行う管理処理
      boundary_criterion: 個々の記録を管理する処理か、訓練によってパラメーターを最適化する工程かで区別する。
    H:
      corrected_claim: 一般公開の栄養資料を検索するだけでは、利用者が話した個別の希望を保存・更新したことにはならない。
      mechanism_explanation: 公開資料の検索対象には保存していない個人の希望は含まれない。RAGを個別記録の検索に利用すること自体は可能である。
      contrast_example: 公開の栄養資料だけを検索する処理と、利用者の希望を記録して後で検索・更新する処理を比較する。
      wrong_category: 公開資料の検索だけを利用者固有の経験の記憶管理とみなすこと
      correct_category: 一般的な外部資料の検索・参照
      boundary_criterion: 検索方式の名称だけでなく、利用者固有の情報が保存され、変更に応じて更新されるかを確認する。
    I:
      corrected_claim: 前回の会話をプロンプトに貼り付けるだけでは、会話終了後も情報を保存・検索・更新する記憶機能を実装したことにはならない。
      mechanism_explanation: プロンプトへの貼り付けは今回の回答へ過去情報を渡す操作であり、会話終了後にも情報を保持し、次回に取り出して変更を反映する機構とは区別する。保存済み履歴を入力へ戻すこと自体は記憶利用の一部になり得る。
      contrast_example: 今回だけ会話文を手入力する操作と、保存した希望を次回に検索して変更時に更新する仕組みを比較する。
      wrong_category: 一時的な入力への貼付だけを継続的な記憶管理機構とみなすこと
      correct_category: その回答時だけの入力文脈の追加
      boundary_criterion: 今回の入力操作にとどまるか、会話終了後も続く保存・検索・更新処理を備えるかで区別する。
terms:
- slug: llm_knowledge
  label: LLMに知識を与える方法
  description: LLMに知識や能力を与える方法には、事前学習、ファインチューニング、プロンプトエンジニアリング、RAGなどがあり、それぞれ重み更新の有無や情報を使う時点が異なる。
  keywords:
  - 事前学習
  - ファインチューニング
  - プロンプトエンジニアリング
  - RAG
  - 外部知識
  component_terms:
  - 事前学習
  - ファインチューニング
  - プロンプトエンジニアリング
  - RAG
  rag_sections:
  - '3.1'
  - 事前学習
  - ファインチューニング
  - プロンプトエンジニアリング
  questions:
    pretest:
    - variant_key: pretest_v1
      scenario: 家電メーカーが、最新の取扱説明書に基づいて回答する製品サポートAIを開発している。回答は「結論・操作手順・注意点」の順にそろえたい。指示を工夫しても表現にばらつきが残るため、担当者が確認した質問と回答の事例を使った追加訓練も検討している。
      task: 開発担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 利用者の質問に応じて最新の取扱説明書を検索し、該当箇所を質問と一緒にAIへ渡して回答を作らせる仕組みを実装する。
        - 利用者からの質問に回答するとき、「結論・操作手順・注意点」の順に説明するよう、AIに指示するプロンプトを設定する。
        - 担当者が確認した質問と回答の見本を使ってAIを追加訓練し、「結論・操作手順・注意点」の順で答えるように調整する。
        M1:
        - 新しい説明書を一度入力して重みに保存させ、以後は説明書を参照する処理を省く。
        - 回答例を毎回の入力に加えて重みを調整し、学習用データによる訓練処理を省く。
        - 回答を「結論・操作手順・注意点」の順にする指示をプロンプトに加えることで、モデルの重みも更新されると考え、質問と回答の事例を使った追加訓練は行わない。
        M3:
        - 回答方法を追加学習させるため、質問と回答の事例をRAGの検索対象へ登録して訓練を済ませる。
        - 説明書の該当箇所を取り出すため、文書検索の代わりにファインチューニングの訓練処理へ質問を送る。
        - 取扱説明書を保存・検索する仕組みとして、説明書の本文をプロンプトに登録し、プロンプトそのものを文書データベースとして利用するように設計する。
    retest:
    - variant_key: retest_v1
      scenario: 企業が、社員からの「パスワードを忘れた」「社内Wi-Fiにつながらない」「パソコンの電源が入らない」といった問い合わせに対応するAIを開発している。このAIは、問い合わせを「アカウント」「ネットワーク」「機器」の3種類に分類し、分類結果と対応手順を決められた形式で案内する。最近、社内の対応手順書が改訂されたため、開発担当者は新しい手順を案内に反映したい。また、担当者が正しく分類した過去の問い合わせ事例を利用して、AIの分類精度も改善したいと考えている。
      task: これらの目的を実現するための開発担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 社員が「社内Wi-Fiにつながらない」と相談したら、改訂後の対応手順書から関係する箇所を検索し、見つけた情報をAIに示して、その内容を参考に案内を作成させる。
        - 問い合わせを「アカウント」「ネットワーク」「機器」のいずれかに分類し、分類名と対応手順を指定した順番で表示するよう、AIへ渡すプロンプトに指示を加える。
        - 担当者が「パスワードを忘れた→アカウント」などと確認した問い合わせ文と分類結果の組を学習用データにし、対応モデルを追加訓練して分類方法を調整する。
        M1:
        - 担当者が分類した過去の問い合わせ事例を開発時に一度AIへ渡しておけば、その判断基準がモデルの重みに記憶されると考え、その後は事例を提示せずに分類させる。
        - 参照用フォルダーに保存した対応手順書を最新版に差し替えると、それに合わせてAIの学習済みの重みも更新されると考え、回答時には文書を検索させない。
        - 問い合わせを3種類に分類するよう毎回同じ指示をAIへ送れば、分類を繰り返すうちにモデルの重みも調整されると考え、担当者が確認した事例を使う追加訓練は行わない。
        M3:
        - 担当者が分類した問い合わせ事例を文書検索用の索引に登録し、似た質問を探せるようにする処理を、モデルの分類方法を学習させる追加訓練と同じ仕組みとして扱う。
        - 改訂された対応手順書から、社員の問い合わせに必要な箇所を探すため、モデルを追加訓練するファインチューニングを文書検索の機能として組み込む。
        - 改訂後の対応手順書の本文をAIへの共通プロンプトに記載し、そのプロンプト自体を、手順書を継続的に保存し、必要な箇所を探す文書データベースとして扱う。
    - variant_key: retest_v2
      scenario: |-
        企業が、会議の文字起こしをもとに議事録を作成するAIを開発している。

        議事録には、会議で決まった内容を「決定事項・担当者・期限」の3項目に整理して記載したい。また、会議で使われた社内の略称は、改訂される用語集に載っている正式表記に統一したいと考えている。

        現在は、AIが作成する議事録の文章構成や表現にばらつきがあるため、担当者が内容を確認した過去の文字起こしと完成済みの議事録も改善に活用したい。
      task: これらの目的を実現する開発担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 会議の文字起こしに社内の略称が出てきた場合は、最新の用語集からその正式表記を検索し、見つかった情報をAIに参照させて議事録を作成する仕組みを設ける。
        - 文字起こしから議事録を作る際、「決定事項・担当者・期限」の順に内容を整理するよう、AIに渡す指示文（プロンプト）に書式や説明の順番を指定する。
        - 担当者が内容を確認した文字起こしと完成した議事録の組を学習用データにまとめ、追加訓練に対応するモデルを使って、議事録の文章構成やまとめ方を調整する。
        M1:
        - 最新の用語集を開発時に一度AIに読ませておけば、そこにある正式表記がモデルの重みに保存されると考え、その後の会議では用語集を参照させずに議事録を作る。
        - 担当者が完成させた議事録を毎回プロンプトに見本として含めて回答させれば、使用するたびにモデルの重みも調整されると考え、別途の追加訓練は行わない。
        - 最初の会議で「決定事項・担当者・期限」の順に書くよう指示すると、その書式がモデルの重みに定着すると考え、次の独立した会話では同じ指示を与えずに議事録を作らせる。
        M3:
        - 過去の文字起こしと完成済みの議事録を検索対象に登録し、似た会議の事例を取り出して参照させる処理を、モデルに議事録の書き方を学習させる追加訓練と同じ種類の仕組みとして扱う。
        - 議事録に社内の略称が出てきたとき、ファインチューニングの仕組みにその語を渡せば最新の用語集から正式表記を検索できると考え、文書検索機能の代わりに組み込む。
        - 最新の用語集の本文をAIへの共通の指示文（プロンプト）に含め、そのプロンプト自体を、用語集を継続的に保存・管理し、必要な表記を検索する文書データベースとして扱う。
- slug: multi_agent
  label: マルチエージェント
  description: マルチエージェントは、複数のエージェントに役割や目的を持たせ、情報共有や結果の受け渡しを通じて複雑な課題を分担して処理する設計である。
  keywords:
  - マルチエージェント
  - エージェント
  - 役割分担
  - 情報共有
  - タスク分解
  component_terms:
  - 役割分担
  - タスク分解
  - 情報共有
  - 結果の統合
  rag_sections:
  - '4.1'
  questions:
    pretest:
    - variant_key: pretest_v1
      scenario: 図書館の案内システムは、蔵書を調べる担当と利用条件を確認する担当を分け、結果を合わせて質問へ回答する。
      task: 開発担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 蔵書を調べる役と利用条件を確認する役を別のエージェントとして設け、それぞれに目的を与える。
        - 蔵書担当の調査結果を利用条件の確認担当へ渡し、貸出可能な候補を絞り込ませる。
        - 両担当の結果をまとめる処理を設け、食い違う条件を確認してから利用者への案内を作る。
        M1:
        - 蔵書を調べる担当と利用条件を確認する担当にそれぞれ指示を出し、調査結果を受け渡したり統合したりする仕組みを設けずに、担当同士が自動的に連携して案内を作るように設計する。
        - 担当ごとの調査内容を分ける代わりに全員へ同じ最終回答を出させ、回答が異なる場合は連携を止める。
        - 担当が一度返した蔵書情報は常に正しいものとして扱い、案内前に情報の古さを確認する処理を省く。
        M3:
        - 一回の回答を蔵書欄と条件欄に分けるだけで、別の主体を設けずに複数エージェントの構成を完成させる。
        - 検索で返された本の一覧そのものを判断主体として数え、独立した担当の代わりに役割を割り当てる。
        - 貸出可否の条件分岐だけを増やし、判断する担当や情報交換を設けずにエージェント群を構成する。
    retest:
    - variant_key: retest_v1
      scenario: 旅行計画AIでは、観光候補を調べる担当、日程を組む担当、移動条件を確かめる担当が順番に結果を共有する。
      task: 開発担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 観光候補の調査、日程作成、移動条件の確認を担うエージェントを設け、担当ごとの目的を決める。
        - 調査担当が得た観光候補を日程担当へ渡し、作成した日程を移動条件の確認担当へ引き継ぐ。
        - 各担当の出力を統合するときに日程と移動条件の矛盾を確認し、必要な担当へ修正を依頼する。
        M1:
        - 複数の指示を順番に実行するだけで協力が生じると考え、担当間で結果を渡す処理を用意しない。
        - 観光調査と日程作成の担当に同一内容の出力を求め、役割に応じた異なる成果物を使わない。
        - 移動担当が得た交通情報は変化しないものとして扱い、計画をまとめる際の再確認を省く。
        M3:
        - 一つの回答に調査・日程・移動の見出しを付けるだけで、複数の判断主体を実装したことにする。
        - 交通検索ツールの時刻表データを一人の担当とみなし、データ自体に日程調整の判断を任せる。
        - 距離に応じた処理分岐だけを複数設け、担当ごとの目的や結果の共有なしに協調構成とする。
    - variant_key: retest_v2
      scenario: 博物館の案内AIは、展示内容を調べる担当と来館者の希望を整理する担当を使い、短い見学案を作る。
      task: 開発担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 展示内容の調査と来館者の希望整理を担うエージェントを分け、各担当に処理する課題を定める。
        - 希望整理担当の結果を展示調査担当へ渡し、希望に関連する展示候補を選ばせる。
        - 展示候補と希望条件をまとめて照合し、見学時間に収まる案を作る統合処理を設ける。
        M1:
        - 指示文を複数用意すれば担当間で情報が伝わると考え、調査結果を共有する手順を設けない。
        - 展示調査と希望整理の担当には同じ文章を出力させ、異なる結果の組合せによる分担を避ける。
        - 担当が取得した展示情報は更新されても正確なままとして扱い、見学案を作る際の確認を省く。
        M3:
        - 一回の生成結果を展示と希望の二欄に分け、独立した担当を設けずにエージェント群として運用する。
        - 展示検索で返された一覧を自律的な担当として扱い、一覧自体に来館者への提案を判断させる。
        - 来館目的に応じた条件分岐を用意するだけで、担当の役割や情報交換なしに複数主体の連携を実現する。
- slug: memory_process
  label: 記憶プロセス
  description: 記憶プロセスは、過去の対話や経験から必要な情報を保存・検索・更新し、現在の応答や次の処理に活用する仕組みである。
  keywords:
  - 記憶プロセス
  - 保存
  - 検索
  - 更新
  - 自己評価
  - 振り返り
  component_terms:
  - 記憶の保存
  - 記憶の検索
  - 記憶の更新
  - 振り返り
  rag_sections:
  - 5.1.1
  questions:
    pretest:
    - variant_key: pretest_v1
      scenario: 健康相談AIは、利用者が伝えた食事上の希望を次回の提案にも生かしたい。希望が変わったときは古い内容をそのまま使わない。
      task: 開発担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 利用者が会話で伝えた食事の好みや避けたい食材から、次回以降の提案に必要な情報を選んで利用者ごとに保存し、次の相談時に関連する情報を検索して、AIがその情報を参考に食事を提案できる仕組みを実装する。
        - 利用者から希望の変更を受けたら以前の記録と照合し、次回は更新した内容を参照する。
        - 提案への反応を振り返って必要な要点を記録し、次の相談で取り出して説明の調整に使う。
        M1:
        - 利用者の食事の希望を次回も覚えておくには、必要な情報だけを保存する方法では記憶できないため、過去の会話をすべて全文のまま保存する仕組みを実装する。
        - 一度記録した食事上の希望は常に現在も正しいとみなし、変更の申し出があっても以前の内容を使う。
        - 応答後に自己評価だけを実行し、結果の保存や次回の検索を設けずに後の提案へ反映させる。
        M3:
        - 利用者別の記録を保存・検索する処理の代わりに、モデルの重みの追加訓練だけを記憶機能として実装する。
        - 一般公開の栄養資料を検索する機能だけを用意し、個人の希望を保存せずに利用者別の記憶管理まで完了させる。
        - 前回の会話をプロンプトに貼り付けるだけで、会話終了後も情報を保存・検索・更新する記憶機能を実現できる。
    retest:
    - variant_key: retest_v1
      scenario: 料理提案サービスは、利用者が避けたい食材を次回の献立にも反映する。利用者が考えを変えた場合は登録内容を直す。
      task: 開発担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 避けたい食材の要点を利用者ごとに記録し、次の献立を作る前に関連する条件を取り出す。
        - 避ける食材が変わったら保存済みの条件を確認して修正し、次の献立には新しい記録を使う。
        - 献立への感想から次回に役立つ要点を保存し、後の提案で必要な範囲を検索して利用する。
        M1:
        - 相談内容を選別すると保存できなくなると考え、全発言を一字一句変えず無期限に蓄積する。
        - 最初に保存した好みはその後も正しいものとして扱い、新たな希望より以前の条件を優先する。
        - 献立を振り返る処理だけを実行し、評価結果を記録せず次の相談にも改善が引き継がれるものとする。
        M3:
        - 好みを管理する保存先や検索機能を設けず、モデルのパラメーターを訓練する工程だけで記憶処理を置き換える。
        - 公開レシピを検索する仕組みだけを作り、利用者の好みを保存しないまま個人の経験の記憶として運用する。
        - 以前の相談文を毎回入力へ貼る操作だけを用意し、会話をまたぐ保存と変更の管理も実装したことにする。
    - variant_key: retest_v2
      scenario: 問い合わせ窓口は、利用者が以前に指定した連絡方法を次回の案内に使う。新しい指定があれば以前の情報と置き換える。
      task: 開発担当者の対応として、適切なものを3つ選びなさい。
      choices:
        correct:
        - 指定された連絡方法の要点を記録し、次の問い合わせを案内する際に必要な情報を検索して使う。
        - 新しい連絡先の指定を受けたら旧記録を確認して更新し、次回の案内では新しい指定を参照する。
        - 連絡に関するやり取りの振り返りを要点として保存し、後の案内で必要な記録を取り出す。
        M1:
        - 記録を要約すると引き継げなくなると考え、問い合わせの全文を同じ形のまま永久保存する。
        - 保存済みの連絡方法は現在も必ず正しいと考え、利用者が指定を変えても元の記録で案内する。
        - 案内の自己評価を行うだけで、保存先や次回の参照処理を設けずに以降の案内へ改善を反映させる。
        M3:
        - 連絡方法を外部に記録して検索する代わりに、モデルの重みを再訓練する工程だけを記憶処理として用意する。
        - 一般的な窓口案内を検索する機能だけを設け、個別の連絡方法を保存せず利用者情報の記憶として扱う。
        - 前回のやり取りを今回の質問に付け足すだけで、終了後も続く情報の保存・検索・更新を実装済みとする。
