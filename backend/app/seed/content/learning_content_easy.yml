        E: 過去の希望が常に現在も正しいという誤った主張。
        F: 保存なしで振り返りが次回へ伝わるという誤った主張。
        G: 個人の記録管理をモデル訓練として扱う分類。
        H: 一般資料検索を未保存の個人情報の記憶として扱う分類。
