version: 2
selection_policy:
  option_count: 10
  scored_labels:
  - A
  - B
  - C
  - D
  - E
  - F
  - G
  - H
  - I
  correct_count: 3
  misconception_counts:
    M1: 3
    M3: 3
  unknown_label: J
  classification_priority:
  - M3
  - M1
  - unknown
teaching_targets:
  llm_knowledge:
    D:
      corrected_claim: 資料を一度読ませるだけでは、AI自体が追加学習されたことにはならない。
      mechanism_explanation: 質問で渡した資料はその回答の材料であり、別の会話にも自動で覚えているとは限らない。
      contrast_example: 毎回メモを見て答える方法と、事例を使ってAI自体を訓練する方法を比べる。
    E:
      corrected_claim: 回答例を質問に添えることと、その例でAIを追加訓練することは別の操作である。
      mechanism_explanation: 例を見ながら答える場合はその質問の入力を使っており、学習用データでの訓練は行っていない。
      contrast_example: 質問に回答の見本を添える方法と、見本を学習用データにして訓練する方法を比べる。
    F:
      corrected_claim: 指示を書き直すだけでは、AI自体の学習内容を変更する訓練にはならない。
      mechanism_explanation: 指示は今回どう答えてほしいかを伝えるもので、モデルの内部を調整する追加学習とは処理が異なる。
      contrast_example: 短く答えるよう頼む操作と、確認済みの回答例でモデルを追加学習する操作を比べる。
    G:
      corrected_claim: RAGに回答例を登録するだけでは、モデルの追加学習は終わらない。
      mechanism_explanation: RAGは必要な情報を探して回答に使う仕組みであり、AI自体の学習内容を変える訓練ではない。
      contrast_example: 回答例を探して読むことと、回答例でモデル自体を訓練することを比べる。
      wrong_category: 資料を登録する検索の準備を、モデルの訓練として扱うこと
      correct_category: 外の情報を探して、その回答で参照する仕組み
      boundary_criterion: 回答時に資料を使う処理か、モデル自体を訓練する処理かで区別する。
    H:
      corrected_claim: 資料を探すには検索を使い、ファインチューニングは回答例による追加学習に使う。
      mechanism_explanation: ファインチューニングはモデルを訓練する処理であり、質問に関係する案内文を取り出す検索ではない。
      contrast_example: 案内文を探して質問へ添える操作と、事例で答え方を訓練する操作を比べる。
      wrong_category: 訓練の仕組みを、必要な資料を取り出す検索として扱うこと
      correct_category: データを使ってモデル自体を調整する追加学習
      boundary_criterion: 資料を取り出す処理か、モデルを訓練する処理かで区別する。
    I:
      corrected_claim: プロンプトへ資料名を書くことだけでは、資料の本文を保存して検索する機能は備わらない。
      mechanism_explanation: プロンプトはAIへ渡す指示や情報であり、名前を書くだけで外のファイルを読める仕組みではない。
      contrast_example: 資料名を指示へ書くだけの場合と、本文の保存先と検索機能を用意する場合を比べる。
      wrong_category: 指示文を、資料本文の保存先や検索機構として扱うこと
      correct_category: AIに渡す指示や、その回答で使う情報
      boundary_criterion: 指示を書いた文面か、本文を保管して取り出す仕組みかで区別する。
  multi_agent:
    D:
      corrected_claim: 指示が二つあるだけでは、担当間で結果が伝わる仕組みはできない。
      mechanism_explanation: 役割を持つ担当を用意したうえで、どの結果を次の担当へ渡すかを決める必要がある。
      contrast_example: 調べた情報を予定の担当に渡す構成と、指示を二つ書くだけの構成を比べる。
    E:
      corrected_claim: 役割が違う担当は違う結果を出してよく、同じ文章を答える必要はない。
      mechanism_explanation: 調べる担当と予定を作る担当では仕事が違うため、それぞれの成果を受け渡して使う。
      contrast_example: 行き先の候補と旅行の日程のように、異なる出力を合わせて案を作る場合を考える。
    F:
      corrected_claim: 担当AIが得た情報にも古さや誤りがあり得るため、必要な確認を行う。
      mechanism_explanation: 担当を分けても出力の正しさが自動で保証されるわけではなく、情報の根拠や時期を確かめる。
      contrast_example: 新しい時刻表を確認する場合と、一度調べた時間をずっと信じる場合を比べる。
    G:
      corrected_claim: 一つの回答を欄で分けるだけでは、別々の担当AIを実装したことにはならない。
      mechanism_explanation: 見出しや欄は出力のまとめ方であり、仕事を持つ別の実行主体と情報の受け渡しとは異なる。
      contrast_example: 一回の答えを見出しで分ける案と、調べ役から予定役へ結果を渡す案を比べる。
      wrong_category: 回答内の表示の区切りを、別々の判断主体として扱うこと
      correct_category: 一つの回答を整理する表示上の区分
      boundary_criterion: 単なる文の区分か、別の担当と結果の受け渡しがある構成かで区別する。
    H:
      corrected_claim: 検索結果の一覧は担当AIが使う情報であり、それ自体が考える担当ではない。
      mechanism_explanation: 一覧の文章や表はデータであり、目的に応じて次の行動を選ぶ主体とは区別する。
      contrast_example: 観光地の一覧と、その一覧から候補を選んで次の担当へ渡すAIを比べる。
      wrong_category: 返されたデータを、自分で考えて行動する主体として扱うこと
      correct_category: 担当が判断のために使う情報・データ
      boundary_criterion: 自分で判断する担当か、その担当が読む情報かで区別する。
    I:
      corrected_claim: 条件で処理を分けるだけでは、複数の担当AIが協力する構成とは限らない。
      mechanism_explanation: 条件分岐は一つの処理にも作れるが、担当の連携には役割と情報交換の設計が必要である。
      contrast_example: 雨なら屋内にする分岐と、調査役が情報を予定役へ渡す仕組みを比べる。
      wrong_category: 通常の条件分岐を、複数の担当による協調として扱うこと
      correct_category: 条件に応じて動きを変える処理
      boundary_criterion: 分岐だけか、役割を持つ担当同士が情報を渡す構成かで区別する。
  memory_process:
    D:
      corrected_claim: 次回に使う要点を選んで保存でき、会話全文を永久保存する必要はない。
      mechanism_explanation: 記録の範囲や形は設計で決められるため、必要な好みだけをまとめて残す方法も使える。
      contrast_example: 好きな音楽だけを短く記録する方法と、相談を何も選ばず全部残す方法を比べる。
    E:
      corrected_claim: 好みは変わることがあるため、古い記録より新しく伝えられた希望を確認する。
      mechanism_explanation: 保存された情報が今も正しいとは限らず、変更があれば前の内容を見直して更新する。
      contrast_example: 以前好きだったものを使い続ける場合と、新しい希望に記録を直す場合を比べる。
    F:
      corrected_claim: 振り返りを後の相談へ生かすには、その要点を記録して次回に使う手順が必要である。
      mechanism_explanation: その場で評価しただけでは別の会話へ自動で伝わらず、保存や読み出しを通して利用する。
      contrast_example: 感想の要点をメモに残して次に読む場合と、その場で考えるだけの場合を比べる。
    G:
      corrected_claim: この場面の記憶は好みを保存して使う仕組みであり、AIの追加訓練だけでは代わりにならない。
      mechanism_explanation: 個人ごとの記録を残して探す処理と、学習用データでモデル自体を調整する工程は別の役割を持つ。
      contrast_example: 利用者の好みをメモから読む操作と、AI自体を事例で訓練する操作を比べる。
      wrong_category: 個人の記録管理を、モデル自体の訓練として扱うこと
      correct_category: 過去の情報を保存・読み出し・更新する管理機構
      boundary_criterion: 個々の記録を管理する処理か、モデル自体を学習させる工程かで区別する。
    H:
      corrected_claim: 一般の紹介記事を検索するだけでは、利用者が話した好みの記録を保存したことにはならない。
      mechanism_explanation: 公開資料には保存していない個人の希望は入っていない。RAGを個人の記録の検索に使うこと自体はできる。
      contrast_example: 一般の趣味の記事を読む場合と、前の相談で聞いた好きなことを記録して読む場合を比べる。
      wrong_category: 一般資料だけの検索を、利用者固有の経験の記憶管理として扱うこと
      correct_category: 一般的な外部資料を探して読む処理
      boundary_criterion: 検索方法の名前でなく、個人の情報を保存して変更時に直せるかで区別する。
    I:
      corrected_claim: 今回だけ前の文を貼る操作と、終了後も続く保存・読み出し・更新の機能は別である。
      mechanism_explanation: 入力に書いた内容が別の相談にも残るとは限らない。保存した履歴を入力へ戻すことは記憶の利用になり得る。
      contrast_example: その場の質問にだけ好みを書く場合と、保存した好みを次回に探して更新する場合を比べる。
      wrong_category: 今回だけの入力追加を、継続的な記憶管理の仕組みとして扱うこと
      correct_category: その回答で使う入力情報の追加
      boundary_criterion: 今だけの入力か、会話をまたぐ保存先や更新の手順があるかで区別する。
terms:
- slug: llm_knowledge
  label: LLMに知識を与える方法
  description: LLMに知識や能力を与える方法には、事前学習、ファインチューニング、プロンプトエンジニアリング、RAGなどがあり、それぞれ重み更新の有無や情報を使う時点が異なる。
  keywords:
  - 事前学習
  - ファインチューニング
  - プロンプトエンジニアリング
  - RAG
  - 外部知識
  component_terms:
  - 事前学習
  - ファインチューニング
  - プロンプトエンジニアリング
  - RAG
  rag_sections:
  - '3.1'
  - 事前学習
  - ファインチューニング
  - プロンプトエンジニアリング
  questions:
    pretest:
    - variant_key: pretest_v1
      scenario: 学校のお知らせに答えるAIを作る。新しい案内を使い、答えの形もそろえたい。先生が確かめた回答例も使える。
      task: この場面で適切な対応を3つ選びなさい。
      choices:
        correct:
        - 学校の最新の案内を探し、必要な文をAIに読ませて答えさせる。
        - 答えてほしい順番を、質問するときの指示に書いて伝える。
        - 確認済みの回答例を学習用のデータにして、答え方を追加学習させる。
        M1:
        - 案内を一度読ませてAI自体に覚えさせ、次からは資料を渡さない。
        - 回答例を質問に添えるだけでAI自体を学習させ、追加学習は省く。
        - 指示文を書き直してAI自体の学習内容を変え、追加学習の代わりにする。
        M3:
        - 答え方を練習させるため、RAGに回答例を置くだけで学習を済ませる。
        - 案内の必要な文を探すため、追加学習の処理へ質問を送る。
        - プロンプトを資料の保管場所にし、案内のファイル名だけを書いておく。
      choice_rationales:
        D: 一度の資料参照で学習済み内容も変わるという誤った主張。
        E: 例の提示だけで追加訓練も済むという誤った主張。
        F: 指示の編集だけでモデル自体が学習するという誤った主張。
        G: 検索・登録をモデルの訓練として扱う分類。
        H: 訓練を資料検索として扱う分類。
        I: 入力文を資料の保管・検索機構として扱う分類。
    retest:
    - variant_key: retest_v1
      scenario: 店の案内に答えるAIを作る。新しい店の情報を使い、短く答えさせたい。店員が直した回答例も使える。
      task: この場面で適切な対応を3つ選びなさい。
      choices:
        correct:
        - 店の新しい案内から必要な文を探し、その質問の入力に加える。
        - 短く答えるように、質問と一緒にAIへ送る指示を変える。
        - 店員が直した質問と回答の組を使い、答え方を追加学習させる。
        M1:
        - 新しい案内を一度入力すれば学習されると考え、次から読む処理を省く。
        - 回答の見本を毎回の質問に付けるだけで、AI自体の追加学習を済ませる。
        - 短く答える指示を何度も送り、学習用のデータを使う訓練の代わりにする。
        M3:
        - 回答の仕方を学習させるため、RAGの検索先に例を追加するだけで済ませる。
        - 店の案内を取り出すため、ファインチューニングの訓練へ質問文を渡す。
        - 指示文を案内の検索先として使い、資料の名前だけで本文を取り出させる。
      choice_rationales:
        D: 一度の資料参照で学習済み内容も変わるという誤った主張。
        E: 例の提示だけで追加訓練も済むという誤った主張。
        F: 指示の編集だけでモデル自体が学習するという誤った主張。
        G: 検索・登録をモデルの訓練として扱う分類。
        H: 訓練を資料検索として扱う分類。
        I: 入力文を資料の保管・検索機構として扱う分類。
    - variant_key: retest_v2
      scenario: 趣味の教室の質問に答えるAIを作る。新しい案内を使い、決まった形で答えさせたい。講師が確認した回答例も使える。
      task: この場面で適切な対応を3つ選びなさい。
      choices:
        correct:
        - 教室の新しい案内から関連する部分を探し、その回答の入力に含める。
        - 回答に使う見出しと順番を、質問時に渡す指示へ書く。
        - 講師が確かめた回答の事例を用意し、モデルの答え方を追加学習させる。
        M1:
        - 案内を一度読ませて学習済みの内容を変え、後の質問では案内を使わない。
        - 検索先の資料を入れ替えるだけでAI自体も学習されると考え、訓練を省く。
        - 書式の指示を編集してモデル自体を訓練し、回答例での学習を省く。
        M3:
        - RAGへの資料登録を訓練とみなし、回答例を置くだけで追加学習を終える。
        - 最新の案内文を見つけるため、資料検索の代わりに追加訓練を呼び出す。
        - プロンプトを案内文の保存先と考え、資料名だけで保存と検索を済ませる。
      choice_rationales:
        D: 一度の資料参照で学習済み内容も変わるという誤った主張。
        E: 例の提示だけで追加訓練も済むという誤った主張。
        F: 指示の編集だけでモデル自体が学習するという誤った主張。
        G: 検索・登録をモデルの訓練として扱う分類。
        H: 訓練を資料検索として扱う分類。
        I: 入力文を資料の保管・検索機構として扱う分類。
- slug: multi_agent
  label: マルチエージェント
  description: マルチエージェントは、複数のエージェントに役割や目的を持たせ、情報共有や結果の受け渡しを通じて複雑な課題を分担して処理する設計である。
  keywords:
  - マルチエージェント
  - エージェント
  - 役割分担
  - 情報共有
  - タスク分解
  component_terms:
  - 役割分担
  - タスク分解
  - 情報共有
  - 結果の統合
  rag_sections:
  - '4.1'
  questions:
    pretest:
    - variant_key: pretest_v1
      scenario: 家族旅行の予定をAIで考える。行き先を調べる役と、予定を組む役に分けて協力させたい。
      task: この場面で適切な対応を3つ選びなさい。
      choices:
        correct:
        - 行き先を調べるAIと予定を組むAIを分け、それぞれの仕事を決める。
        - 調べた行き先の情報を予定を組むAIへ渡し、計画に使わせる。
        - 二つのAIの結果を合わせ、時間や移動に無理がないか確かめる。
        M1:
        - 指示を二つ書けば自動で協力すると考え、結果を渡す処理は作らない。
        - 二つのAIが同じ文を答えるようにし、別の結果を出したら連携を止める。
        - AIが一度調べた情報は必ず正しいと考え、古くなっても確認せず使う。
        M3:
        - 一回の回答を二つの欄に分けるだけで、別々のAIの役を用意したことにする。
        - 検索で出た観光地の一覧自体を、考えて行動するAIの一人として数える。
        - 条件で処理を分けるだけで、役割や情報交換のあるAIの集まりにする。
      choice_rationales:
        D: 複数の指示だけで情報共有も成立するという誤った主張。
        E: 役割が違っても同一の出力が必要という誤った主張。
        F: 担当の出力が常に正しいという誤った主張。
        G: 一つの応答の区分を別々の主体として扱う分類。
        H: データを考える主体として扱う分類。
        I: 分岐を複数主体の連携として扱う分類。
    retest:
    - variant_key: retest_v1
      scenario: 文化祭の準備をAIで手伝う。必要な物を調べる役と、予算を考える役を分けて進めたい。
      task: この場面で適切な対応を3つ選びなさい。
      choices:
        correct:
        - 物を調べる担当と予算を決める担当を用意し、役割を割り当てる。
        - 必要な物の一覧を予算担当へ渡し、金額を考える材料にする。
        - 各担当の結果を比べ、予算を超える場合は案の修正を頼む。
        M1:
        - 複数の指示を送るだけで連携できると考え、担当同士の受け渡しを省く。
        - どの担当にも同じ内容を出させ、調査と予算で別の結果を作るのをやめる。
        - 担当が調べた値段はずっと正しいとみなし、購入前の確認を省く。
        M3:
        - 一つの回答に調査欄と予算欄を作るだけで、複数の担当AIを作ったことにする。
        - 検索結果の値段表を考える主体とみなし、その表自体に予算を決めさせる。
        - 金額による条件分岐だけを増やし、別の役割を持つAIの連携として扱う。
      choice_rationales:
        D: 複数の指示だけで情報共有も成立するという誤った主張。
        E: 役割が違っても同一の出力が必要という誤った主張。
        F: 担当の出力が常に正しいという誤った主張。
        G: 一つの応答の区分を別々の主体として扱う分類。
        H: データを考える主体として扱う分類。
        I: 分岐を複数主体の連携として扱う分類。
    - variant_key: retest_v2
      scenario: 買物を助けるAIを作る。商品を調べる役と、希望に合う商品を選ぶ役を協力させたい。
      task: この場面で適切な対応を3つ選びなさい。
      choices:
        correct:
        - 商品を調べる担当AIと選ぶ担当AIに、それぞれ違う目的を与える。
        - 調査担当が見つけた商品の情報を、選ぶ担当へ渡して使わせる。
        - 各担当の結果をまとめ、値段や希望の条件に合うか確認する。
        M1:
        - 二つの指示があれば勝手に連携すると考え、調査結果の共有を作らない。
        - 役割が違っても同じ回答だけを出させ、異なる判断を使わない。
        - 一度集めた商品情報は常に正しいとみなし、変更の確認をやめる。
        M3:
        - 一回の返答を商品欄とおすすめ欄に分けるだけで、複数の判断主体を設ける。
        - 商品検索で返された文章自体を、目的を持つ担当AIとして扱う。
        - 値段による処理の分岐だけを作り、担当同士が協力する仕組みとみなす。
      choice_rationales:
        D: 複数の指示だけで情報共有も成立するという誤った主張。
        E: 役割が違っても同一の出力が必要という誤った主張。
        F: 担当の出力が常に正しいという誤った主張。
        G: 一つの応答の区分を別々の主体として扱う分類。
        H: データを考える主体として扱う分類。
        I: 分岐を複数主体の連携として扱う分類。
- slug: memory_process
  label: 記憶プロセス
  description: 記憶プロセスは、過去の対話や経験から必要な情報を保存・検索・更新し、現在の応答や次の処理に活用する仕組みである。
  keywords:
  - 記憶プロセス
  - 保存
  - 検索
  - 更新
  - 自己評価
  - 振り返り
  component_terms:
  - 記憶の保存
  - 記憶の検索
  - 記憶の更新
  - 振り返り
  rag_sections:
  - 5.1.1
  questions:
    pretest:
    - variant_key: pretest_v1
      scenario: 趣味の相談に答えるAIを作る。利用者の好きなことを次の相談にも使い、好みが変わったら直したい。
      task: この場面で適切な対応を3つ選びなさい。
      choices:
        correct:
        - 好きなことの要点を記録し、次の相談で必要な記録を取り出す。
        - 新しい好みを聞いたら前の記録を確認し、今の内容へ更新する。
        - 提案への感想を要点として残し、次の相談で見直す材料にする。
        M1:
        - 全部残す以外は記憶できないと考え、会話全文を永久に保存する。
        - 一度保存した好みは必ず正しいと考え、変わったと言われても前の内容を使う。
        - 提案を振り返るだけで次にも反映されると考え、結果の保存をしない。
        M3:
        - 好みの記録を保存する仕組みの代わりに、モデル自体を追加訓練する処理だけを作る。
        - 一般の趣味の紹介記事だけを検索し、個人の好みの記録も管理できたことにする。
        - 前の会話を今回の質問に手で貼るだけで、終了後の保存や更新も実装済みとする。
      choice_rationales:
        D: 全文の永久保存だけが記憶だという誤った主張。
        E: 過去の希望が常に現在も正しいという誤った主張。
        F: 保存なしで振り返りが次回へ伝わるという誤った主張。
        G: 個人の記録管理をモデル訓練として扱う分類。
        H: 一般資料検索を未保存の個人情報の記憶として扱う分類。
        I: 一時入力を継続的な記録管理として扱う分類。
    retest:
    - variant_key: retest_v1
      scenario: 献立を考えるAIを作る。避けたい食材を次回にも使い、利用者が希望を変えたら記録を直したい。
      task: この場面で適切な対応を3つ選びなさい。
      choices:
        correct:
        - 避ける食材を必要な形で保存し、次の献立を考える前に読み出す。
        - 食材の希望が変わったら、前の記録を新しい指定に直す。
        - 献立への感想の要点を残し、後の提案で必要なものを取り出す。
        M1:
        - 一部だけでは覚えられないと考え、相談の全発言を無期限に保存する。
        - 保存した好みはいつも正しいと考え、新しい希望より古い記録を使う。
        - 献立を自己評価するだけで改善が続くと考え、評価した内容を残さない。
        M3:
        - 保存や読み出しを行う機能の代わりに、AIの内部を訓練する工程だけを用意する。
        - 公開レシピの検索だけを行い、保存していない個人の希望も記憶したことにする。
        - 相談文を毎回入力に加える操作だけで、会話後の保存と更新まで用意したことにする。
      choice_rationales:
        D: 全文の永久保存だけが記憶だという誤った主張。
        E: 過去の希望が常に現在も正しいという誤った主張。
        F: 保存なしで振り返りが次回へ伝わるという誤った主張。
        G: 個人の記録管理をモデル訓練として扱う分類。
        H: 一般資料検索を未保存の個人情報の記憶として扱う分類。
        I: 一時入力を継続的な記録管理として扱う分類。
    - variant_key: retest_v2
      scenario: 説明するAIに、利用者が希望する回答の長さを次回も使わせたい。希望が変われば前の記録も直したい。
      task: この場面で適切な対応を3つ選びなさい。
      choices:
        correct:
        - 回答の長さの希望を保存し、次の質問でその記録を探して使う。
