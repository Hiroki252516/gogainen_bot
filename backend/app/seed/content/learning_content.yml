version: 1
selection_policy:
  option_count: 10
  correct_labels: [A, B, C]
  misconception_labels:
    M1: [D, E, F]
    M3: [G, H, I]
  unknown_label: J
  classification_priority: [M3, M1, unknown]

option_sets:
  llm_knowledge: &llm_knowledge_options
    - {label: A, body: "事前学習は、大規模で多様なデータから言語パターンや一般的知識の基盤を獲得する方法である。", is_correct: true, misconception_type: null}
    - {label: B, body: "RAGは、回答時に外部文書を検索し、その内容をモデルへの文脈として利用する方法である。", is_correct: true, misconception_type: null}
    - {label: C, body: "プロンプトエンジニアリングは、指示や入力の構成を工夫して、望ましい応答を引き出す方法である。", is_correct: true, misconception_type: null}
    - {label: D, body: "RAGを使うと、検索した文書の内容がその場でモデルの重みに恒久的に書き込まれる。", is_correct: false, misconception_type: M1}
    - {label: E, body: "プロンプトエンジニアリングを行えば、モデルの学習済み重みそのものが更新される。", is_correct: false, misconception_type: M1}
    - {label: F, body: "ファインチューニングは、入力文の書き方を少し変えるだけで、訓練データを使わない。", is_correct: false, misconception_type: M1}
    - {label: G, body: "RAGは、モデル内部に知識を保存するための重み更新そのものである。", is_correct: false, misconception_type: M3}
    - {label: H, body: "プロンプトエンジニアリングは、外部文書を検索するデータベースという種類の仕組みである。", is_correct: false, misconception_type: M3}
    - {label: I, body: "事前学習は、利用者が回答を検索するための画面やアプリケーションである。", is_correct: false, misconception_type: M3}
    - {label: J, body: "わからない。", is_correct: false, misconception_type: unknown}

  multi_agent: &multi_agent_options
    - {label: A, body: "マルチエージェントでは、複数のエージェントが役割分担しながら課題に取り組める。", is_correct: true, misconception_type: null}
    - {label: B, body: "エージェント間の情報共有や結果の受け渡しを設計すると、複数の処理を連携させられる。", is_correct: true, misconception_type: null}
    - {label: C, body: "複雑な課題を分解し、調査・計画・実行などの役割ごとに処理させることができる。", is_correct: true, misconception_type: null}
    - {label: D, body: "プロンプトを複数書けば、役割分担や情報交換がなくても必ずマルチエージェントになる。", is_correct: false, misconception_type: M1}
    - {label: E, body: "マルチエージェントでは、すべてのエージェントが常に同じ回答を出さなければならない。", is_correct: false, misconception_type: M1}
    - {label: F, body: "エージェントが一度得た情報は、設計に関係なく永久に正しい記憶として保持される。", is_correct: false, misconception_type: M1}
    - {label: G, body: "マルチエージェントとは、単一の巨大なモデルを一つの処理として実行する方式である。", is_correct: false, misconception_type: M3}
    - {label: H, body: "ツールから返されたデータそのものが、独立した目的と判断を持つエージェントである。", is_correct: false, misconception_type: M3}
    - {label: I, body: "処理が分岐するワークフローは、エージェントの役割や自律性がなくても必ずマルチエージェントである。", is_correct: false, misconception_type: M3}
    - {label: J, body: "わからない。", is_correct: false, misconception_type: unknown}

  memory_process: &memory_process_options
    - {label: A, body: "記憶プロセスは、過去の対話や経験から必要な情報を保存し、後で参照できるようにする処理である。", is_correct: true, misconception_type: null}
    - {label: B, body: "記憶を検索・更新・要約する仕組みによって、現在の処理へ過去の情報を活用できる。", is_correct: true, misconception_type: null}
    - {label: C, body: "自己評価や振り返りを記憶プロセスと組み合わせると、過去の結果を次の応答改善に利用できる。", is_correct: true, misconception_type: null}
    - {label: D, body: "記憶プロセスは、過去の会話を必ず一字一句そのまま永久保存する処理である。", is_correct: false, misconception_type: M1}
    - {label: E, body: "記憶を利用する場合、保存した情報は内容を確認せず、常に正しいものとして使う。", is_correct: false, misconception_type: M1}
    - {label: F, body: "自己評価を一度行えば、記憶の検索や更新を設計しなくても自動的に次の応答へ反映される。", is_correct: false, misconception_type: M1}
    - {label: G, body: "記憶プロセスは、モデルの学習済み重みそのものと同じ種類の知識保存である。", is_correct: false, misconception_type: M3}
    - {label: H, body: "RAGによる文書検索と記憶プロセスは、目的や更新方法に違いがなく完全に同じ仕組みである。", is_correct: false, misconception_type: M3}
    - {label: I, body: "会話の入力を一つのプロンプトに貼り付けるだけで、記憶プロセス全体が成立する。", is_correct: false, misconception_type: M3}
    - {label: J, body: "わからない。", is_correct: false, misconception_type: unknown}

teaching_targets:
  llm_knowledge:
    D:
      corrected_claim: "RAGは回答時に検索した文書を文脈として使うが、その内容をモデルの重みに恒久的に書き込む仕組みではない。"
      mechanism_explanation: "RAGでは検索結果が推論時の入力文脈へ追加されるだけで、学習済みパラメーターは更新されない。"
      contrast_example: "RAGは新しい資料を検索してその場の回答に使うが、ファインチューニングは訓練データで重みを更新する。"
    E:
      corrected_claim: "プロンプトエンジニアリングは入力文脈や指示を工夫する方法であり、それだけで学習済みモデルの重みを更新するものではない。"
      mechanism_explanation: "同じモデルでも指示によって出力は変わるが、追加学習やファインチューニングを実行しない限り学習済みパラメーターは変化しない。"
      contrast_example: "プロンプトを『箇条書きで答えて』に変えると出力形式は変わるが、訓練データで重みを更新するファインチューニングとは異なる。"
    F:
      corrected_claim: "ファインチューニングは訓練データを使ってモデルの重みを調整する学習処理であり、入力文の書き方を変えるだけの方法ではない。"
      mechanism_explanation: "ファインチューニングでは例示データと最適化処理を使ってパラメーターを更新するため、プロンプトの言い換えとは処理が異なる。"
      contrast_example: "入力の指示を工夫するだけならプロンプトエンジニアリングであり、訓練例から重みを調整する場合がファインチューニングである。"
    G:
      corrected_claim: "RAGは推論時に外部文書を検索して文脈へ加える仕組みであり、モデル内部の重みを更新する学習処理ではない。"
      mechanism_explanation: "RAGの検索結果は現在の入力に一時的に追加され、モデル内部へ保存される知識とは扱いが異なる。"
      contrast_example: "外部文書を検索して回答に利用するRAGと、訓練データで重みを更新する事前学習・ファインチューニングを区別する。"
      wrong_category: "重みを更新する学習処理"
      correct_category: "推論時に外部情報を文脈へ追加する検索拡張"
      boundary_criterion: "モデルの重みを更新するか、回答時の入力文脈だけを追加するかで分類する。"
    H:
      corrected_claim: "プロンプトエンジニアリングは外部文書を検索するデータベースではなく、指示や入力の構成を工夫する方法である。"
      mechanism_explanation: "プロンプトはモデルへ渡す入力を設計するもので、文書検索や検索結果の保存を必ず含む仕組みではない。"
      contrast_example: "指示文を整理して出力を改善するプロンプトエンジニアリングと、文書を検索するRAGは別の役割を持つ。"
      wrong_category: "外部文書を検索するデータベース"
      correct_category: "モデルへの入力・指示を設計する方法"
      boundary_criterion: "入力の指示を構成する方法か、外部文書を検索して文脈へ追加する仕組みかで分類する。"
    I:
      corrected_claim: "事前学習は大規模データからモデルの基盤を学習する処理であり、利用者が回答を検索する画面やアプリケーションではない。"
      mechanism_explanation: "事前学習はモデル開発時にデータからパラメーターを調整する工程であり、利用者が回答を探す操作画面とは役割が異なる。"
      contrast_example: "データから重みを学習する事前学習と、利用者が質問を入力して回答を表示するアプリケーションを区別する。"
      wrong_category: "利用者が回答を検索する画面・アプリケーション"
      correct_category: "モデルをデータから学習させる訓練工程"
      boundary_criterion: "モデルを訓練する工程か、利用者が回答を操作する画面かで分類する。"
  multi_agent:
    D:
      corrected_claim: "プロンプトを複数書くだけではマルチエージェントとは限らず、役割分担や情報交換を持つ複数の主体が必要である。"
      mechanism_explanation: "マルチエージェントでは複数のエージェントが目的や役割を持ち、結果を受け渡して協力する。"
      contrast_example: "指示文を複数並べただけの単一処理と、調査役と計画役が結果を共有する設計を比較する。"
    E:
      corrected_claim: "マルチエージェントでは役割に応じて異なる判断や回答をしてよく、すべてのエージェントが同じ回答を出す必要はない。"
      mechanism_explanation: "役割分担があるため、調査・計画・実行などの担当は異なる情報を処理し、最後に結果を連携できる。"
      contrast_example: "調査役が候補を集め、計画役が手順を作るように異なる出力を受け渡す設計は、同一回答の反復とは異なる。"
    F:
      corrected_claim: "エージェントが得た情報は設計された保存・検証・更新の仕組みに依存し、永久に正しい記憶として保持されるわけではない。"
      mechanism_explanation: "エージェントの情報は記憶の保存先や更新規則、検証方法によって扱いが決まり、誤りや古さを確認する必要がある。"
      contrast_example: "検証して期限付きで保存する共有情報と、設計なしに一度得た情報を永久に信じることを比較する。"
    G:
      corrected_claim: "マルチエージェントは単一の巨大なモデルを一つの処理として使う方式ではなく、複数の役割を持つエージェントが連携する設計である。"
      mechanism_explanation: "単一モデルの処理数ではなく、独立した役割・目的を持つ主体間の情報交換と結果統合が構成要件になる。"
      contrast_example: "一つのモデルが一つの回答を作る構成と、調査・計画・実行の担当が結果を渡す構成を比較する。"
      wrong_category: "単一モデルによる一つの処理"
      correct_category: "複数の役割を持つ主体の協調設計"
      boundary_criterion: "主体ごとの役割や目的、情報の受け渡しがあるかで分類する。"
    H:
      corrected_claim: "ツールから返されたデータは、それだけで独立した目的や判断を持つエージェントではない。"
      mechanism_explanation: "ツールは処理結果を返す機能であり、エージェントは目的に基づいて判断し他の主体と連携する単位である。"
      contrast_example: "検索ツールの返却データと、検索結果を評価して次の行動を決める担当エージェントを比較する。"
      wrong_category: "独立した目的と判断を持つエージェント"
      correct_category: "エージェントが利用する処理機能・データ"
      boundary_criterion: "独立した目的と判断を持つ主体か、呼び出されて結果を返す機能かで分類する。"
    I:
      corrected_claim: "処理が分岐するだけではマルチエージェントとは限らず、役割や自律的な判断を持つ複数の主体の連携が必要である。"
      mechanism_explanation: "条件分岐は一つのワークフローでも実現できるが、マルチエージェントでは主体間の目的・役割・結果交換が設計される。"
      contrast_example: "条件に応じて同じプログラムの経路が変わる処理と、異なる役割のエージェントが相談して進める処理を比較する。"
      wrong_category: "単なる分岐ワークフロー"
      correct_category: "役割と自律性を持つ複数主体の協調"
      boundary_criterion: "分岐だけでなく、主体ごとの役割・目的・情報交換があるかで分類する。"
  memory_process:
    D:
      corrected_claim: "記憶プロセスは過去の会話を必ず一字一句そのまま永久保存する処理ではなく、必要な情報を選択して保存・検索・更新する設計である。"
      mechanism_explanation: "記憶の保存範囲や形式、保持期間は設計で決まり、要約や更新によって内容を管理できる。"
      contrast_example: "必要な要点を要約して更新する記憶と、すべての会話を無期限にそのまま保存する処理を比較する。"
    E:
      corrected_claim: "記憶を利用するときは、保存した情報の内容や鮮度を確認し、常に正しいと無条件にみなしてはいけない。"
      mechanism_explanation: "保存情報には誤りや古さが含まれる可能性があるため、検索後に検証・更新する仕組みが必要になる。"
      contrast_example: "保存日時や根拠を確認して使う記憶と、古い情報を検証せず回答へ使う処理を比較する。"
    F:
      corrected_claim: "自己評価だけでは記憶は自動更新されず、検索先・保存形式・更新規則を設計して次の応答へ反映する必要がある。"
      mechanism_explanation: "振り返りの結果を保存し、次回に検索して利用する処理があって初めて自己評価が応答改善へつながる。"
      contrast_example: "評価結果を記録して次回の判断に参照する設計と、評価するだけで保存も検索もしない処理を比較する。"
    G:
      corrected_claim: "記憶プロセスはモデルの学習済み重みそのものではなく、外部に情報を保存・検索・更新して処理へ利用する仕組みである。"
      mechanism_explanation: "記憶の情報は保存先や検索処理を通じて入力へ戻されるが、モデルのパラメーター更新とは別に管理される。"
      contrast_example: "外部ストレージから過去情報を検索する記憶と、訓練でモデルの重みを変える学習を比較する。"
      wrong_category: "モデル内部の学習済み重み"
      correct_category: "外部情報を保存・検索・更新する処理"
      boundary_criterion: "情報がモデルの重みに組み込まれるか、外部の保存と検索で利用されるかで分類する。"
    H:
      corrected_claim: "RAGによる文書検索と記憶プロセスは目的や更新方法が異なり、完全に同じ仕組みではない。"
      mechanism_explanation: "RAGは主に外部文書を検索して現在の回答へ使い、記憶プロセスは過去の情報を保存・更新し次回へ活用する。"
      contrast_example: "固定された社内文書を検索するRAGと、対話から要点を保存して後で更新する記憶を比較する。"
      wrong_category: "RAGと完全に同一の検索処理"
      correct_category: "過去情報の保存・検索・更新を管理する処理"
      boundary_criterion: "主な対象が外部文書の検索か、経験・対話情報の保存と更新かで分類する。"
    I:
      corrected_claim: "会話を一つのプロンプトへ貼り付けるだけでは、保存・検索・更新を含む記憶プロセス全体は成立しない。"
      mechanism_explanation: "記憶プロセスには過去情報を管理する保存先と、必要な情報を取り出し更新する処理が必要である。"
      contrast_example: "毎回会話全文を入力へ貼るだけの方法と、要点を保存して必要時に検索・更新する記憶を比較する。"
      wrong_category: "入力文へ過去会話を貼り付けるだけの操作"
      correct_category: "保存・検索・更新を備えた情報管理処理"
      boundary_criterion: "一時的な入力追加だけか、情報を継続管理する保存・検索・更新があるかで分類する。"

terms:
  - slug: llm_knowledge
    label: "LLMに知識を与える方法"
    description: "LLMに知識や能力を与える方法には、事前学習、ファインチューニング、プロンプトエンジニアリング、RAGなどがあり、それぞれ重み更新の有無や情報を使う時点が異なる。"
    keywords: [事前学習, ファインチューニング, プロンプトエンジニアリング, RAG, 外部知識]
    component_terms: [事前学習, ファインチューニング, プロンプトエンジニアリング, RAG]
    rag_sections: ["3.1", "事前学習", "ファインチューニング", "プロンプトエンジニアリング"]
    questions:
      pretest:
        - {variant_key: pretest_v1, body: "LLMに知識や能力を与える方法について、適切なものをすべて選びなさい。", expected: "A、B、Cをすべて選択し、それ以外を選ばない。", options: *llm_knowledge_options}
      retest:
        - {variant_key: retest_v1, body: "LLMの知識や能力を補う方法について、正しい説明をすべて選びなさい。", expected: "A、B、Cをすべて選択し、それ以外を選ばない。", options: *llm_knowledge_options}
        - {variant_key: retest_v2, body: "重み更新を伴う方法と、利用時に情報を与える方法の説明として適切なものをすべて選びなさい。", expected: "A、B、Cをすべて選択し、それ以外を選ばない。", options: *llm_knowledge_options}
        - {variant_key: retest_v3, body: "事前学習・RAG・プロンプトの役割を区別した説明として適切なものをすべて選びなさい。", expected: "A、B、Cをすべて選択し、それ以外を選ばない。", options: *llm_knowledge_options}
        - {variant_key: retest_v4, body: "LLMへ情報を与える仕組みの違いに関する説明として適切なものをすべて選びなさい。", expected: "A、B、Cをすべて選択し、それ以外を選ばない。", options: *llm_knowledge_options}
      final_test:
        - {variant_key: final_test_v1, body: "LLMに知識や能力を与える方法について、最も適切な説明をすべて選びなさい。", expected: "A、B、Cをすべて選択し、それ以外を選ばない。", options: *llm_knowledge_options}
      l0: "LLMに知識や能力を与える方法を、重み更新の有無と利用時の情報の扱いに触れて説明してください。"
      transfer: "新しい社内資料を参照しながら回答するLLMを設計するとき、事前学習・プロンプト・RAGのどれをどのように使い分けるか説明してください。"
    learning:
      enrichment:
        material: "LLMに知識を与える方法を、学習時に重みを変える方法と、利用時に情報を与える方法に分けて整理します。"
        variants:
          - {variant_key: learning_enrichment_v1, body: "LLMに知識を与える方法のうち、学習時に行う方法と利用時に行う方法を区別して説明しなさい。", options: *llm_knowledge_options}
          - {variant_key: learning_enrichment_v2, body: "事前学習、RAG、プロンプトエンジニアリングの役割を一つずつ説明しなさい。", options: *llm_knowledge_options}
          - {variant_key: learning_enrichment_v3, body: "RAGが回答時にどのように外部知識を使うかを説明しなさい。", options: *llm_knowledge_options}
          - {variant_key: learning_enrichment_v4, body: "モデルの重みを更新する方法と、更新せずに情報を与える方法の違いを説明しなさい。", options: *llm_knowledge_options}
          - {variant_key: learning_enrichment_v5, body: "LLMへ知識を与える方法を、使うタイミングと情報の所在に触れて説明しなさい。", options: *llm_knowledge_options}
      conceptual_change:
