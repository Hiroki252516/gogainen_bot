  - slug: multi_agent
    label: "マルチエージェント"
    description: "マルチエージェントは、複数のエージェントに役割や目的を持たせ、情報共有や結果の受け渡しを通じて複雑な課題を分担して処理する設計である。"
    keywords: [マルチエージェント, エージェント, 役割分担, 情報共有, タスク分解]
    component_terms: [役割分担, タスク分解, 情報共有, 結果の統合]
    rag_sections: ["4.1"]
    questions:
      pretest:
        - variant_key: pretest_v1
          role_rotation: 3
          scenario: "図書館の案内システムは、蔵書を調べる担当と利用条件を確認する担当を分け、結果を合わせて質問へ回答する。"
          task: "複数の担当を連携させる設計として正しい説明を3つ選びなさい。"
          choices:
            correct:
              - "担当ごとに異なる役割を持たせ、複数の主体で依頼へ対応できる。"
              - "検索で得た要点を次の担当へ渡し、組み合わせた回答を作れる。"
              - "複雑な依頼を調査・条件確認・案内の仕事へ分けて処理できる。"
            M1:
              - "複数の指示文を順に置けば、役割や結果交換を設計しなくても協調になる。"
              - "担当ごとに異なる案内を作ると、同じ仕組みとして連携できなくなる。"
              - "調査担当が見つけた情報は、その後の確認なしに正しい記憶として扱える。"
            M3:
              - "一つのモデルが工程を順番に実行する構成が、複数エージェントそのものである。"
              - "検索機能が返した書誌情報そのものが、目的を持つエージェントに当たる。"
              - "条件分岐を増やしたプログラムは、主体の役割なしでもマルチエージェントである。"
      retest:
        - variant_key: retest_v1
          role_rotation: 6
          scenario: "旅行計画AIでは、観光候補を調べる担当、日程を組む担当、移動条件を確かめる担当が順番に結果を共有する。"
          task: "この構成が課題を分担する方法として適切な説明を3つ選びなさい。"
          choices:
            correct:
              - "候補調査と日程作成を別の役割に割り当て、複数主体で進められる。"
              - "各担当が得た結果を受け渡す設計により、後続の判断へ利用できる。"
              - "複数条件の計画を、調査・比較・日程化などの単位に分けられる。"
            M1:
              - "指示文を何種類か作れば、担当間の役割や情報共有がなくても協力になる。"
              - "各担当が別々の候補を提案すると、一つのシステムとして機能しなくなる。"
              - "一つの担当が集めた旅行情報は、確認しなくても正確なまま共有できる。"
            M3:
              - "同じモデルへ調査と計画を続けて依頼する手順が、複数エージェントである。"
              - "地図検索が返す経路一覧そのものが、独自の目的を持つエージェントである。"
              - "経路条件で処理先を分けるプログラムは、それだけで複数主体の設計となる。"
        - variant_key: retest_v2
          role_rotation: 0
          scenario: "博物館の案内AIは、展示内容を調べる担当と来館者の希望を整理する担当を使い、短い見学案を作る。"
          task: "担当の連携と単なる処理分割を区別した説明を3つ選びなさい。"
          choices:
            correct:
              - "展示調査と希望の整理に別の役割を持つエージェントを配置できる。"
              - "調査結果を希望整理の担当へ渡し、見学案の作成に生かせる。"
              - "複雑な案内を情報収集・条件確認・提案の仕事に分けて進められる。"
            M1:
              - "指示を複数回送るだけで、担当や情報の受け渡しを決めなくても協調できる。"
              - "調査担当と提案担当は、同じ内容の回答を出す設計でなければ連携しない。"
              - "一度得た展示情報は、保存方法に関わらず正確な知識として使い続けられる。"
            M3:
              - "一つの大きなモデルが複数工程を処理する構成が、エージェント群に当たる。"
              - "展示検索ツールの結果一覧自体が、判断や目標を持つエージェントである。"
              - "希望に応じて経路を分ける処理は、役割がなくてもマルチエージェントである。"
        - variant_key: retest_v3
          role_rotation: 3
          scenario: "災害対応の計画支援では、被害情報を整理する担当と物資の配分を考える担当が情報を引き継ぐ。"
          task: "複数の主体が協力する仕組みについて正しい説明を3つ選びなさい。"
          choices:
            correct:
              - "情報整理と配分計画に異なる役割を持つ主体を割り当てられる。"
              - "整理した被害状況を計画担当へ渡し、次の判断の材料にできる。"
              - "複雑な対応を情報確認・優先順位付け・配分案作成に分担できる。"
            M1:
              - "複数のプロンプトを続けて使えば、各担当の役割を決めなくても協働になる。"
              - "担当が別の配分案を出すと、同一課題に対する連携は成立しなくなる。"
              - "収集された被害情報は、検証工程を設けなくても正しい前提として扱える。"
            M3:
              - "一つのモデル内で作業手順を分ける方法が、そのままマルチエージェントである。"
              - "情報検索の返却データが、それ自体で判断を行うエージェントとなる。"
              - "災害状況に応じて条件分岐するだけで、複数エージェントの構成になる。"
        - variant_key: retest_v4
          role_rotation: 6
          scenario: "研究支援AIは、論文を探す担当、要点を整理する担当、研究者の条件と照合する担当を連携させる。"
          task: "この設計の役割分担と情報の受け渡しを正しく説明するものを3つ選びなさい。"
          choices:
            correct:
              - "検索・要約・条件照合を別の担当へ割り当てて進められる。"
              - "論文の要点を次の担当へ渡す流れが、処理の連携を支える。"
              - "大きな依頼を検索・整理・適合確認の単位に分けて扱える。"
            M1:
              - "複数の指示を準備することだけで、役割を持つ主体の連携が作られる。"
              - "担当ごとに違う要点をまとめると、エージェント同士は協力できない。"
              - "検索で得た論文情報は、出典確認を省いても正しい記憶として残せる。"
            M3:
              - "一つのモデルが検索と要約を連続実行する構成は複数の主体による設計である。"
              - "検索結果の論文一覧は、それ自体が目標を立てるエージェントとして働く。"
              - "検索語に応じた分岐処理は、独立した役割がなくてもエージェント群となる。"
        - variant_key: retest_v5
          role_rotation: 0
          scenario: "倉庫の出荷支援では、在庫を調べる担当、注文の優先度を決める担当、作業順を作る担当が結果をつなぐ。"
          task: "このシステムをマルチエージェントとして説明する記述を3つ選びなさい。"
          choices:
            correct:
              - "在庫確認と優先判断など、担当ごとに異なる役割を設計できる。"
              - "在庫の確認結果を優先判断や作業順の担当へ引き継げる。"
              - "注文処理を在庫・優先度・作業計画の仕事へ分割して扱える。"
            M1:
              - "指示文を数個に分けて記載すれば、担当の違いを決めずに協働が生まれる。"
              - "異なる担当が異なる順序を提案すると、出荷システムは連携できない。"
              - "一度確認した在庫の状態は、更新されても正しい情報として使える。"
            M3:
              - "同じ一つのモデルで在庫確認と計画を順に行うものが、複数エージェントである。"
              - "在庫APIが返した数量そのものが、自ら判断するエージェントの役割を持つ。"
              - "注文条件に応じて処理経路を変えるだけで、主体の連携が成立する。"
      final_test:
        - variant_key: final_test_v1
          role_rotation: 3
          scenario: "空港の運航支援AIは、遅延便を調べる担当と乗り継ぎ可能性を検討する担当が情報を共有して案内を作る。"
          task: "複数エージェントの構成と、単なる機能呼び出しとの違いを示す説明を3つ選びなさい。"
          choices:
