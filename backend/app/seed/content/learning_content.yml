      l0: "マルチエージェントとは何かを、役割分担、タスク分解、情報共有に触れて説明してください。"
      transfer: "調査・計画・実行を別々の担当に任せるAIシステムを設計するとき、エージェント間の情報受け渡しをどのように設計するか説明してください。"
    learning:
      enrichment:
        material: "マルチエージェントを、複数の役割を持つエージェントが課題を分担し、情報を交換して結果を統合する仕組みとして整理します。"
        variants:
          - {variant_key: learning_enrichment_v1, body: "マルチエージェントにおける役割分担の意味を説明しなさい。", options: *multi_agent_options}
          - {variant_key: learning_enrichment_v2, body: "複雑な課題をタスク分解する利点を説明しなさい。", options: *multi_agent_options}
          - {variant_key: learning_enrichment_v3, body: "エージェント間の情報共有が必要な理由を説明しなさい。", options: *multi_agent_options}
          - {variant_key: learning_enrichment_v4, body: "複数のエージェントの結果を統合する流れを説明しなさい。", options: *multi_agent_options}
          - {variant_key: learning_enrichment_v5, body: "マルチエージェントの基本構造を、役割と連携に触れて説明しなさい。", options: *multi_agent_options}
      conceptual_change:
        material: "複数の処理があるだけではマルチエージェントとは限りません。役割、目的、判断、情報交換を持つ単位としてエージェントを捉えます。"
        variants:
          - {variant_key: learning_conceptual_change_v1, body: "単なる処理分割とマルチエージェントの違いを説明しなさい。", options: *multi_agent_options}
          - {variant_key: learning_conceptual_change_v2, body: "ツールとエージェントの役割の違いを説明しなさい。", options: *multi_agent_options}
          - {variant_key: learning_conceptual_change_v3, body: "マルチエージェントにおいて、役割と情報交換がどのように関係するか説明しなさい。", options: *multi_agent_options}
          - {variant_key: learning_conceptual_change_v4, body: "一つの大きなモデルと複数エージェントの設計上の違いを説明しなさい。", options: *multi_agent_options}
          - {variant_key: learning_conceptual_change_v5, body: "マルチエージェントを、処理数ではなく自律的な役割と連携の観点から説明しなさい。", options: *multi_agent_options}

  - slug: memory_process
    label: "記憶プロセス"
    description: "記憶プロセスは、過去の対話や経験から必要な情報を保存・検索・更新し、現在の応答や次の処理に活用する仕組みである。"
    keywords: [記憶プロセス, 保存, 検索, 更新, 自己評価, 振り返り]
    component_terms: [記憶の保存, 記憶の検索, 記憶の更新, 振り返り]
    rag_sections: ["5.1.1"]
    questions:
      pretest:
        - variant_key: pretest_v1
          role_rotation: 6
          scenario: "健康相談AIは、利用者が伝えた食事上の希望を次回の提案にも生かしたい。希望が変わったときは古い内容をそのまま使わない。"
          task: "過去情報を次の応答へ活用する設計について正しい説明を3つ選びなさい。"
          choices:
            correct:
              - "希望の要点を保存し、次回の提案を作るときに必要な情報を取り出す。"
              - "利用者から変更を聞いたら、以前の記録を確かめて内容を更新する。"
              - "応答後の振り返りを記録し、次の提案に必要な範囲で参照する。"
            M1:
              - "一度受け取った希望は、会話の全文を永久に同じ形で保存し続ける。"
              - "保存された食事情報は、古くなっても確認せず常に正しいものとして使う。"
              - "応答を自己評価すれば、結果を保存しなくても次回の提案は自動で変わる。"
            M3:
              - "利用者の希望を記憶することは、訓練によってモデルの重みを変えることだ。"
              - "過去の希望を扱う記憶とは、外部文書を検索するRAGと同じ仕組みである。"
              - "前回の会話を毎回入力欄へ貼り付ければ、保存や更新の機能も備わる。"
      retest:
        - variant_key: retest_v1
          role_rotation: 0
          scenario: "料理提案サービスは、利用者が避けたい食材を次回の献立にも反映する。利用者が考えを変えた場合は登録内容を直す。"
          task: "このサービスで過去情報を管理する方法について正しい説明を3つ選びなさい。"
          choices:
            correct:
              - "避けたい食材を要点として保存し、献立を考える際に取り出して使える。"
              - "希望の変更を受けたら、保存済みの条件を新しい内容に合わせて更新する。"
              - "献立への反応を記録し、次の提案で必要な情報だけを参照できる。"
            M1:
              - "過去の食事相談は、内容を選ばず全文のまま期限なく蓄積する必要がある。"
              - "一度保存した食材の好みは、利用者に聞き直さなくても正しいままである。"
              - "提案を振り返る機能があれば、記録先を用意しなくても次回に反映される。"
            M3:
              - "好みを保持する記憶機能は、モデルのパラメーターを追加学習する工程である。"
              - "過去の希望を使う記憶機能は、公開文書を探すRAGそのものを指している。"
              - "相談履歴を毎回プロンプトに加えるだけで、情報の更新機能まで実現できる。"
        - variant_key: retest_v2
          role_rotation: 3
          scenario: "問い合わせ窓口は、利用者が以前に指定した連絡方法を次回の案内に使う。新しい指定があれば以前の情報と置き換える。"
          task: "記録を次の応答へ引き継ぐ設計として正しい説明を3つ選びなさい。"
          choices:
            correct:
              - "連絡方法を必要な形で保存し、次の案内を作る前に検索して利用する。"
              - "新しい指定が届いたとき、古い記録を確認して内容を差し替えられる。"
              - "過去の案内結果を振り返り、次回に関係する要点を参照できる。"
            M1:
              - "連絡方法を一度記録したら、その後に変更されても以前の値を保ち続ける。"
              - "利用者が以前に伝えた内容は、時期にかかわらず必ず現在も正しい。"
              - "過去の応答を評価するだけで、評価結果を保存せず次の案内へ反映できる。"
            M3:
              - "連絡方法の記憶とは、追加訓練でモデル内部の数値を書き換えることである。"
              - "過去の利用者情報を使う機能は、一般資料を検索するRAGと完全に同じである。"
              - "前回のやり取りを入力へ再掲するだけで、継続的な記録管理が成立する。"
        - variant_key: retest_v3
          role_rotation: 6
          scenario: "プロジェクト支援AIは、会議で決まった担当と期限を次の進捗確認で参照する。決定が変われば記録も見直す。"
          task: "過去の決定事項を適切に扱う方法について正しい説明を3つ選びなさい。"
          choices:
            correct:
              - "担当や期限の要点を保存し、進捗を確認するときに検索して使う。"
              - "会議で決定が変更されたら、以前の内容を確認して記録を更新する。"
              - "前回の振り返りを残し、次の確認に関係する情報を選んで参照する。"
            M1:
              - "会議の発言は、重要度にかかわらず一字一句を永久に記録する必要がある。"
              - "一度決まった担当や期限は、後で変更されても正しい情報として使い続ける。"
              - "会議を自己評価すれば、評価内容を保存しなくても次の計画は自動で改善する。"
            M3:
              - "決定事項を保持する仕組みは、モデルの重みを訓練データで更新する方式である。"
              - "会議履歴の記憶は、外部の規程文書を検索するRAGと同じ処理を意味する。"
              - "直前の会議録を毎回入力へ追加するだけで、保存と更新も行われている。"
        - variant_key: retest_v4
          role_rotation: 0
          scenario: "読書案内サービスは、利用者が以前に読みたいと話したテーマを次の推薦に利用する。関心が変化したら古い記録を修正する。"
          task: "推薦に過去の情報を生かす仕組みとして正しい説明を3つ選びなさい。"
          choices:
            correct:
              - "関心の要点を保存しておき、推薦を作る時に必要な記録を検索する。"
              - "利用者の新しい関心を確認したら、以前の記録を更新してから推薦する。"
              - "推薦結果への反応を記録し、次回に役立つ内容を選んで参照する。"
            M1:
              - "最初に伝えられた関心は、後から変わっても以前のまま保管しておく。"
              - "保存した読書履歴は、内容や時期を確認せず常に正しい好みとみなす。"
              - "推薦を振り返るだけで、その評価を記録しなくても次の候補は自動で変わる。"
            M3:
              - "読書履歴を覚える処理は、モデルの学習済み重みを直接更新する方法である。"
              - "利用者の関心を扱う記憶は、書籍情報を探すRAGと同一の仕組みである。"
              - "以前の会話文を毎回プロンプトへ貼れば、記憶の検索や更新も行われる。"
        - variant_key: retest_v5
          role_rotation: 3
          scenario: "家計相談AIは、前回確認した月ごとの支出目標を次の助言に使う。目標額の変更を受けたときは新しい内容を反映する。"
          task: "記録の保存・検索・更新について正しい説明を3つ選びなさい。"
          choices:
            correct:
              - "支出目標を保存し、次の相談で必要な金額を取り出して助言に使う。"
              - "目標額が変わったら、古い記録を見直して最新の値へ更新する。"
              - "以前の助言を振り返り、次の相談に関係する要点を参照できる。"
            M1:
              - "最初の目標額は、利用者が変更を伝えた後も元の値のまま保ち続ける。"
              - "保存済みの支出情報は、確認や更新をしなくても常に正確である。"
              - "助言を自己評価すれば、結果の保存がなくても次の回答へ自動で反映される。"
            M3:
              - "相談内容を記憶するとは、モデルのパラメーターを追加訓練することである。"
              - "過去の目標を利用する処理は、外部資料を探すRAGそのものと同じである。"
              - "前回の相談を入力文に再掲するだけで、保存情報の更新まで実現する。"
      final_test:
        - variant_key: final_test_v1
          role_rotation: 6
          scenario: "旅行案内AIは、利用者が前回指定した移動上の希望を次の行程作成に使う。希望の変更があれば過去の内容をそのまま使わない。"
          task: "次の案内に過去情報を生かす方法について正しい説明を3つ選びなさい。"
          choices:
            correct:
              - "移動の希望を保存し、次の行程を考える時に必要な内容を取り出す。"
              - "希望の変更を受けたら、以前の記録を確かめて新しい情報へ更新する。"
              - "前回の行程への反応を記録し、次の提案に必要な範囲で参照する。"
            M1:
              - "移動の希望は、利用者が変えた後も最初の内容を永久に保管する。"
              - "保存された旅行条件は、確認しなくても次の計画で常に正しい。"
              - "行程を振り返れば、その記録を残さずとも次回の計画は自動で変化する。"
            M3:
              - "過去の希望を持つ機能は、追加訓練でモデルの重みを更新する方法である。"
              - "利用者の履歴を扱う記憶処理は、観光案内を探すRAGと同じ仕組みである。"
              - "前回の会話を入力へ貼り付けるだけで、記憶の保存や更新が成立する。"
      l0: "記憶プロセスを、保存、検索、更新、振り返りの関係に触れて説明してください。"
      transfer: "対話型AIが過去の相談内容を次回の応答に活用する仕組みを設計するとき、保存・検索・更新の流れを説明してください。"
    learning:
      enrichment:
        material: "記憶プロセスを、必要な情報を保存し、検索して現在の処理へ渡し、必要に応じて更新する流れとして整理します。"
        variants:
          - {variant_key: learning_enrichment_v1, body: "記憶プロセスにおける保存・検索・更新の役割を説明しなさい。", options: *memory_process_options}
          - {variant_key: learning_enrichment_v2, body: "過去の対話を次の応答へ活用する流れを説明しなさい。", options: *memory_process_options}
          - {variant_key: learning_enrichment_v3, body: "記憶を検索する処理が必要な理由を説明しなさい。", options: *memory_process_options}
          - {variant_key: learning_enrichment_v4, body: "記憶を更新する処理が必要な場面を説明しなさい。", options: *memory_process_options}
          - {variant_key: learning_enrichment_v5, body: "記憶プロセスの基本的な流れを、過去情報の利用に触れて説明しなさい。", options: *memory_process_options}
      conceptual_change:
        material: "記憶プロセスは、モデルの重みそのものでも、会話を無条件に貼り付けるだけの処理でもありません。何を保存し、どう検索・更新するかを設計する仕組みです。"
        variants:
          - {variant_key: learning_conceptual_change_v1, body: "記憶プロセスとモデルの学習済み重みの違いを説明しなさい。", options: *memory_process_options}
          - {variant_key: learning_conceptual_change_v2, body: "記憶プロセスとRAGの共通点・相違点を説明しなさい。", options: *memory_process_options}
          - {variant_key: learning_conceptual_change_v3, body: "会話をそのまま貼り付けることと記憶プロセスの違いを説明しなさい。", options: *memory_process_options}
          - {variant_key: learning_conceptual_change_v4, body: "振り返りや自己評価を記憶の更新へつなげる意味を説明しなさい。", options: *memory_process_options}
          - {variant_key: learning_conceptual_change_v5, body: "記憶プロセスを保存・検索・更新の設計として説明しなさい。", options: *memory_process_options}
