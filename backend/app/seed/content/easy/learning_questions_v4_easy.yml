version: 4
terms:
  llm_knowledge:
    variants:
    - variant_key: learning_round_v1
      scenario_type: application
      scenario: 買った道具の使い方をAIに聞く。新しい説明書を使わせ、短い手順で答えさせたい。
      task: 適切な対応を3つ選びなさい。
      choices:
        correct:
        - 説明書の必要な部分を探し、今回の質問と一緒にAIへ渡す。
        - 短い手順で答えるように、質問時の指示へ書いて伝える。
        - 資料を読む処理と、回答例で追加学習する処理を分けて考える。
        M1:
        - 説明書を一度渡せばAI自体に学習されると考え、以後は資料を省く。
        - 短く答える指示を書くだけで、AI自体の学習内容も変わると考える。
        - 質問に例を添えれば追加訓練も済むと考え、学習用データは用意しない。
        M3:
        - RAGをAI自体を訓練する工程として使い、説明書を登録して学習を終える。
        - プロンプトを説明書の保存庫として使い、資料名だけで本文を保管する。
        - 説明書を取り出す検索の代わりに、ファインチューニングへ質問を送る。
      choice_rationales:
        D: 資料を入力するだけで学習済みのモデルも更新されるという効果の誤り。
        E: 出力形式への指示とモデルの学習内容の変化を因果的に結びつける誤り。
        F: 質問に例を添えるだけで訓練が終わるという学習条件の誤り。
        G: 資料を検索して入力へ渡すRAGを、重みを変える訓練工程に分類している。
        H: 入力となる指示文を、資料本文を保存して検索できる保管庫に分類している。
        I: 訓練データからモデルを調整する処理を、質問に応じて資料を取り出す検索処理に分類している。
    - variant_key: learning_round_v2
      scenario_type: prediction
      scenario: 同じAIに「短く答えて」と送った後、「詳しく答えて」と送った。追加学習は行っていない。
      task: この場面について正しい説明を3つ選びなさい。
      choices:
        correct:
        - 指示に合わせて答えの長さが変わっても、AI自体が学習したとは限らない。
        - 質問と一緒に送る指示が変わると、その回答の書き方も変わり得る。
        - AI自体の学習内容を変えるには、指示を送るのとは別の訓練を行う。
        M1:
        - 答えの長さが変わったので、AI自体の学習内容も更新されたと判断する。
        - 詳しく答える指示を送ったので、別の会話でもその形を学習済みと判断する。
        - 回答に新しい情報が出たので、その情報もAI自体に保存されたと判断する。
        M3:
        - 指示の編集を追加学習と同じ工程とみなし、訓練したことにする。
        - AIを追加訓練する処理を、質問文の書き直しだけで済む操作として扱う。
        - 答えの長さを指定する指示を、外の資料を探す機能として扱う。
      choice_rationales:
        D: 回答の長さの変化からモデル自体も学習されたと判断する効果の誤り。
        E: 一回の指示が別の会話にも学習済みとして残るという持続性の誤り。
        F: 回答に情報が現れるとモデル自体にも保存されるという保存条件の誤り。
        G: 指示文の編集を、訓練データでモデルを調整する追加学習に分類している。
        H: モデルを訓練する処理を、質問文の編集操作に分類している。
        I: 出力の長さを指定する入力文を、外部資料を探す検索機能に分類している。
    - variant_key: learning_round_v3
      scenario_type: comparison
      scenario: AIに新しい案内を読ませる方法と、確認済みの回答例で追加学習させる方法を比べる。
      task: 二つの方法を正しく比べた説明を3つ選びなさい。
      choices:
        correct:
        - 案内を読む方法では、必要な文を質問時に渡して回答に使わせる。
        - 追加学習の方法では、回答例を学習用データにしてモデルを調整する。
        - 新しい案内を読むことと答え方の追加学習を、別の処理として組み合わせる。
        M1:
        - 案内を回答時に読ませると、AI自体もその場で学習されると判断する。
        - 回答例を一度質問に付けるだけで、モデルへの追加訓練も済んだと判断する。
        - 資料の検索先を変えるだけで、AI内部の学習内容も変わると判断する。
        M3:
        - RAGへの資料登録を訓練の一種として扱い、モデルの追加学習に使う。
        - ファインチューニングを資料検索とみなし、新しい案内文を取り出すのに使う。
        - 追加訓練を指示文の編集と同じ操作とみなし、文面を直すだけで済ませる。
      choice_rationales:
        D: 回答時の資料参照がモデル自体の学習も起こすという効果の誤り。
        E: 入力へ例を添えることだけで訓練が済むという条件の誤り。
        F: 資料の検索先を変えるとモデル内部も変わるという因果関係の誤り。
        G: RAGの検索対象への登録を、モデル自体の訓練に分類している。
        H: モデルを調整するファインチューニングを、資料を取り出す検索処理に分類している。
        I: 追加訓練を、入力する指示文の編集操作に分類している。
  multi_agent:
    variants:
    - variant_key: learning_round_v1
      scenario_type: application
      scenario: 遠足の準備をAIで手伝う。持ち物を調べる担当と、予定を作る担当を分けたい。
      task: 適切な対応を3つ選びなさい。
      choices:
        correct:
        - 二つの担当AIを用意し、調査と予定作りの仕事を別々に割り当てる。
        - 持ち物の調査結果を予定の担当へ渡し、準備の時間を考えさせる。
        - それぞれの結果を合わせ、準備の抜けや予定の無理を確認する。
        M1:
        - 担当の名前を付ければ勝手に情報が渡ると考え、共有する機能を省く。
        - 調べる担当と予定の担当に同じ文を出させ、別の結果を使うのをやめる。
        - 担当が見つけた情報は必ず正しいと考え、内容を確かめず予定に使う。
        M3:
        - 持ち物の一覧表自体を、考えて次の行動を決める担当AIとして扱う。
        - 一回の答えに見出しを二つ付けるだけで、別々のAIの役割を作ったと扱う。
        - 雨か晴れかで処理を分けるだけで、担当AI同士の協力を実現したと扱う。
      choice_rationales:
        D: 役割名を付けるだけで情報共有も起きるという連携条件の誤り。
        E: 役割が違っても同一の文章を出さなければ協力できないという条件の誤り。
        F: 担当が得た情報は必ず正しいという結果の保証についての誤り。
        G: 一覧表というデータを、自分で判断して行動する主体に分類している。
        H: 一回の出力の見出しを、別々に動く主体の役割分担に分類している。
        I: 単純な条件分岐を、複数の主体が情報を受け渡す連携に分類している。
    - variant_key: learning_round_v2
      scenario_type: prediction
      scenario: 調査するAIと予定を作るAIを用意した。しかし調査結果を予定の担当へ送る処理は作っていない。
      task: この場面について正しい説明を3つ選びなさい。
      choices:
        correct:
        - 結果を渡す機能がないので、予定の担当が調査結果を使えるとは限らない。
        - 役割を分けるだけでなく、どの情報を渡すか決める必要がある。
        - 担当が別々の判断をしても、結果を受け渡して一つの案を作れる。
        M1:
        - 二つのAIがあるので、調査結果も自動で予定の担当へ伝わると考える。
        - 役割名があれば渡す内容も順番も決まるので、共有の設計は省けると考える。
        - 調査役が得た情報なので、確認せず予定に使っても正しいと考える。
        M3:
        - 調査結果の文章を担当AIの一人と数え、文章自体に予定を判断させる。
        - 指示の中で手順を二つに分けたものを、別々の主体による協力として扱う。
        - 複数のAIの連携を、一つのモデルの処理速度を上げる機能として扱う。
      choice_rationales:
        D: 二つのAIが存在するだけで情報も伝わるという連携条件の誤り。
        E: 役割名だけで情報の内容や受け渡し順序も決まるという条件の誤り。
        F: 調査役の出力なら確認なしでも正しいという結果の保証についての誤り。
        G: 調査結果というデータを、予定を判断する主体に分類している。
        H: 一つの指示内の手順分割を、別々の主体による連携に分類している。
        I: 複数主体の連携という構成を、単一モデルの計算を高速化する機能に分類している。
    - variant_key: learning_round_v3
      scenario_type: comparison
      scenario: 一つのAIが全部答える案と、調べるAIからまとめるAIへ結果を渡す案を比べる。
      task: 二つの方法を正しく比べた説明を3つ選びなさい。
      choices:
        correct:
        - 担当が分かれているかと、結果を渡す処理があるかを確かめる。
        - 二つのAIを使う案では、別々の役割の結果を合わせて回答を作れる。
        - 同じモデルを使っていても、別の担当として動かして結果を共有できる。
        M1:
        - 二つの担当に分ければ、共有する情報の正しさも保証されると考える。
        - 別の担当でも同じ内容を答えないと協力できないと考え、同じ文を求める。
        - 複数の指示さえ書けば共有も行われると考え、情報を渡す機能を省く。
        M3:
        - 検索で返された資料自体を、役割を持って判断する担当AIとして数える。
        - 一つの答えの中の章分けを、複数のAI同士が協力する仕組みとして数える。
        - 単純な条件分岐を増やしただけの案を、複数主体の連携として扱う。
      choice_rationales:
        D: 役割を分ければ情報の正しさも保証されるという効果の誤り。
        E: 別担当の異なる結果を使うと協力できないという条件の誤り。
        F: 複数の指示を書くだけで共有機能も動くという連携条件の誤り。
        G: 検索された資料というデータを、役割を持つ判断主体に分類している。
        H: 出力文章の章分けを、複数の判断主体間の連携に分類している。
        I: 単純な条件分岐を増やした処理を、複数主体の連携に分類している。
  memory_process:
    variants:
    - variant_key: learning_round_v1
      scenario_type: application
      scenario: 利用者は「例を多くして説明して」と希望した。会話を終えた後の相談にも、この希望を使わせたい。
      task: 適切な対応を3つ選びなさい。
      choices:
        correct:
        - 説明の希望を必要な要点だけ記録し、次回の相談で取り出す。
        - 保存する内容と、次にその記録を使う手順を決めておく。
        - 希望が変わったときに、前の記録を直せるようにしておく。
        M1:
        - 一度聞いた希望は変わらないと考え、その後の変更は確かめず使い続ける。
        - 会話を全部残せば探す処理はいらないと考え、必要な記録を選ぶ機能を省く。
        - 一度答えに使った情報はAI自体に残ると考え、保存する処理を用意しない。
        M3:
        - 希望を記録する仕組みをモデルの訓練とみなし、追加学習だけで置き換える。
        - 記憶を保存する処理を利用者の検索画面とみなし、画面だけを作って済ませる。
        - 今回の質問へ希望を貼るだけで、次回の保存や更新の機能もあるとみなす。
      choice_rationales:
        D: 一度聞いた希望が変更後も正しいという更新条件の誤り。
        E: 会話を全部保存すれば必要な情報を取り出す処理は不要という検索条件の誤り。
        F: 現在の回答への反映だけで次回用にも残るという保存条件の誤り。
        G: 利用者別記録の保存・検索を、モデル自体を訓練する処理に分類している。
        H: 記憶を保存する処理を、利用者が操作する検索画面に分類している。
        I: 今回だけ入力へ文を足す操作を、継続的な保存・検索・更新を備えた記憶機能に分類している。
    - variant_key: learning_round_v2
      scenario_type: prediction
      scenario: AIが覚えていた好みを、利用者が「今は違うものが好き」と変えた。次の相談で使う記録を考える。
      task: この場面について正しい説明を3つ選びなさい。
      choices:
        correct:
        - 新しい好みを保存しておけば、次回に今の希望を読み出せる。
        - 古い記録を直さないまま使うと、今の希望に合わない提案になり得る。
        - 次の相談に関係する記録を選んで取り出し、その回答に使える。
        M1:
        - 前の好みも記録してあるので、今も変わらず正しいものとして使える。
        - 新しい希望を入力しただけで保存先も直ると考え、更新する処理を省く。
        - 一度答えに使えば後にも残ると考え、新しい好みを保存しない。
        M3:
        - 記録を取り出す機能をモデルの訓練とみなし、読み出す代わりに追加学習する。
        - 保存した好みの文章自体を検索の仕組みとみなし、取り出す処理を作らない。
        - 記録管理を画面の表示と同じ機能とみなし、希望を画面に出すだけで済ませる。
      choice_rationales:
        D: 以前保存した希望が変更後も正しいという更新条件の誤り。
        E: 新しい入力だけで保存先の記録も更新されるという処理条件の誤り。
        F: 回答に使っただけで次回にも残るという保存条件の誤り。
        G: 既存記録を取り出す検索機能を、モデルの追加訓練に分類している。
        H: 保存された文章というデータ自体を、それを取り出す検索機能に分類している。
        I: 記録の保存・更新の機能を、画面への表示機能に分類している。
    - variant_key: learning_round_v3
      scenario_type: comparison
      scenario: 前の希望をメモに残して次回に使う案と、今回の質問にだけ手で希望を書く案を比べる。
      task: 二つの方法を正しく比べた説明を3つ選びなさい。
      choices:
        correct:
        - 次回も残る保存先と、必要なときに読み出す手順があるか確かめる。
        - 今回の入力に書くだけでは、会話が終わった後にも残るとは限らない。
        - 保存した希望が変わったときに、記録を直せるか確認する。
        M1:
        - 今回の質問へ希望を書くと、別の保存先の記録も更新されると考える。
        - 一度質問に書いたことは、保存しなくても次の会話へ伝わると考える。
        - 同じ言葉を記録すれば、保存の仕方に関係なく必ず同じように探せると考える。
        M3:
        - 質問へ前の文を貼る操作を、保存と読み出しと更新を備えた記憶機能とみなす。
        - メモを残して使う機能を、モデル自体の追加訓練と同じ処理として扱う。
        - 利用者の希望という記録そのものを、利用者が操作する画面の一種として扱う。
      choice_rationales:
        D: 今回の入力への記載で別の保存先も変わるという更新条件の誤り。
        E: 一度入力した希望は保存なしでも会話を越えて残るという保存条件の誤り。
        F: 言葉が同じなら保存方法に関係なく検索結果も同じという検索条件の誤り。
        G: 今回だけ前の文を貼る操作を、継続的な保存・検索・更新を備えた記憶機能に分類している。
        H: 利用者のメモを管理する機能を、モデル自体を訓練する処理に分類している。
        I: 希望という保存データを、利用者が操作する画面の種類に分類している。
