schema_version: 1
version: pretest_v2
questions:
  - target_term: transformer
    body: Transformerの計算構造を最も適切に説明しているものはどれか。
    correct: Attentionで入力内の関係を集約し、FFNで各位置の表現を変換する処理を層状に組み合わせた構造。
    m1: 入力された文章を一つの固定長ベクトルに圧縮し、そのベクトルを知識として保存・検索するための表現形式。
    m2: 入力列を先頭から順に処理し、直前までの隠れ状態を次の位置へ受け渡すことで文脈を表す構造。
    m3: 入力列の各要素を対応する出力要素へ順番に置き換え、主に文章を別の文章へ変換するための構造。
  - target_term: attention
    body: Transformer層におけるAttentionの処理を最も適切に説明しているものはどれか。
    correct: 各トークンと他のトークンの関連度を計算し、その重みで情報を集約して文脈に応じた表現を作る処理。
    m1: 学習時に誤差の大きい入力箇所を選び、その箇所へより多くのパラメータ更新を割り当てる制御機構。
    m2: 各トークンの表現を同じ変換関数に通し、位置ごとに特徴を更新して次の層へ渡す処理。
    m3: 各単語に文全体で一つの重要度を付け、重要度の高い単語を抽出して文の要点を表す処理。
  - target_term: llm_training_process
    body: 本研究で扱うLLMの学習過程の説明として、最も適切なものはどれか。
    correct: 大規模データで基盤能力を獲得し、指示応答の訓練を行い、その後に人間の選好や安全性に合わせて調整する。
    m1: 入力をトークン化し、Attentionで文脈表現を作り、出力確率から次のトークンを選ぶ一連の計算段階。
    m2: 大規模データで学習し、RAGで外部知識を追加し、プロンプトで回答形式を調整する三段階。
    m3: 学習前に初期性能を測定し、訓練データで学習を行い、学習後に同じ指標で性能を再評価する三段階。
  - target_term: pretraining
    body: LLMの事前学習を最も適切に説明しているものはどれか。
    correct: 大規模で多様なデータを用い、次トークン予測などを通じて言語パターンや一般的知識の基盤を獲得する。
    m1: モデルの利用開始前に、入力形式、禁止事項、回答方針をシステムプロンプトとして設定する準備工程。
    m2: 指示と望ましい回答の組を教師ありデータとして学習し、指示に沿う応答能力を獲得する工程。
    m3: 本格的な学習の前に小規模データで予備訓練を行い、学習率やバッチサイズなどの条件を決める工程。
  - target_term: post_training
    body: LLMの事後学習を最も適切に説明しているものはどれか。
    correct: 事前学習済みモデルを、人間の選好や評価を用いて、安全性・有用性・望ましい応答傾向に合わせて調整する。
    m1: 運用開始後の会話ログを監視し、問題のある回答を記録・修正してサービス品質を保つ保守工程。
    m2: 追加の大規模テキストで次トークン予測を続け、モデルの一般知識と言語生成能力をさらに広げる。
    m3: モデルが回答を生成した後、その回答を別の処理で検査・修正してから利用者に提示する後処理工程。
