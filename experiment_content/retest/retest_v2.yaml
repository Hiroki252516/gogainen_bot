schema_version: 1
version: retest_v2
questions:
  - target_term: transformer
    body: 長い入力を扱うモデル構造としてTransformerを説明したもののうち、最も適切なものはどれか。
    correct: Attentionで離れたトークンを含む関係を集約し、FFNで各位置の特徴を変換する処理を層として反復する構造。
    m1: 文章全体を一つの記憶領域へ保存し、必要な知識を後から検索するためのデータ形式。
    m2: 前の位置の隠れ状態を次の位置へ順番に渡す処理だけで、入力列の関係を表す構造。
    m3: 入力文を別の表現へ置換する機能一般であり、内部の計算方法を特定しない名称。
  - target_term: attention
    body: 文中のあるトークンを処理するときのAttentionの働きとして、最も適切なものはどれか。
    correct: 他のトークンとの関連度を求め、その重みに応じて複数の情報を組み合わせ、文脈に応じた表現を作る。
    m1: モデルが重要な箇所へ人間のような意識を向け、不要な情報を心理的に無視する。
    m2: 各トークンを他のトークンと比較せず、同じFFNへ個別に通して特徴を変換する。
    m3: 文全体で重要な単語を一度だけ順位付けし、上位の単語だけを残す。
  - target_term: llm_training_process
    body: LLMを実用的な対話モデルへ仕上げる学習の流れとして、最も適切なものはどれか。
    correct: 事前学習で基盤能力を作り、指示応答を学習し、人間の選好や安全性に合わせる事後学習を行う。
    m1: トークン化、Attentionによる計算、次トークン出力という推論時の処理を順に行う。
    m2: RAG接続、プロンプト作成、Function Calling設定という利用時の機能追加を順に行う。
    m3: 学習前テスト、教材学習、学習後テストという利用者向け実験手順を指す。
  - target_term: pretraining
    body: 事前学習によってLLMが獲得するものを最も適切に説明しているものはどれか。
    correct: 大規模で多様な未ラベルデータの予測学習を通じて、言語パターン、一般知識、生成能力の基盤を獲得する。
    m1: 利用者が入力する前に、禁止事項や回答形式をシステムプロンプトとして登録する。
    m2: 指示と模範回答のペアだけから、利用者の命令に従う能力を獲得する。
    m3: 本学習の条件を決めるため、小規模データで短時間の予備実験だけを行う。
  - target_term: post_training
    body: 事前学習後のモデルに対して行う事後学習の役割として、最も適切なものはどれか。
    correct: 人間の評価や選好を利用して、応答をより安全で有用な方向へ調整する。
    m1: 公開後のサービス障害や会話ログを監視し、運用担当者が保守作業を行う。
    m2: 大規模なWebテキストで次トークン予測を続け、一般知識の量だけを増やす。
    m3: 生成済み回答をルールで検査し、表示直前に文章を修正する後処理を行う。
