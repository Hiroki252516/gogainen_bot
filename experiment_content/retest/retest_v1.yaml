schema_version: 1
version: retest_v1
questions:
  - target_term: transformer
    body: TransformerをRNN型の処理と比べた説明として、最も適切なものはどれか。
    correct: 入力を順番に隠れ状態として渡す処理だけに頼らず、Attentionでトークン間の関係を扱い、FFNで各位置の表現を変換する構造。
    m1: 文章全体を一つの記憶データに変換し、必要な知識を保存して取り出すための仕組み。
    m2: RNNと同じく、前の位置の隠れ状態を次の位置へ渡す逐次処理が中心の構造。
    m3: 名前の通り、入力文を別の言語や別形式へ変換する機能そのもの。
  - target_term: attention
    body: Attentionが文脈に応じた表現を作る仕組みとして、最も適切なものはどれか。
    correct: あるトークンが他のトークンとどの程度関係するかを重みとして計算し、その重みに応じて情報を集約する。
    m1: モデルが人間の集中力のように重要な部分へ意識を向け、心理的に注意を保つ。
    m2: トークン同士の関係は見ず、各トークンを個別に同じ変換へ通すだけの処理。
    m3: 文中の重要そうな単語に印を付け、その単語だけを取り出す処理。
  - target_term: llm_training_process
    body: LLMが基盤モデルから対話で使えるモデルへ近づく流れとして、最も適切なものはどれか。
    correct: 事前学習で基盤能力を作り、指示に従う応答を学び、事後学習で安全性や有用性に合わせて調整する。
    m1: トークン化、Attention計算、次トークン選択という推論時の内部処理を順に行う。
    m2: プロンプト設計、RAG接続、外部ツール呼び出しを設定することが主な学習段階である。
    m3: 初期テスト、学習セッション、再テストという実験参加者向けの手順を指す。
  - target_term: pretraining
    body: 事前学習で主に行われることとして、最も適切なものはどれか。
    correct: 大規模で多様なデータから次トークン予測などを通じて、言語パターンや一般知識の基盤を獲得する。
    m1: 利用前にシステムプロンプトへ注意事項や禁止事項を書き、回答の形式を指定する。
    m2: 指示文と理想回答のペアだけを学び、指示に従う応答を獲得する。
    m3: 本番学習前の小さな試行として、学習条件を決めるためだけに行う。
  - target_term: post_training
    body: 事後学習が事前学習後のモデルに加える役割として、最も適切なものはどれか。
    correct: 人間の評価や選好などを用いて、出力がより安全で有用になるように調整する。
    m1: 公開後の会話ログや障害情報を運用担当者が確認し、サービスを保守する作業。
    m2: Web上の大量テキストで次トークン予測を続け、一般知識を増やすだけの段階。
    m3: 生成された回答を表示前にルールで検査し、文章を整える後処理。
