schema_version: 1
version: final_test_v1
questions:
  - target_term: transformer
    body: Transformerというモデル構造の説明として、最も適切なものはどれか。
    correct: Attentionで入力内の関係を取り込み、FFNで各位置の特徴を変換する層を重ねて表現を作る構造。
    m1: 入力文を一つの知識ベースへ保存し、後から検索できるようにするデータ保存形式。
    m2: 入力を左から右へ順番に読み、前時刻の隠れ状態だけを次へ渡して処理する構造。
    m3: 文章を別の文章へ変換する機能一般を指し、AttentionやFFNなどの内部構造は含まない。
  - target_term: attention
    body: Attentionの説明として、最も適切なものはどれか。
    correct: 各トークンが他のトークンからどの情報をどれだけ使うかを重みによって決め、情報を集約する処理。
    m1: AIが人間と同じように集中し、重要な情報へ意識を向ける心理的能力。
    m2: 各トークンを独立に変換するFFNと同じ処理で、トークン間の関係は扱わない。
    m3: 文章から重要語だけを選び、その語を並べて要約を作る処理。
  - target_term: llm_training_process
    body: LLMの学習段階を説明したものとして、最も適切なものはどれか。
    correct: 事前学習で基盤能力を得て、指示応答の学習を行い、事後学習で人間の選好や安全性に合わせる。
    m1: 入力をトークンに分け、文脈計算を行い、次に出すトークンを決める推論処理の流れ。
    m2: RAG、プロンプト、Function Callingのような利用時の機能設定の並び。
    m3: 参加者が初期テストを受け、教材で学び、最終テストを受ける実験手順。
  - target_term: pretraining
    body: LLMにおける事前学習の目的として、最も適切なものはどれか。
    correct: 大量で多様なデータを使った予測学習により、言語理解・生成や一般知識の土台を作る。
    m1: 利用者が入力する前に、システム側で回答方針や禁止事項を指定しておくこと。
    m2: 指示と模範回答だけを学習し、チャットで指示に従う振る舞いを身につけること。
    m3: 大規模学習の前に小規模な予備実験だけを行い、設定値を調整すること。
  - target_term: post_training
    body: LLMの事後学習の説明として、最も適切なものはどれか。
    correct: 事前学習済みモデルを、人間評価や選好などに基づいて、安全で有用な応答へ調整する段階。
    m1: サービス公開後にログを監視し、運用上の問題を記録して修正する保守段階。
    m2: 事前学習と同じ次トークン予測を大量テキストで続け、知識量だけを増やす段階。
    m3: モデルが回答した後、表示直前に別処理で文章を検査・修正する段階。
