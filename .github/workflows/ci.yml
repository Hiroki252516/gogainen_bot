name: CI

on:
  pull_request:
    branches: [main, hiroki-app, soma1025]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-shards:
    name: Backend tests (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          AI_BACKEND: mock
        run: python -m pytest -q -p ci_shard --ci-shard ${{ matrix.shard }} --ci-shards 5 --durations=20

  backend-tests:
    name: Backend tests
    if: always()
    needs: backend-test-shards
    runs-on: ubuntu-latest
    steps:
      - name: Check all backend shards
        env:
          SHARDS_RESULT: ${{ needs.backend-test-shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "Backend test shards did not all succeed: $SHARDS_RESULT"
            exit 1
          fi
          echo "All backend test shards passed."

  frontend-checks:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
