# Local Docker settings. Copy this file to docker-compose.override.yml when
# using the Unix-socket app-server setup locally. The copied file is ignored
# because the actual override is machine-specific.
services:
  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"
    build:
      args:
        INTERNAL_API_BASE_URL: http://backend:8000
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ""
  backend:
    network_mode: !reset null
    networks:
      - default
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/ai_tutor
      CODEX_APP_SERVER_URL: unix:///codex-app-server.sock
    volumes:
      - type: bind
        source: ./.local/codex-app-server/server.sock
        target: /codex-app-server.sock
        read_only: true
        bind:
          create_host_path: false
      - ./.local/backend-data:/app/.local
