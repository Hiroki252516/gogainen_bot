services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/ai_tutor
      AI_BACKEND: codex_app_server
      CODEX_APP_SERVER_URL: ws://host.docker.internal:4500
      CODEX_WS_TOKEN_FILE: /run/secrets/codex_ws_token
      CODEX_APP_SERVER_CWD: /tmp
      CODEX_TURN_TIMEOUT_SEC: "120"
      CODEX_REASONING_EFFORT: low
      MAX_LEARNING_TARGETS: "5"
      MAX_TURNS_PER_TERM: "3"
      RANDOM_SEED: "20260525"
      EXPORT_DIR: /app/exports
      EXPERIMENT_CONTENT_DIR: /experiment_content
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - ./exports:/app/exports
      - ./rag_ready_教材:/rag_ready_教材:ro
      - ./experiment_content:/experiment_content:ro
      - ./.local/codex-ws-token:/run/secrets/codex_ws_token:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ai_tutor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_tutor"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  pgdata:
