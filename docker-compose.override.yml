# Local WSL settings; keep the existing .env intact.
# Docker Compose loads this file automatically.
services:
  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"
    build:
      args:
        INTERNAL_API_BASE_URL: http://backend:8000
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ""
  backend:
    # Remove the base host network setting and join frontend/db's project network.
    network_mode: !reset null
    networks:
      - default
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/ai_tutor
      CODEX_APP_SERVER_URL: unix:///codex-app-server.sock
    volumes:
      # Start scripts/start-codex-app-server.sh --docker before creating backend.
      # Mount the socket itself: Codex may make the visible path a symlink.
      - type: bind
        source: ./.local/codex-app-server/server.sock
        target: /codex-app-server.sock
        read_only: true
        bind:
          create_host_path: false
      # Preserve the SQLite database used by the existing .env across rebuilds.
      - ./.local/backend-data:/app/.local
